<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nephora Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8f0; --bar:#ffffff; --violet:#7b5cff; --violet2:#6a3df5; --pink:#ff3d8b; --orange:#ff8a00; --cyan:#22b8f0;
  --row:#ffffff; --rowline:#ece4ff; --ink:#1f1640; --muted:#7a7196; --green:#0fb46b;
  --grad:linear-gradient(90deg,#ff3d8b,#a24bff 50%,#22b8f0);
  --gold:#ffc83d; --silver:#d9dde8; --bronze:#d08a4c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow-x:hidden}
body{background:radial-gradient(1200px 700px at 0% 0%,#ffe1ef 0%,transparent 60%),radial-gradient(1100px 700px at 100% 10%,#dff3ff 0%,transparent 60%),radial-gradient(900px 600px at 50% 100%,#fff1c7 0%,transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.num{font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}

/* ===== top bar ===== */
.top{height:64px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);display:flex;align-items:center;gap:28px;padding:0 32px;box-shadow:0 6px 24px -14px rgba(123,92,255,.5)}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.14em;font-size:18px;color:var(--ink)}
.logo i{width:32px;height:32px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:900;box-shadow:0 4px 14px -4px rgba(255,61,139,.7)}
.nav{display:flex;gap:6px;margin:0 auto;flex-wrap:wrap}
.nav a{font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;border-radius:99px;color:#4b3f75}
.nav a:hover{background:#f3eeff}
.nav a.on{background:var(--grad);color:#fff;box-shadow:0 6px 18px -6px rgba(162,75,255,.8)}
.live{display:flex;align-items:center;gap:8px;border:1.5px solid #22c55e;background:#ecfdf3;color:#15803d;border-radius:99px;padding:6px 14px;font-size:12px;font-weight:800;letter-spacing:.08em}
.live i{width:8px;height:8px;border-radius:50%;background:#ef4444;animation:blink 1.4s infinite}
.live.off{border-color:#ef4444;background:#fef2f2;color:#dc2626}
@keyframes blink{50%{opacity:.25}}
.clock{background:linear-gradient(90deg,#ff8a00,#ff3d8b);color:#fff;border-radius:99px;padding:8px 16px;font-weight:700;font-size:14px;box-shadow:0 6px 18px -8px rgba(255,61,139,.8)}
.band{height:46px;background:linear-gradient(90deg,#ff8a00,#ff3d8b 35%,#a24bff 70%,#22b8f0);display:flex;align-items:center;justify-content:center}
.band .chip{background:#fff;color:var(--ink);border-radius:99px;padding:6px 18px;font-size:13px;font-weight:700;display:flex;gap:10px;align-items:center;box-shadow:0 4px 14px -6px rgba(0,0,0,.25)}
.band .chip em{font-style:normal;color:#e11d74}

/* ===== layout ===== */
.wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:36px;padding:0 40px 28px;height:calc(100vh - 110px);min-height:720px}
.left{display:flex;flex-direction:column;min-height:0}
.right{display:flex;flex-direction:column;min-height:0;padding-top:34px}
@media (max-width:1200px), (orientation:portrait){
  .wrap{grid-template-columns:1fr;height:auto;padding:0 16px 28px;gap:12px}
  .right{padding-top:0}
  .top{padding:0 16px;gap:12px;height:auto;min-height:64px;flex-wrap:wrap;padding-block:10px}
}

/* ===== hero ===== */
.hero{position:relative;padding-top:20px;text-align:center}
.hero::before{content:"";position:absolute;left:-40px;right:-40px;top:-2px;height:150px;border-radius:0 0 50% 50%/0 0 100% 100%;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,61,139,.28) 0%,rgba(162,75,255,.16) 45%,transparent 75%);z-index:0}
.title{position:relative;z-index:1;display:inline-flex;align-items:center;gap:14px;font-weight:800;font-size:clamp(28px,3vw,52px);letter-spacing:-.01em;color:var(--ink)}
.title b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.title svg{width:1.1em;height:1.1em;filter:drop-shadow(0 4px 10px rgba(255,138,0,.5))}
.sub{position:relative;z-index:1;color:#6b5e95;font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;margin-top:2px}

.podium{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr) minmax(0,1fr);gap:26px;align-items:end;max-width:760px;margin:40px auto 0}
.pc{position:relative;border-radius:18px;padding:46px 16px 18px;text-align:center;color:#fff}
.pc .crown{position:absolute;left:50%;top:-38px;transform:translateX(-50%);width:62px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.pc .laurel{position:absolute;right:-10px;top:-14px;width:34px}
.pc .av{width:84px;height:84px;margin:-6px auto 10px}
.pc .lb{font-size:10px;font-weight:700;letter-spacing:.12em;opacity:.85;text-transform:uppercase}
.pc .nm{font-weight:800;font-size:clamp(14px,1.15vw,19px);margin:2px 0 8px;line-height:1.2;min-height:2.4em;display:flex;align-items:center;justify-content:center}
.pc .v{font-weight:800;font-size:clamp(16px,1.35vw,22px);margin-top:2px}
.pc .pill{display:inline-block;margin-top:12px;background:#fff;color:var(--ink);border-radius:99px;padding:8px 18px;font-weight:700;font-size:clamp(12px,.95vw,15px);min-width:70%;box-shadow:0 4px 12px -6px rgba(0,0,0,.3)}
.pc.p2{background:linear-gradient(160deg,#7ee0ff 0%,#22b8f0 50%,#3b6cf5 100%);box-shadow:0 18px 40px -18px rgba(34,184,240,.9)}
.pc.p3{background:linear-gradient(160deg,#ffb3d0 0%,#ff5c9d 50%,#e8237a 100%);box-shadow:0 18px 40px -18px rgba(255,61,139,.9)}
.pc.p1{background:linear-gradient(160deg,#fff08a 0%,#ffc21a 45%,#ff8a00 100%);color:#3d1f00;padding-top:56px;padding-bottom:24px;box-shadow:0 0 0 3px #fff,0 22px 50px -16px rgba(255,138,0,.95)}
.pc.p1 .av{width:100px;height:100px}
.pc.p1 .pill{background:#3d1f00;color:#fff}
.pc.p1 .bolt{position:absolute;inset:-10px;pointer-events:none}
.pc.empty{opacity:.45}

.av{border-radius:50%;background:linear-gradient(135deg,#efe7ff,#ffe3f0);display:grid;place-items:center;font-weight:800;color:#6a3df5;overflow:hidden;flex:none;box-shadow:0 0 0 3px #fff}
.av img{width:100%;height:100%;object-fit:cover}
.p1 .av{box-shadow:0 0 0 4px #fff,0 8px 24px rgba(255,138,0,.6)}
.p2 .av,.p3 .av{box-shadow:0 0 0 4px #fff}

.chev{margin:22px auto 4px;width:22px;opacity:.9;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.timer{text-align:center}
.timer h4{margin:0 0 10px;font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--ink)}
.timer h4 em{font-style:normal;color:#e11d74}
.tt{display:flex;gap:14px;justify-content:center}
.tt div{text-align:center}
.tt b{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid #e3d8ff;font-size:17px;font-weight:800;color:#6a3df5;box-shadow:0 6px 16px -8px rgba(123,92,255,.6)}
.tt div:last-child b{color:#fff;border-color:transparent;background:var(--grad)}
.tt span{display:block;margin-top:6px;font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--muted)}

/* ===== day leaders ===== */
.days{margin-top:auto;padding-top:22px}
.days h3{text-align:center;margin:0 0 46px;font-size:13px;letter-spacing:.16em;font-weight:700;color:var(--ink)}
.days h3 em{font-style:normal;color:#e11d74}
.dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;max-width:760px;margin:0 auto}
.dc{position:relative;border:2px solid #ece4ff;border-radius:16px;background:#fff;padding:44px 12px 14px;text-align:center;box-shadow:0 14px 30px -20px rgba(123,92,255,.7)}
.dc .av{position:absolute;left:50%;top:-34px;transform:translateX(-50%);width:66px;height:66px}
.dc .rk{position:absolute;left:calc(50% + 18px);top:16px;width:24px;height:24px;border-radius:50%;background:var(--grad);color:#fff;border:2px solid #fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.dc .nm{font-weight:700;font-size:14px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc .lb{font-size:9.5px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.dc .v{font-weight:800;font-size:17px;margin:1px 0 6px;color:var(--ink)}
.dc .btn{display:inline-block;background:linear-gradient(90deg,#ff8a00,#ff3d8b);color:#fff;border-radius:99px;padding:6px 16px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 6px 16px -8px rgba(255,61,139,.9)}
.dc.c1{border-color:#ffc21a;background:linear-gradient(180deg,#fffbe6,#fff)}
.dc.c1 .av{box-shadow:0 0 0 4px #ffc21a,0 8px 22px rgba(255,138,0,.5)}
.dc.none{opacity:.45}

/* ===== table ===== */
.thead,.tr{display:grid;grid-template-columns:90px minmax(0,1fr) 90px 150px 170px;align-items:center;gap:12px}
.all .thead,.all .tr{grid-template-columns:90px minmax(0,1fr) 110px 80px 150px 170px}
.thead{background:var(--grad);border-radius:99px;height:46px;padding:0 24px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff;box-shadow:0 12px 30px -14px rgba(162,75,255,.9)}
.thead .r,.tr .r{text-align:right}
.rows{flex:1;min-height:0;margin-top:22px;position:relative;overflow:hidden}
.rows .pg{display:flex;flex-direction:column;gap:12px;transition:opacity .5s}
.tr{height:46px;border-radius:99px;background:var(--row);border:1.5px solid var(--rowline);padding:0 24px 0 0;position:relative;overflow:hidden;font-size:14px;color:var(--ink);box-shadow:0 6px 16px -12px rgba(123,92,255,.6)}
.tr:nth-child(3n+1) .pl{background:linear-gradient(90deg,#ff3d8b,#ff7bb0 70%,transparent)}
.tr:nth-child(3n+2) .pl{background:linear-gradient(90deg,#a24bff,#c79bff 70%,transparent)}
.tr:nth-child(3n) .pl{background:linear-gradient(90deg,#22b8f0,#8adcff 70%,transparent)}
.tr .pl{height:100%;display:grid;place-items:center;font-weight:800;color:#fff;padding-left:10px}
.tr .mg{display:flex;align-items:center;gap:12px;min-width:0;font-weight:600}
.tr .mg .av{width:30px;height:30px;font-size:11px;box-shadow:0 0 0 2px #fff,0 0 0 3px #ece4ff}
.tr .mg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .dp{color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .c{text-align:center;color:#6a3df5;font-weight:700}
.tr .g{color:var(--green);font-weight:700}
.tr .w{color:var(--ink);font-weight:800}
.tr.zero .g{color:var(--muted);font-weight:500}
.tr.up{animation:flash 1.6s ease 2}
@keyframes flash{50%{border-color:var(--green);box-shadow:0 0 18px -4px rgba(15,180,107,.8)}}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px;min-height:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:#e3d8ff}
.dots i.on{background:#ff3d8b}
.note{text-align:center;color:#6b5e95;font-size:12px;font-weight:600;letter-spacing:.04em;margin-top:14px;line-height:1.6}
.note b{color:var(--ink)}.note em{font-style:normal;color:#e11d74}
.empty{color:var(--muted);text-align:center;padding:30px}
.err{margin:12px 40px 0;background:#fff1f2;border:1px solid #fda4af;color:#be123c;padding:10px 16px;border-radius:12px;font-weight:600}

/* coins */
.coin{position:fixed;pointer-events:none;border-radius:50%;z-index:0;animation:float 7s ease-in-out infinite}
.coin.g{width:54px;height:54px;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc83d 40%,#e08a00 85%);transform:rotate(35deg) scaleX(.45)}
.coin.s{width:70px;height:70px;background:radial-gradient(circle at 35% 30%,#fff,#8adcff 45%,#22b8f0 90%);transform:rotate(-25deg) scaleY(.55)}
@keyframes float{50%{translate:0 -14px}}
.left,.right,.top,.band{position:relative;z-index:1}

/* portrait / phone */
@media (max-width:700px){
  .podium{gap:8px;margin-top:34px}.pc{padding:40px 6px 12px}.pc .av{width:56px;height:56px}.pc.p1 .av{width:66px;height:66px}
  .pc .crown{width:44px;top:-28px}.pc .pill{padding:6px 8px;font-size:11px;min-width:0}
  .thead,.tr,.all .thead,.all .tr{grid-template-columns:44px minmax(0,1fr) 88px 96px;gap:8px}
  .thead .hx,.tr .hx{display:none}
  .thead{padding:0 12px;font-size:10px}.tr{font-size:12px;padding-right:12px}
  .dl{gap:10px}.dc{padding:40px 6px 10px}.dc .v{font-size:14px}
  .nav a{padding:6px 10px;font-size:11px}
  .hero::before{left:-16px;right:-16px}
}
</style>
</head>
<body>
<div class="coin g" style="left:3%;top:52%"></div>
<div class="coin s" style="left:2%;top:16%;animation-delay:-3s"></div>

<header class="top">
  <div class="logo"><i>N</i>NEPHORA</div>
  <nav class="nav" id="nav"></nav>
  <span class="live" id="live"><i></i>LIVE</span>
  <span class="clock num" id="clock">--:--:--</span>
</header>
<div class="band"><div class="chip" id="chip">🏆 <span>Касса</span> <em>Nephora</em></div></div>
<div id="msg"></div>

<main class="wrap" id="wrap">
  <section class="left">
    <div class="hero">
      <div class="title" id="title"></div>
      <div class="sub" id="subt">Рейтинг месяца</div>
      <div class="podium" id="podium"></div>
    </div>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="#ff3d8b" stroke-width="2.5" stroke-linecap="round"><path d="M5 6l7 6 7-6M5 13l7 6 7-6"/></svg>
    <div class="timer">
      <h4>ДО КОНЦА <em>МЕСЯЦА</em></h4>
      <div class="tt num" id="tt"></div>
    </div>
    <div class="days">
      <h3>ЛИДЕРЫ <em>ДНЯ</em></h3>
      <div class="dl" id="dl"></div>
    </div>
  </section>
  <section class="right">
    <div class="tbl" id="tbl">
      <div class="thead" id="thead"></div>
    </div>
    <div class="rows" id="rows"></div>
    <div class="dots" id="dots"></div>
    <div class="note" id="note"></div>
  </section>
</main>

<script>
/* ===== Конфигурация ===== */
const CFG = {
  tz: 'Asia/Almaty', tzOffset: '+05:00',
  orderDateField: 'UF_CRM_1784559416867', // «Дата заказа» — по нему считается день заказа
  // Стадии «факт кассы»: Первичный → Заказ, Заказ на подтверждение; Доставка → Заказ, Заказ на подтверждение, Курьерская доставка, Доработка, Доставлено/Оплачено
  factStages: ['UC_IP5X36','WON','C1:NEW','C1:PREPARATION','C1:PREPAYMENT_INVOICE','C1:FINAL_INVOICE','C1:WON'],
  refreshSec: 60,
  pageSec: 9
};
const Q = new URLSearchParams(location.search);
const SECTOR = (Q.get('s') || Q.get('sector') || 'all').toLowerCase();
const HIDE = new Set((Q.get('hide')||'').split(',').filter(Boolean));
const IN_APP = window.self!==window.top && Q.has('DOMAIN');
const HOOK = /^https?:/.test(location.protocol) && !/bitrix24\./.test(location.host) ? '/api/rest/' : '';

/* ===== Время (Алматы) ===== */
const dfmt = new Intl.DateTimeFormat('en-CA',{timeZone:CFG.tz,year:'numeric',month:'2-digit',day:'2-digit'});
const tfmt = new Intl.DateTimeFormat('ru-RU',{timeZone:CFG.tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const hmfmt = new Intl.DateTimeFormat('en-GB',{timeZone:CFG.tz,hour:'2-digit',minute:'2-digit',hour12:false});
const dayKey = d => dfmt.format(d);
const addDays = (key,n) => { const d=new Date(key+'T12:00:00'+CFG.tzOffset); d.setUTCDate(d.getUTCDate()+n); return dayKey(d); };
const money = n => Math.round(n||0).toLocaleString('ru-RU').replace(/\s|,/g,' ') + ' ₸';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

/* ===== Bitrix24 REST ===== */
function qs(obj, prefix){
  const out=[];
  for(const k in obj){ const v=obj[k]; if(v===undefined) continue;
    const key = prefix ? `${prefix}[${k}]` : k;
    if(v!==null && typeof v==='object') out.push(qs(v,key));
    else out.push(encodeURIComponent(key)+'='+encodeURIComponent(v===null?'':v));
  }
  return out.filter(Boolean).join('&');
}
async function call(method, params={}){
  const sdk = IN_APP ? window.BX24 : (window.BX && BX.rest);
  if(sdk && (IN_APP || !HOOK)){
    return new Promise((ok,fail)=>sdk.callMethod(method,params,r=>{
      if(r.error()) fail(new Error(String(r.error()))); else ok({result:r.data(), total:r.total&&r.total()});
    }));
  }
  if(!HOOK) throw new Error('Откройте страницу через сервер (Render) или внутри Bitrix24');
  const res = await fetch(HOOK + method + '.json',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:qs(params)});
  const j = await res.json().catch(()=>({}));
  if(!res.ok || j.error) throw new Error(j.error_description||j.error||('HTTP '+res.status));
  return j;
}
async function batch(cmds){
  const keys=Object.keys(cmds), out={};
  for(let i=0;i<keys.length;i+=50){
    const cmd={}; keys.slice(i,i+50).forEach(k=>cmd[k]=cmds[k][0]+'?'+qs(cmds[k][1]));
    const r = await call('batch',{halt:0,cmd});
    const res = r.result.result||{}, errs = r.result.result_error||{};
    const ek = Object.keys(errs).filter(k=>errs[k] && (Array.isArray(errs[k])?errs[k].length:true));
    if(ek.length) throw new Error(ek.map(k=>errs[k].error_description||errs[k].error||JSON.stringify(errs[k])).join('; '));
    Object.assign(out,res);
  }
  return out;
}
async function listAll(method, params, pick){
  const first = await call(method,{...params,start:0});
  const items = [...pick(first.result)];
  const total = first.total||0, cmds={};
  for(let s=50;s<total;s+=50) cmds['p'+s]=[method,{...params,start:s}];
  if(Object.keys(cmds).length){ const r=await batch(cmds); Object.keys(cmds).forEach(k=>items.push(...pick(r[k]))); }
  return items;
}

/* ===== Загрузка данных ===== */
async function fetchData(){
  const now = new Date(), today = dayKey(now);
  const monthStart = today.slice(0,8)+'01';
  const F = CFG.orderDateField;
  const [deps, users, deals] = await Promise.all([
    call('department.get',{}).then(r=>r.result),
    listAll('user.get',{FILTER:{ACTIVE:true}},r=>r||[]),
    listAll('crm.deal.list',{order:{ID:'ASC'},
      filter:{'@STAGE_ID':CFG.factStages, ['>='+F]:monthStart, ['<'+F]:addDays(today,1)},
      select:['ID','OPPORTUNITY','ASSIGNED_BY_ID','MOVED_TIME',F]}, r=>r||[])
  ]);
  const umap = Object.fromEntries(users.map(u=>[String(u.ID),u]));
  const missing = [...new Set(deals.map(d=>String(d.ASSIGNED_BY_ID)))].filter(id=>!umap[id]);
  if(missing.length){ (await call('user.get',{FILTER:{ID:missing}})).result.forEach(u=>umap[String(u.ID)]=u); }
  const orders = deals.map(d=>({id:String(d.ID), uid:String(d.ASSIGNED_BY_ID), sum:+d.OPPORTUNITY||0,
    dk:String(d[F]||'').slice(0,10)})).filter(o=>o.dk);
  return {now, today, monthStart, deps, umap, orders};
}

/* ===== Расчёт ===== */
function sectors(deps){
  const root = deps.find(d=>!d.PARENT);
  return deps.filter(d=>root && String(d.PARENT)===String(root.ID));
}
function resolveSector(deps){
  if(SECTOR==='all') return null;
  return deps.find(d=>String(d.ID)===SECTOR || d.NAME.toLowerCase()===SECTOR) || null;
}
function compute(D){
  const {today, monthStart, deps, umap, orders} = D;
  const kids={}; deps.forEach(d=>{(kids[d.PARENT]=kids[d.PARENT]||[]).push(String(d.ID));});
  const sub = id => [String(id), ...(kids[id]||[]).flatMap(sub)];
  const sec = resolveSector(deps);
  const allowed = sec ? new Set(sub(sec.ID)) : null;
  const depName = Object.fromEntries(deps.map(d=>[String(d.ID),d.NAME]));
  const M = {};
  for(const o of orders){
    const u = umap[o.uid];
    if(HIDE.has(o.uid)) continue;
    if(allowed && !(u && (u.UF_DEPARTMENT||[]).some(x=>allowed.has(String(x))))) continue;
    const m = M[o.uid] || (M[o.uid] = {uid:o.uid, u:u||{ID:o.uid,NAME:'ID '+o.uid}, day:0, mon:0, cnt:0, dayCnt:0,
      dep:((u&&u.UF_DEPARTMENT)||[]).map(x=>depName[x]).filter(Boolean)[0]||''});
    if(o.dk>=monthStart){ m.mon+=o.sum; m.cnt++; }
    if(o.dk===today){ m.day+=o.sum; m.dayCnt++; }
  }
  const list = Object.values(M).filter(m=>m.mon>0||m.day>0).sort((a,b)=>b.mon-a.mon || b.day-a.day);
  const tot = list.reduce((t,m)=>({day:t.day+m.day, mon:t.mon+m.mon, cnt:t.cnt+m.cnt, dayCnt:t.dayCnt+m.dayCnt}),{day:0,mon:0,cnt:0,dayCnt:0});
  const dayTop = list.filter(m=>m.day>0).sort((a,b)=>b.day-a.day).slice(0,3);
  return {sec, list, tot, dayTop};
}

/* ===== Иконки ===== */
const CROWN = c => `<svg class="crown" viewBox="0 0 64 44"><defs><linearGradient id="cg${c.replace('#','')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".75"/></linearGradient></defs>
  <path d="M6 14l13 12 13-20 13 20 13-12-5 26H11z" fill="url(#cg${c.replace('#','')})" stroke="rgba(0,0,0,.25)" stroke-width="1.5"/><rect x="11" y="38" width="42" height="6" rx="2" fill="${c}"/>
  <circle cx="6" cy="13" r="3.5" fill="#fff"/><circle cx="32" cy="5" r="4" fill="#fff"/><circle cx="58" cy="13" r="3.5" fill="#fff"/></svg>`;
const LAUREL = c => `<svg class="laurel" viewBox="0 0 40 40"><circle cx="20" cy="20" r="12" fill="#fff" stroke="${c}" stroke-width="2.5"/>
  <path d="M20 13l2.1 4.3 4.7.7-3.4 3.3.8 4.7-4.2-2.2-4.2 2.2.8-4.7-3.4-3.3 4.7-.7z" fill="${c}"/>
  <path d="M7 26c-3-6-1-13 4-16M33 26c3-6 1-13-4-16" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/></svg>`;
const TROPHY = `<svg viewBox="0 0 48 48"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ff8a00"/></linearGradient></defs>
  <path d="M14 6h20v12a10 10 0 01-20 0z" fill="url(#tg)"/><path d="M14 10H7v4a7 7 0 007 7M34 10h7v4a7 7 0 01-7 7" fill="none" stroke="#ffb703" stroke-width="3"/>
  <rect x="21" y="27" width="6" height="8" fill="#ff8a00"/><rect x="14" y="35" width="20" height="6" rx="2" fill="url(#tg)"/></svg>`;
const BOLT = `<svg class="bolt" viewBox="0 0 100 140" preserveAspectRatio="none"><path d="M6 20 L2 34 L8 40 L3 58 M94 70 L98 84 L92 90 L97 108 M30 136 L42 132 L48 138 L62 133" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><animate attributeName="opacity" values="1;.2;1;.6;1" dur="1.6s" repeatCount="indefinite"/></path></svg>`;

const nameOf = u => [u.NAME,u.LAST_NAME].filter(Boolean).join(' ').trim() || ('ID '+u.ID);
function avatar(u){
  const ini = esc(nameOf(u).split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase());
  const img = u.PERSONAL_PHOTO ? `<img src="${esc(u.PERSONAL_PHOTO)}" alt="" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createTextNode('${ini}'))">` : ini;
  return `<div class="av">${img}</div>`;
}

/* ===== Отрисовка ===== */
let D=null, pages=[], pageIdx=0, pageTimer=null, prevMon={};
function render(){
  const {sec, list, tot, dayTop} = compute(D);
  const secs = sectors(D.deps);
  const href = s => s ? `?s=${encodeURIComponent(s.NAME.toLowerCase())}` : './';
  $('nav').innerHTML = `<a href="${href(null)}" class="${!sec?'on':''}">Все</a>` + secs.map(s=>`<a href="${href(s)}" class="${sec&&s.ID===sec.ID?'on':''}">${esc(s.NAME)}</a>`).join('');
  const label = sec ? sec.NAME : 'Все отделы';
  document.title = `${label} · Nephora Arena`;
  $('title').innerHTML = `${TROPHY}<span>Nephora <b>${esc(sec ? sec.NAME : 'Arena')}</b></span>`;
  $('subt').textContent = `Рейтинг месяца · ${tot.cnt} заказов`;
  $('chip').innerHTML = `🏆 Касса сегодня <em class="num">${money(tot.day)}</em> · месяц <em class="num">${money(tot.mon)}</em>`;
  $('wrap').classList.toggle('all', !sec);

  // Подиум: 2 · 1 · 3
  const card = (m, place) => {
    const cls = 'p'+place, col = place===1?'#ff8a00':place===2?'#3b6cf5':'#e8237a';
    if(!m) return `<div class="pc ${cls} empty">${CROWN(col)}<div class="av">?</div><div class="lb">Менеджер</div><div class="nm">—</div><div class="lb">Касса за месяц</div><div class="v">—</div><span class="pill">сегодня —</span></div>`;
    return `<div class="pc ${cls}">${CROWN(col)}${LAUREL(col)}${place===1?BOLT:''}${avatar(m.u)}
      <div class="lb">Менеджер</div><div class="nm">${esc(nameOf(m.u))}</div>
      <div class="lb">Касса за месяц · ${m.cnt} зак.</div><div class="v num">${money(m.mon)}</div>
      <span class="pill num">сегодня ${m.day?money(m.day):'—'}</span></div>`;
  };
  $('podium').innerHTML = card(list[1],2) + card(list[0],1) + card(list[2],3);

  // Лидеры дня: 2 · 1 · 3
  const dcard = (m, r) => m ? `<div class="dc ${r===1?'c1':''}">${avatar(m.u)}<span class="rk">${r}</span>
      <div class="nm">${esc(nameOf(m.u))}</div><div class="lb">Заказов сегодня</div><div class="v num">${m.dayCnt}</div>
      <div class="lb">Касса сегодня</div><div class="v num">${money(m.day)}</div><span class="btn">${esc(m.dep||label)}</span></div>`
    : `<div class="dc none"><div class="av">?</div><span class="rk">${r}</span><div class="nm">—</div><div class="lb">Касса сегодня</div><div class="v">—</div><span class="btn">ждём заказ</span></div>`;
  $('dl').innerHTML = dcard(dayTop[1],2) + dcard(dayTop[0],1) + dcard(dayTop[2],3);

  // Таблица: места 4+
  const all = !sec;
  $('thead').innerHTML = `<span>Место</span><span>Менеджер</span>${all?'<span class="hx">Отдел</span>':''}<span class="hx" style="text-align:center">Заказы</span><span class="r">Сегодня</span><span class="r">Месяц</span>`;
  const rest = list.slice(3).map((m,i)=>({m, r:i+4}));
  const rowHtml = ({m,r}) => `<div class="tr ${m.day?'':'zero'} ${prevMon[m.uid]!==undefined && prevMon[m.uid]<m.mon?'up':''}">
      <span class="pl num">${r}</span><span class="mg">${avatar(m.u)}<span>${esc(nameOf(m.u))}</span></span>
      ${all?`<span class="dp hx">${esc(m.dep)}</span>`:''}<span class="c hx num">${m.cnt}</span>
      <span class="r g num">${m.day?money(m.day):'—'}</span><span class="r w num">${money(m.mon)}</span></div>`;
  prevMon = Object.fromEntries(list.map(m=>[m.uid,m.mon]));

  const box = $('rows');
  const tv = getComputedStyle($('wrap')).gridTemplateColumns.split(' ').length > 1;
  const per = tv ? Math.max(3, Math.floor((box.clientHeight + 12) / 58)) : rest.length || 1;
  pages = [];
  for(let i=0;i<rest.length;i+=per) pages.push(rest.slice(i,i+per));
  if(pageIdx>=pages.length) pageIdx=0;
  showPage(true);
  $('note').innerHTML = `<b>КАССА</b> = сделки в стадиях «Заказ», «Заказ на подтверждение», «Курьерская доставка», «Доработка», «Доставлено/Оплачено» · день по полю <em>«Дата заказа»</em><br>Обновлено в ${hmfmt.format(new Date())} · автообновление каждую минуту`;

  function showPage(instant){
    const pg = pages[pageIdx] || [];
    box.innerHTML = pg.length ? `<div class="pg">${pg.map(rowHtml).join('')}</div>`
      : `<div class="empty">${list.length? 'Все менеджеры уже на подиуме 🏆' : 'В этом месяце заказов пока нет'}</div>`;
    $('dots').innerHTML = pages.length>1 ? pages.map((_,i)=>`<i class="${i===pageIdx?'on':''}"></i>`).join('') : '';
  }
  clearInterval(pageTimer);
  if(pages.length>1) pageTimer = setInterval(()=>{
    const pg = box.querySelector('.pg'); if(pg) pg.style.opacity=0;
    setTimeout(()=>{ pageIdx=(pageIdx+1)%pages.length; showPage(); }, 450);
  }, CFG.pageSec*1000);
}

/* ===== Таймер до конца месяца ===== */
function tick(){
  const now = new Date();
  $('clock').textContent = tfmt.format(now);
  const k = dayKey(now); const y=+k.slice(0,4), mo=+k.slice(5,7);
  const end = new Date(`${mo===12?y+1:y}-${String(mo===12?1:mo+1).padStart(2,'0')}-01T00:00:00${CFG.tzOffset}`);
  let s = Math.max(0, Math.floor((end-now)/1000));
  const d=Math.floor(s/86400); s%=86400; const h=Math.floor(s/3600); s%=3600; const m=Math.floor(s/60); s%=60;
  const p = n => String(n).padStart(2,'0');
  $('tt').innerHTML = [[d,'ДН'],[h,'ЧАС'],[m,'МИН'],[s,'СЕК']].map(([v,l])=>`<div><b>${p(v)}</b><span>${l}</span></div>`).join('');
}
setInterval(tick,1000); tick();

/* ===== Цикл ===== */
async function refresh(){
  try{
    D = await fetchData();
    $('msg').innerHTML=''; $('live').classList.remove('off');
    render();
  }catch(e){
    $('live').classList.add('off');
    $('msg').innerHTML = `<div class="err">Ошибка загрузки: ${esc(e.message)}</div>`;
  }
  setTimeout(refresh, CFG.refreshSec*1000);
}
let rz; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>D&&render(),300); });

if(IN_APP){
  const s=document.createElement('script'); s.src='https://api.bitrix24.com/api/v1/';
  s.onload=()=>BX24.init(()=>refresh()); document.head.appendChild(s);
} else refresh();
</script>
