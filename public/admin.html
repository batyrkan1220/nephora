<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кабинет · Safa Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f1222;--muted:#9aa1b5;--muted2:#6b7286;--line:#edf0f7;--soft:#f5f7fd;--panel:#f7f9fe;--card:#fff;--bg:#eef2fb;
  --blue:#1f6bff;--blue2:#3d82ff;--purple:#d68bf7;--purple2:#c86df2;--yellow:#fcd94a;--green:#12b76a;--red:#ef4444;
  --grad:linear-gradient(135deg,#3d82ff,#1f6bff);--sh:0 10px 30px -18px rgba(31,107,255,.35);--r:22px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.shell{margin:28px;background:#fff;border-radius:44px;min-height:calc(100vh - 56px);display:grid;grid-template-columns:270px minmax(0,1fr);box-shadow:0 30px 80px -50px rgba(31,107,255,.35)}
aside{padding:44px 28px 30px 34px;position:sticky;top:28px;height:calc(100vh - 56px);display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:14px;font-weight:500;font-size:19px;margin-bottom:48px}
.logo i{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#1f6bff 40%,#c86df2);color:#fff;display:grid;place-items:center;font-style:normal}
.logo i svg{width:22px;height:22px}
.navl{font-size:12.5px;letter-spacing:.04em;color:var(--muted);margin:26px 0 8px 2px;text-transform:uppercase}
aside a{display:flex;align-items:center;gap:16px;padding:7px 0;color:var(--muted);font-size:15px;transition:.15s}
aside a .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#a3abc0;flex:none;transition:.15s}
aside a .ic svg{width:22px;height:22px}
aside a:hover{color:var(--ink)}aside a:hover .ic{background:var(--soft)}
aside a.on{color:var(--ink);font-weight:500}
aside a.on .ic{background:var(--blue);color:#fff;box-shadow:0 10px 22px -10px rgba(31,107,255,.9)}
aside .sp{flex:1;min-height:20px}
aside .out{font-size:13.5px}
main{padding:44px 44px 120px 10px;min-width:0}
.top{display:flex;align-items:center;gap:14px;margin-bottom:26px;flex-wrap:wrap}
.top h1{margin:0;font-size:34px;font-weight:500;letter-spacing:-.01em;flex:1}
.top .sub{color:var(--muted2);font-size:14px;width:100%;margin-top:-10px}
.top .sub a{color:var(--blue)}
.burger{display:none}
@media (max-width:1000px){
  .shell{margin:0;border-radius:0;grid-template-columns:1fr}
  aside{position:fixed;z-index:40;left:0;top:0;height:100vh;width:270px;background:#fff;transform:translateX(-100%);transition:.25s;box-shadow:0 0 40px rgba(0,0,0,.2);overflow:auto}
  body.menu aside{transform:none}
  .burger{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:14px;border:0;background:var(--soft);cursor:pointer;font-size:18px}
  main{padding:20px 16px 120px}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;margin-bottom:18px;box-shadow:var(--sh)}
.card h3{margin:0 0 4px;font-size:18px;font-weight:500}
.card .hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.navl.own{}
body.head [data-own],body.head .navl.own{display:none!important}
.me{font-size:12.5px;color:var(--muted);padding:6px 4px 2px;line-height:1.35}.me b{display:block;color:var(--ink);font-weight:500;font-size:13.5px}
.fbar{display:flex;flex-direction:column;align-items:stretch;gap:0}
.fun{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
.fun div{display:flex;align-items:center;gap:12px}
.fun i{display:block;height:34px;border-radius:10px;background:linear-gradient(90deg,#3d86ff,#c86df2);min-width:6px;transition:width .8s}
.fun span{white-space:nowrap;font-size:13.5px}.fun b{font-weight:600}
.hrs{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:8px}.hrs div{flex:1;background:linear-gradient(180deg,#3d86ff,#9cc0ff);border-radius:5px 5px 2px 2px;min-height:2px}
.hrl{display:flex;gap:4px;font-size:10px;color:var(--muted);margin-top:4px}.hrl span{flex:1;text-align:center}
.good{color:var(--green)}.bad{color:var(--red)}
/* AI-чат */
.chat{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:480px;background:var(--panel);border-radius:26px;overflow:hidden;border:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.cm{display:block;max-width:min(820px,92%);padding:13px 17px;border-radius:18px;line-height:1.55;font-size:14.5px;box-shadow:0 8px 20px -18px rgba(15,18,34,.5)}
.cm.u{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px;white-space:pre-wrap}
.cm.a{align-self:flex-start;background:#fff;border-bottom-left-radius:6px}
.cm.a p{margin:0 0 8px}.cm.a p:last-child{margin:0}.cm.a ul,.cm.a ol{margin:4px 0 8px;padding-left:20px}.cm.a h4{margin:8px 0 4px;font-size:15px}
.cm.a table{margin:6px 0 10px;font-size:13px}.cm.a th,.cm.a td{padding:6px 9px}
.cm.a code{background:var(--soft);padding:1px 5px;border-radius:5px}
.cm .tl{margin-top:8px;font-size:11.5px;color:var(--muted)}
.cm.wait{color:var(--muted)}.cm.wait i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);margin-right:4px;animation:dots 1s infinite}
.cm.wait i:nth-child(2){animation-delay:.15s}.cm.wait i:nth-child(3){animation-delay:.3s}
@keyframes dots{50%{opacity:.25;transform:translateY(-3px)}}
.cin{display:flex;gap:10px;padding:14px;background:#fff;border-top:1px solid var(--line)}
.cin textarea{flex:1;resize:none;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;font:inherit;outline:none;max-height:140px}
.cin textarea:focus{border-color:var(--blue)}
.sugg{display:flex;gap:8px;flex-wrap:wrap;padding:0 22px 14px}
.sugg button{border:1px solid #dfe6f5;background:#fff;border-radius:99px;padding:8px 14px;cursor:pointer;color:var(--muted2);font-size:13px}
.sugg button:hover{border-color:var(--blue);color:var(--blue)}
.hello{margin:auto;text-align:center;color:var(--muted2);max-width:520px}.hello b{display:block;font-size:22px;color:var(--ink);font-weight:500;margin-bottom:6px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 18px}
.kpi small{display:block;color:var(--muted);font-size:12.5px}
.kpi b{display:block;font-size:24px;font-weight:600;margin:4px 0 2px;letter-spacing:-.01em}
.kpi span{color:var(--muted);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--soft);padding:8px 14px;border-radius:99px;cursor:pointer;color:var(--muted2);font-size:13px}
.chip.on{background:var(--blue);color:#fff;box-shadow:0 8px 18px -10px rgba(31,107,255,.9)}
.btn{border:0;border-radius:14px;padding:11px 18px;font-weight:500;cursor:pointer;background:var(--blue);color:#fff;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;box-shadow:0 10px 22px -12px rgba(31,107,255,.9)}
.btn.g{background:linear-gradient(135deg,#3d82ff,#c86df2)}
.btn.l{background:#fff;color:var(--blue);border:1.5px solid #dfe6f5;box-shadow:none}
.btn.s{padding:7px 12px;border-radius:11px;font-size:13px}
.btn.d{background:#fff1f2;color:var(--red);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.ibtn{width:58px;height:58px;border-radius:18px;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 16px 30px -12px rgba(31,107,255,.9);flex:none}
.ibtn svg{width:26px;height:26px}
label.f{display:block;margin-bottom:14px}
label.f>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;background:#fff;outline:none;transition:.15s}
.in:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(31,107,255,.1)}
.in.sm{padding:8px 10px;border-radius:11px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.ck{display:flex;align-items:center;gap:12px;padding:7px 0;cursor:pointer}
.ck input{width:18px;height:18px;accent-color:var(--blue)}
.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;cursor:pointer;z-index:1;margin:0}
.sw i{position:absolute;inset:0;border-radius:99px;background:#dde3f0;transition:.2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.sw input:checked+i{background:var(--blue)}.sw input:checked+i::after{left:21px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12.5px;font-weight:400;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fafbff}
td.r,th.r{text-align:right}
td.num,td .num{white-space:nowrap}
tfoot td{font-weight:600;border-top:2px solid var(--line)}
.tw{overflow-x:auto}
.who{display:flex;align-items:center;gap:12px;min-width:180px}
.who small{display:block;color:var(--muted);font-size:12.5px}
.av{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#e3ecff,#f6e6ff);display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--blue);overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av.big{width:48px;height:48px;cursor:pointer;position:relative}
.av.big:hover::after{content:"✎";position:absolute;inset:0;background:rgba(31,107,255,.6);color:#fff;display:grid;place-items:center;font-size:16px}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12.5px;font-weight:500;background:var(--soft);color:var(--muted2)}
.pill.ok{background:#e7f8ef;color:#0f9a5a}.pill.no{background:#f1f3f8;color:#7b8297}.pill.er{background:#ffecec;color:#d92d20}
.tabs{display:flex;gap:6px;margin-bottom:20px;overflow-x:auto;background:var(--soft);padding:5px;border-radius:16px;width:max-content;max-width:100%}
.tabs a{padding:9px 18px;color:var(--muted2);border-radius:12px;white-space:nowrap}
.tabs a.on{color:#fff;background:var(--blue);box-shadow:0 8px 18px -10px rgba(31,107,255,.9)}
.chart{display:flex;align-items:flex-end;gap:4px;height:190px;padding-top:10px}
.chart div{flex:1;min-width:3px;background:linear-gradient(180deg,#c86df2,#3d82ff);border-radius:8px 8px 3px 3px;opacity:.85;transition:.15s}
.chart div:hover{opacity:1;transform:scaleY(1.02)}
.chart div.z{background:var(--soft);height:4px!important}
.cx{display:flex;gap:4px;color:var(--muted);font-size:10.5px;margin-top:8px}.cx span{flex:1;text-align:center;overflow:hidden}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.th{border:2px solid var(--line);border-radius:18px;padding:12px;cursor:pointer;transition:.15s}
.th.on{border-color:var(--blue);box-shadow:0 0 0 4px rgba(31,107,255,.12)}
.th .pv{height:70px;border-radius:12px;margin-bottom:10px;display:flex;gap:5px;padding:8px;align-items:flex-start}
.th .pv i{flex:1;height:26px;border-radius:7px}
.th b{display:block;font-weight:500}.th small{color:var(--muted);font-size:12.5px}
.tier{display:grid;grid-template-columns:1fr 1fr 90px 38px;gap:8px;margin-bottom:8px;align-items:center}
.tier.b{grid-template-columns:1fr 1fr 38px}
.tier.g4{grid-template-columns:1.2fr 1.2fr 70px 1fr 38px}
.x{border:0;background:#fff1f2;color:var(--red);width:36px;height:36px;border-radius:11px;cursor:pointer;font-size:16px}
.bonus{border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:var(--panel)}
.link{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 16px;font-family:ui-monospace,monospace;font-size:13px;word-break:break-all}
.link span{flex:1}
.save{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(140%);opacity:0;visibility:hidden;transition:.25s;background:#0f1222;color:#fff;border-radius:20px;padding:10px 10px 10px 22px;display:flex;align-items:center;gap:14px;box-shadow:0 20px 50px -15px rgba(15,18,34,.6);z-index:50}
.save.on{transform:translateX(-50%);opacity:1;visibility:visible}
.toast{position:fixed;right:24px;top:24px;background:#0f1222;color:#fff;padding:13px 20px;border-radius:14px;z-index:60;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.dept{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:16px;padding:6px 14px}
.empty{color:var(--muted);text-align:center;padding:26px}
.warn{background:#fff8eb;border:1px solid #fde4b0;color:#9a5b00;border-radius:16px;padding:13px 18px;margin-bottom:18px}
.stg{columns:2 260px;column-gap:24px}
.stg h4{margin:10px 0 4px;font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em;break-after:avoid}


.amx{border-collapse:separate;border-spacing:3px;font-size:11.5px}
.amx td,.amx th{padding:0;text-align:center;min-width:34px}
.amx td.n{text-align:left;min-width:170px;padding-right:8px;font-size:13px}
.amx th{color:var(--muted);font-weight:500}.amx th.we{color:#c3c7d4}
.amx i{display:block;font-style:normal;border-radius:7px;padding:5px 2px;background:#f4f5f9;color:#9aa0b2}
.amx i.ok{background:#e7f8ef;color:#0f9a5a}.amx i.late{background:#fff3e0;color:#c76a00;font-weight:600}.amx i.absent{background:#ffecec;color:#d92d20;font-weight:600}
.amx i.off{background:transparent;color:#d5d8e2}.amx i.extra{background:#eaf1ff;color:#1f6bff}.amx i.dis{text-decoration:line-through;opacity:.6}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--soft);padding:10px 12px;border-radius:10px;word-break:break-all;user-select:all}
ol.steps{margin:6px 0 0;padding-left:20px;line-height:1.7;font-size:14px}
.sc{display:inline-flex;align-items:center;justify-content:center;min-width:46px;padding:4px 10px;border-radius:999px;font-weight:700;font-size:13px;border:0;cursor:pointer}
.sc.g{background:#e7f8ef;color:#0f7a48}.sc.m{background:#fff3e0;color:#a85800}.sc.b{background:#ffecec;color:#c0281b}.sc.n{background:#f1f2f6;color:#6a7088}
.ovl{position:fixed;inset:0;background:rgba(20,26,51,.45);display:flex;justify-content:flex-end;z-index:50}
.ovl .pane{width:min(760px,100%);height:100%;overflow:auto;background:#fff;padding:28px 30px;box-shadow:-20px 0 60px rgba(0,0,0,.15)}
.cr{display:grid;grid-template-columns:1fr 120px 34px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.cr .bar{height:8px;border-radius:6px;background:#eef0f5;overflow:hidden}.cr .bar i{display:block;height:100%;background:var(--blue)}
.dlg p{margin:0 0 8px;line-height:1.5}.dlg .mg{background:#eef3ff;border-radius:12px;padding:8px 12px}.dlg .cl{background:#f6f7fa;border-radius:12px;padding:8px 12px}

/* ===== Safa 4: новый каркас ===== */
:root{--bg:#f4f6fa;--line:#e7eaf1;--muted:#8a91a5;--muted2:#5b6275;--soft:#f2f4f9;--panel:#f8f9fc;--r:16px;--sh:none;--blue:#2563eb;--blue2:#3b82f6}
body{font-size:14px;letter-spacing:-.005em}
.shell{margin:0;border-radius:0;min-height:100vh;box-shadow:none;background:transparent;grid-template-columns:240px minmax(0,1fr)}
aside{background:#fff;border-right:1px solid var(--line);padding:20px 12px 16px;top:0;height:100vh;gap:2px;overflow:auto}
.logo{font-size:17px;font-weight:700;margin:0 8px 22px;gap:10px}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#7c3aed)}
.logo i svg{width:18px;height:18px}
aside a{gap:12px;padding:9px 12px;border-radius:10px;color:var(--muted2);font-size:14px;font-weight:500}
aside a .ic{width:20px;height:20px;border-radius:0;background:none!important;box-shadow:none!important;color:inherit}
aside a .ic svg{width:20px;height:20px}
aside a:hover{background:var(--soft);color:var(--ink)}
aside a.on{background:#eef3ff;color:var(--blue);font-weight:600}
aside a.on .ic{color:var(--blue)!important}
.shell{background:linear-gradient(90deg,#fff 239px,var(--line) 239px,var(--line) 240px,transparent 240px)}
@media (max-width:1000px){.shell{background:none}}
.navl{font-size:11px;margin:16px 12px 6px;letter-spacing:.06em}
aside .tv{margin:10px 4px 6px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:600}
aside .tv:hover{background:linear-gradient(135deg,#1d4ed8,#6d28d9);color:#fff}
.me{padding:8px 12px}
main{padding:0}
.pgh{position:sticky;top:0;z-index:20;background:rgba(244,246,250,.92);backdrop-filter:blur(8px);padding:18px 32px 0;border-bottom:1px solid var(--line)}
.pgt{display:flex;align-items:center;gap:12px;padding-bottom:14px}
.pgt h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;flex:1}
.pga{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sync{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}.sync i{width:8px;height:8px;border-radius:50%;background:var(--green)}.sync.er i{background:var(--red)}
.stabs{display:flex;gap:4px;overflow-x:auto}
.stabs a{padding:10px 14px;color:var(--muted2);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.stabs a:hover{color:var(--ink)}
.stabs a.on{color:var(--blue);border-bottom-color:var(--blue)}
#view{padding:22px 32px 110px;max-width:1500px}
#view>.top{margin-bottom:16px;gap:10px}
#view .top h1,#view .top .burger{display:none}
#view .top .sub{margin:0;width:auto;flex:1;min-width:240px;order:-1;color:var(--muted2)}
.card{border-radius:var(--r);border-color:var(--line);box-shadow:none;padding:20px 22px}
.card h3{font-size:16px;font-weight:600}
.kpi{background:#fff;border-radius:14px}
.kpi b{font-weight:700}
.tabs{background:none;padding:0;border-radius:0;gap:2px;border-bottom:1px solid var(--line);width:100%}
.tabs a{border-radius:8px 8px 0 0;padding:8px 14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{background:none;color:var(--blue);box-shadow:none;border-bottom-color:var(--blue);font-weight:600}
.fbar{display:flex;flex-direction:row;justify-content:flex-start;flex-wrap:wrap;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:18px}
.fbar .chips{flex:none}
.fbar .in{width:auto;min-width:170px;padding:8px 12px;border-radius:10px}
.fbar input[type=date].in{min-width:150px}
.chip{padding:7px 12px;border-radius:9px;font-weight:500}
.chip.on{box-shadow:none}
.btn{border-radius:10px;box-shadow:none;font-weight:600}
.btn.s{border-radius:9px}
.in,select.in,textarea.in{border-radius:10px;border-width:1px}
.av{border-radius:10px;width:36px;height:36px}
th{font-size:12px;font-weight:500}
td{padding:11px 12px}
.save{border-radius:14px}
@media (max-width:1000px){
  .shell{grid-template-columns:1fr}
  aside{width:250px}
  .pgh{padding:14px 16px 0}#view{padding:16px 16px 110px}
  .pgt .burger{display:inline-grid}
}
/* главная */
.hk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:18px}
@media (max-width:1200px){.hk{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.hk{grid-template-columns:1fr}}
.ht{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;position:relative;overflow:hidden}
.ht small{color:var(--muted);font-size:12.5px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.ht b{display:block;font-size:30px;font-weight:700;letter-spacing:-.025em;margin:6px 0 4px}
.ht span{color:var(--muted2);font-size:13px}
.ht.main{background:linear-gradient(135deg,#2563eb,#7c3aed);border:0;color:#fff}
.ht.main small,.ht.main span{color:rgba(255,255,255,.85)}
.pr{height:8px;border-radius:99px;background:#eef1f7;overflow:hidden;margin-top:12px}.pr i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.ht.main .pr{background:rgba(255,255,255,.25)}.ht.main .pr i{background:#fff}
.hg{display:grid;gap:18px;margin-bottom:18px}
.hg.a{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}.hg.b{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1200px){.hg.a,.hg.b{grid-template-columns:1fr}}
.hg .card{margin:0}
.chd{display:flex;align-items:center;gap:10px;margin-bottom:12px}.chd h3{flex:1;margin:0}.chd a{color:var(--blue);font-size:13px;font-weight:500}
.sr{display:grid;grid-template-columns:150px minmax(0,1fr) 150px;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sr:last-child{border-bottom:0}
.sr b{font-weight:600}.sr .pr{margin:0}.sr .v{text-align:right;font-size:13px;color:var(--muted2)}.sr .v b{display:block;color:var(--ink);font-size:14px}
@media (max-width:700px){.sr{grid-template-columns:1fr}.sr .v{text-align:left}}
.al{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;margin-bottom:8px;background:var(--panel);border:1px solid var(--line)}
.al b{font-size:20px;font-weight:700;min-width:44px;text-align:center}
.al div{flex:1;font-size:13.5px;line-height:1.35}.al div small{display:block;color:var(--muted);font-size:12px}
.al.r{background:#fff5f5;border-color:#fde2e2}.al.r b{color:#dc2626}
.al.y{background:#fffaf0;border-color:#fdecc8}.al.y b{color:#b45309}
.al.g{background:#f0fbf5;border-color:#d3f2e1}.al.g b{color:#059669}
.al:hover{filter:brightness(.98)}
.lr{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.lr:last-child{border-bottom:0}
.lr .n{flex:1;min-width:0}.lr .n b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lr .n small{color:var(--muted);font-size:12px}
.lr .v{text-align:right;font-weight:600;white-space:nowrap}.lr .v small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.lr .k{width:22px;color:var(--muted);font-weight:600;text-align:center}
.chart div{background:linear-gradient(180deg,#3b82f6,#93c5fd)}
.chart div.t{background:linear-gradient(180deg,#7c3aed,#a78bfa)}
</style>

<body>
<div class="shell">
  <aside>
    <div class="logo"><i><svg viewBox="0 0 24 24" fill="#fff"><path d="M13.5 2L5 13.5h6L10 22l9-12.5h-6.2z"/></svg></i>Safa</div>
    <a href="#/" data-r="home"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg></span>Главная</a>
    <a href="#/sales" data-r="sales"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-6M21 19H3"/></svg></span>Продажи</a>
    <a href="#/team" data-r="team"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.8-3 3-4.6 5.5-4.6s4.7 1.6 5.5 4.6"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.5c2.4 0 4 1.4 4.6 4"/></svg></span>Команда</a>

    <a href="#/money" data-r="money"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h3"/></svg></span>Зарплата</a>
    <a href="#/ai" data-r="ai"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></span>AI-ассистент</a>
    <a href="#/settings" data-r="settings" data-own="1"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.6 1.6 0 00-1-1.5 1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H3a2 2 0 010-4h.1a1.6 1.6 0 001.5-1 1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V3a2 2 0 014 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H21a2 2 0 010 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg></span>Настройки</a>
    <a class="tv" id="tvLink" href="#" target="_blank"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span>ТВ-табло ↗</a>
    <div class="sp"></div>
    <div class="me" id="me"></div>
    <a href="/logout" class="out"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg></span>Выйти</a>
  </aside>
  <main id="main"><div class="empty">Загрузка…</div></main>
</div>
<div class="save" id="save"><span>Есть несохранённые изменения</span><button class="btn l s" id="undo" style="background:transparent;color:#fff;border-color:#4b3f75">Отменить</button><button class="btn" id="saveBtn">Сохранить</button></div>
<input type="file" id="file" accept="image/*" hidden>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => Math.round(n || 0).toLocaleString('ru-RU').replace(/\s/g, ' ') + ' ₸';
const fd = k => k ? k.slice(8, 10) + '.' + k.slice(5, 7) + '.' + k.slice(0, 4) : '';
const ini = n => esc(String(n || '?').split(/\s+/).map(x => x[0]).slice(0, 2).join('').toUpperCase());
const av = (name, photo, cls = '') => `<div class="av ${cls}">${photo ? `<img src="${esc(photo)}" referrerpolicy="no-referrer" alt="" onerror="this.replaceWith(document.createTextNode('${ini(name)}'))">` : ini(name)}</div>`;
const uid = () => Math.random().toString(16).slice(2, 10);
const toast = t => { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 2600); };
const api = async (url, opt = {}) => {
  const r = await fetch(url, { ...opt, headers: { 'Content-Type': 'application/json', ...(opt.headers || {}) } });
  if (r.status === 401) { location.reload(); throw new Error('unauthorized'); }
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status); return j;
};

let S = null, cfg = null, saved = '', dirty = false;
const sectors = () => { const root = S.deps.find(d => !d.parent); return root ? S.deps.filter(d => d.parent === root.id) : []; };
const companyPlan = b => Object.values((b && b.sectorPlans) || {}).reduce((a, v) => a + (+v || 0), 0);
const PRESET = {
  commissionMode: 'total', eliteFrom: 800000,
  commission: [{ from: 0, to: 500000, pct: 10, premium: 0 }, { from: 500000, to: 800000, pct: 12, premium: 0 }, { from: 800000, to: 1500000, pct: 14, premium: 10000 },
    { from: 1500000, to: 1800000, pct: 15, premium: 20000 }, { from: 1800000, to: 2500000, pct: 15, premium: 30000 }, { from: 2500000, to: '', pct: 15, premium: 40000 }],
  bonuses: [{ id: 'daily', name: 'Ежедневная премия', period: 'day', metric: 'sum', tiers: [{ min: 200000, amount: 2000 }, { min: 300000, amount: 3000 }, { min: 400000, amount: 4000 },
    { min: 500000, amount: 5000 }, { min: 600000, amount: 7000 }, { min: 700000, amount: 9000 }, { min: 800000, amount: 10000 }] }],
};
const users = () => S.users;
const uName = id => { const m = cfg.managers[id] || {}; const u = S.users.find(x => x.id === id); return m.name || (u ? u.name : 'ID ' + id); };
const uPhoto = id => { const u = S.users.find(x => x.id === id); return u ? u.photoUrl : ''; };

async function loadState() {
  S = await api('/api/admin/state');
  cfg = JSON.parse(JSON.stringify(S.cfg)); saved = JSON.stringify(cfg); setDirty();
  document.body.classList.toggle('head', S.me.role !== 'owner');
  const secN = S.me.sectors ? mySectors().map(x => x.name).join(', ') || 'секторы не назначены' : 'все секторы';
  const b0 = (S.cfg.boards || [])[0]; $('#tvLink').href = b0 && b0.key ? '/b/' + b0.key : '#'; $('#tvLink').style.display = b0 && b0.key && b0.active ? '' : 'none';
  $('#me').innerHTML = `<b>${esc(S.me.name)}</b>${S.me.role === 'owner' ? 'Владелец' : 'Руководитель'} · ${esc(secN)}`;
}
function setDirty() { dirty = JSON.stringify(cfg) !== saved; $('#save').classList.toggle('on', dirty); }
$('#saveBtn').onclick = async () => {
  $('#saveBtn').disabled = true;
  try { await api('/api/admin/config', { method: 'PUT', body: JSON.stringify(cfg) }); await loadState(); toast('Сохранено'); route(); }
  catch (e) { toast('Ошибка: ' + e.message); }
  $('#saveBtn').disabled = false;
};
$('#undo').onclick = () => { cfg = JSON.parse(saved); setDirty(); route(); };
addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ===== привязка полей: data-k="boards.0.name" ===== */
function getP(o, p) { return p.split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setP(o, p, v) { const ks = p.split('.'); const last = ks.pop(); const t = ks.reduce((a, k) => a[k] ??= {}, o); t[last] = v; }
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset.k) return;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.t === 'n') v = v === '' ? '' : +v;
  setP(cfg, el.dataset.k, v); setDirty();
  if (el.dataset.re) route();
});
document.addEventListener('change', e => { if (e.target.dataset.k && e.target.tagName === 'SELECT') e.target.dispatchEvent(new Event('input', { bubbles: true })); });
const val = k => esc(getP(cfg, k) ?? '');
const inp = (k, ph = '', t = 'text', cls = '') => `<input class="in ${cls}" data-k="${k}" ${t === 'number' ? 'data-t="n" type="number" step="any"' : `type="${t}"`} value="${val(k)}" placeholder="${esc(ph)}">`;
const sw = (k, re) => `<span class="sw"><input type="checkbox" data-k="${k}" ${getP(cfg, k) ? 'checked' : ''} ${re ? 'data-re="1"' : ''}><i></i></span>`;

/* ===== периоды ===== */
const addD = (k, n) => { const d = new Date(k + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
function presets(today) {
  const wd = (new Date(today + 'T00:00:00Z').getUTCDay() || 7);
  const ms = today.slice(0, 8) + '01';
  const pm = new Date(ms + 'T00:00:00Z'); pm.setUTCMonth(pm.getUTCMonth() - 1);
  const pms = pm.toISOString().slice(0, 10);
  const me = new Date(ms + 'T00:00:00Z'); me.setUTCMonth(me.getUTCMonth() + 1); me.setUTCDate(0);
  return {
    today: ['Сегодня', today, today], yest: ['Вчера', addD(today, -1), addD(today, -1)],
    week: ['Эта неделя', addD(today, 1 - wd), today], month: ['Этот месяц', ms, today],
    prev: ['Прошлый месяц', pms, addD(ms, -1)], custom: ['Произвольный'],
  };
}
const F = { p: 'month', from: '', to: '', board: '', uid: '', sector: '' };
const mySectors = () => (S.sectors || []).filter(x => !S.me.sectors || S.me.sectors.includes(x.id));
const uidsFor = () => [...new Set([...S.dealUids, ...Object.keys(cfg.managers)])].filter(id => (!S.me.sectors || S.me.sectors.includes(S.secOf[id])) && (!F.sector || S.secOf[id] === F.sector) && !(cfg.managers[id] || {}).hidden);
const secSelect = (id, all) => `<select class="in" id="${id}"><option value="">${all}</option>${mySectors().map(x => `<option value="${x.id}" ${F.sector === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>`;
function filters() {
  const P = presets(S.today);
  if (F.p !== 'custom') { F.from = P[F.p][1]; F.to = P[F.p][2]; }
  return `<div class="fbar"><div class="chips">${Object.entries(P).map(([k, v]) => `<button class="chip ${F.p === k ? 'on' : ''}" data-p="${k}">${v[0]}</button>`).join('')}</div>
    ${F.p === 'custom' ? `<input class="in" type="date" id="fFrom" value="${F.from}"><input class="in" type="date" id="fTo" value="${F.to}">` : ''}
    ${secSelect('fSec', S.me.sectors ? 'Все мои секторы' : 'Все секторы')}
    <select class="in" id="fUid"><option value="">Все менеджеры</option>${uidsFor().sort((a, b) => uName(a).localeCompare(uName(b), 'ru')).map(id => `<option value="${id}" ${F.uid === id ? 'selected' : ''}>${esc(uName(id))}</option>`).join('')}</select></div>`;
}
function bindFilters() {
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { F.p = b.dataset.p; route(); });
  const on = (id, k) => { const el = $('#' + id); if (el) el.onchange = () => { F[k] = el.value; route(); }; };
  on('fFrom', 'from'); on('fTo', 'to'); on('fBoard', 'board'); on('fUid', 'uid');
  const sc = $('#fSec'); if (sc) sc.onchange = () => { F.sector = sc.value; F.uid = ''; route(); };
}
const qs = extra => new URLSearchParams({ from: F.from, to: F.to, board: F.board, uid: F.uid, sector: F.sector, ...extra }).toString();

/* ===== страницы ===== */
const pages = {};

const SV = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICO = {
  left: SV('<path d="M19 12H5M11 6l-6 6 6 6"/>'), right: SV('<path d="M5 12h14M13 6l6 6-6 6"/>'),
  cal: SV('<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/>'),
  dl: SV('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'),
  coin: SV('<circle cx="12" cy="12" r="8"/><path d="M14.5 9.5c-.4-.9-1.4-1.5-2.5-1.5-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2c-1.1 0-2.1-.6-2.5-1.5M12 6.5V8M12 16v1.5"/>'),
  cart: SV('<path d="M4 5h2l2 10h10l2-7H7.2"/><circle cx="9.5" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/>'),
  doc: SV('<rect x="5" y="3.5" width="14" height="17" rx="3"/><path d="M9 9h6M9 13h6M9 17h3"/>'),
  arrow: '<svg viewBox="0 0 24 10" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 5h21M17 1l5 4-5 4"/></svg>',
  tag: SV('<path d="M3 12V4h8l9 9-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/>'),
};
const H = { page: 0 };
function agoText(ts) { if (!ts) return 'нет данных'; const m = Math.round((Date.now() - ts) / 60000); return m < 1 ? 'Обновлено только что' : `Обновлено ${m} мин. назад`; }
function donut(parts, center, sub) {
  const R = 52, C = 2 * Math.PI * R; let off = 0;
  const segs = parts.filter(p => p.v > 0).map(p => { const len = p.v * C; const s = `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${p.c}" stroke-width="${p.w || 16}" stroke-dasharray="${Math.max(0, len - 2)} ${C}" stroke-dashoffset="${-off}" stroke-linecap="butt"/>`; off += len; return s; }).join('');
  return `<div class="donut"><svg viewBox="0 0 120 120"><defs>
      <linearGradient id="dgP" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c86df2"/><stop offset="1" stop-color="#f3b6ff"/></linearGradient>
      <linearGradient id="dgB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f6bff"/><stop offset="1" stop-color="#9cc0ff"/></linearGradient>
      <linearGradient id="dgY" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcd94a"/><stop offset="1" stop-color="#fff2b0"/></linearGradient></defs>
    <circle cx="60" cy="60" r="${R}" fill="none" stroke="#f1f4fb" stroke-width="16"/>${segs}<circle cx="60" cy="60" r="38" fill="#fff"/></svg>
    <div class="c"><div><b class="num">${center}</b><small>${sub}</small></div></div></div>`;
}

/* ===== Главная ===== */
const pctOf = (a, b) => b ? a / b * 100 : null;
const prc = v => v == null ? '—' : Math.round(v) + '%';
const prog = (v, c) => `<div class="pr"><i style="width:${Math.max(0, Math.min(100, v || 0)).toFixed(1)}%${c ? ';background:' + c : ''}"></i></div>`;
const short2 = n => { n = Math.round(n || 0); return n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 1 : 2).replace(/\.?0+$/, '') + ' млн ₸' : money(n); };
pages.home = async () => {
  $('#view').innerHTML = '<div class="empty">Загрузка…</div>';
  let R; try { R = await api('/api/admin/overview'); } catch (e) { $('#view').innerHTML = `<div class="warn">Ошибка: ${esc(e.message)}</div>`; return; }
  if (R.empty) { $('#view').innerHTML = '<div class="warn">Табло ещё не настроено — откройте «Настройки → Табло и планы».</div>'; return; }
  const T = R.team, P = R.period, A = R.alerts || {}, own = S.me.role === 'owner';
  const dPct = pctOf(T.daySum, T.dayPlan), mPct = pctOf(T.sum, T.plan), fPct = pctOf(T.forecast, T.plan);
  const need = T.plan && P.daysLeft ? Math.max(0, (T.plan - T.sum) / P.daysLeft) : 0;
  const mx = Math.max(1, ...R.days.map(d => d.sum)), avgDay = T.sum / Math.max(1, P.workdays - P.daysLeft + 1);
  const AL = [];
  const al = (cls, n, text, sub, href) => AL.push(`<a class="al ${cls}" href="${href}"><b class="num">${n}</b><div>${text}<small>${sub}</small></div></a>`);
  if (A.forgotten) al('r', A.forgotten, 'Забытые клиенты', `открытые сделки без касания ${A.forgetDays}+ дней`, '#/team/touch');
  if (A.zero) al('y', A.zero, 'Новые сделки без звонка', `из ${A.deals} за месяц`, '#/team/touch');
  if (A.lostLow) al('y', A.lostLow, 'Отказ после ≤1 разговора', `из ${A.lost} отказов — клиентов отпускают рано`, '#/team/touch');
  if (A.missedToday) al('r', A.missedToday, 'Пропущенные входящие сегодня', `из ${A.callsToday} звонков`, '#/calls/stats');
  if (A.attTotal != null) al(A.lateToday || A.absentToday ? 'y' : 'g', (A.lateToday || 0) + (A.absentToday || 0), 'Опоздания и пропуски сегодня', `опоздали ${A.lateToday}, нет на работе ${A.absentToday} из ${A.attTotal}`, '#/team/att');

          <div class="v"><b class="num">${money(x.sum)}</b>${x.plan ? 'из ' + short2(x.plan) : ''}${x.daySum ? `<br><span style="color:var(--green)">+${money(x.daySum)} сегодня</span>` : ''}</div></div>`; }).join('') || '<div class="empty">Нет секторов с планом — задайте их в «Настройки → Табло и планы»</div>'}</div>

          <small style="color:var(--muted);text-transform:uppercase;font-size:11.5px;letter-spacing:.05em">Лучшие</small>${E.top.map(r => person(r, `<span class="sc ${scCls(r.index)}">${r.index}</span>`)).join('')}
          <small style="color:var(--muted);text-transform:uppercase;font-size:11.5px;letter-spacing:.05em;display:block;margin-top:10px">Нужна помощь</small>${E.low.map(r => person(r, `<span class="sc ${scCls(r.index)}">${r.index}</span>`, GN[r.weak] || '')).join('')}` : '<div class="empty">Нет данных</div>'}</div>

  homeTimer = setTimeout(() => { if ((location.hash || '#/') .replace(/^#\/?/, '') === '' && !dirty && !document.querySelector('.ovl')) route(); }, 60000);

const short = n => { n = Math.round(n || 0); return n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'k' : String(n); };

async function refreshUsers() { const s = await api('/api/admin/state'); S.users = s.users; route(); }
function upload(id, f) {
  if (!f) return;
  const img = new Image(), r = new FileReader();
  r.onload = () => { img.src = r.result; };
  img.onload = async () => {
    const n = 320, c = document.createElement('canvas'); c.width = c.height = n;
    const s = Math.min(img.width, img.height), x = c.getContext('2d');
    x.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, n, n);
    try { await api('/api/admin/photo/' + id, { method: 'POST', body: JSON.stringify({ data: c.toDataURL('image/jpeg', .86) }) }); await refreshUsers(); toast('Фото обновлено'); }
    catch (e) { toast('Ошибка: ' + e.message); }
  };
  r.readAsDataURL(f);
}

/* ===== посещаемость (терминал Hikvision) ===== */
const AT = { view: 'day', date: '', month: '' };
const AST = { ok: ['ok', 'Вовремя'], late: ['er', 'Опоздал'], absent: ['er', 'Нет / пропуск'], wait: ['no', 'Ещё не пришёл'], off: ['no', 'Выходной'], none: ['no', 'Нет данных'], extra: ['ok', 'Вышел в выходной'] };

  const sub = `Рабочий день с ${R.settings.start}${+R.settings.grace ? ' (допуск ' + R.settings.grace + ' мин)' : ''}, опоздание до ${R.settings.lateUntil}, позже — пропуск. Данные с терминала Hikvision.`;

  const bar = `<div class="card" style="display:flex;gap:12px;align-items:end;flex-wrap:wrap"><label class="f" style="margin:0"><span>${AT.view === 'month' ? 'Месяц' : 'Дата'}</span>${ctl}</label><label class="f" style="margin:0;min-width:220px"><span>Сектор</span>${secSelect('aSec', S.me.sectors ? 'Все мои секторы' : 'Все секторы')}</label></div>`;
  const noMap = !R.rows.length ? `<div class="warn">Пока нет сопоставленных сотрудников. ${own ? 'Откройте вкладку «Терминал и правила»: подключите терминал и выберите, кто есть кто в Bitrix24.' : 'Попросите владельца подключить терминал.'}</div>` : '';
  const dis = (r, label) => own && r.penId ? `<button class="btn l s" data-dis="${r.penId}" data-on="${r.dismissed ? '' : '1'}" title="${r.dismissed ? 'Вернуть штраф' : 'Уважительная причина — снять штраф'}">${r.dismissed ? 'Вернуть' : label}</button>` : '';

        <div class="kpi"><small>Вовремя</small><b class="num good">${c('ok')}</b><span>до ${R.settings.start}</span></div>

        <div class="kpi"><small>Нет на работе</small><b class="num ${c('absent') ? 'bad' : ''}">${c('absent')}</b><span>${c('wait') ? 'ещё ждём: ' + c('wait') : 'пропуск / после ' + R.settings.lateUntil}</span></div>
      </div>

      ${R.rows.map(r => { const [cl, t] = AST[r.st] || ['no', r.st]; return `<tr><td><div class="who">${av(r.name, uPhoto(r.uid))}${esc(r.name)}</div></td><td style="color:var(--muted)">${esc(r.sector)}</td>
        <td class="r num"><b>${r.in || '—'}</b></td><td class="r num">${r.out || '—'}</td><td class="r num">${r.hours ? (Math.round(r.hours * 10) / 10) + ' ч' : '—'}</td>

        <td class="r num" style="color:var(--red)">${r.pen ? '−' + money(r.pen) : r.dismissed ? '<s style="color:var(--muted)">снят</s>' : '—'}</td>${own ? `<td class="r">${dis(r, 'Снять')}</td>` : ''}</tr>`; }).join('')}

};
async function attSetup(top, bindTop) {

  const people = [...new Set([...S.boards.flatMap(b => b.members), ...S.dealUids, ...Object.keys(cfg.managers)])].filter(id => !(cfg.managers[id] || {}).hidden).sort((a, b) => uName(a).localeCompare(uName(b), 'ru'));
  const norm = s => String(s || '').toLowerCase().replace(/ё/g, 'е').split(/\s+/).filter(Boolean).sort().join(' ');
  const guess = n => { const k = norm(n); if (!k) return ''; const f = people.filter(id => norm(uName(id)) === k || (k.split(' ').length > 1 && norm(uName(id)).includes(k))); return f.length === 1 ? f[0] : ''; };
  const used = Object.values(cfg.settings.att.map || {});
  $('#view').innerHTML = top('Подключение терминала Hikvision DS-K1T343M (и других терминалов доступа Hikvision) и правила учёта') + `
    <div class="card"><h3>Состояние</h3>
      ${st && st.lastAt ? `<p><span class="pill ${ago < 24 * 60 ? 'ok' : 'er'}">${ago < 24 * 60 ? 'Подключено' : 'Давно нет событий'}</span> Последнее событие: ${new Date(st.lastAt).toLocaleString('ru-RU')} (${ago} мин назад) · источник: ${st.lastFrom === 'bridge' ? 'мост' : 'терминал напрямую'} · всего принято ${st.total}</p>` : '<p><span class="pill no">Ещё нет событий</span> Подключите терминал одним из способов ниже и пройдите по лицу — запись появится здесь.</p>'}

      <p class="hint">Любой компьютер в офисе в той же сети, что и терминал. Установите <a href="https://nodejs.org" target="_blank">Node.js</a>, скачайте мост и запустите — он раз в 20 секунд забирает события из терминала (ISAPI AcsEvent) и отправляет сюда. Ключ уже вписан в файл.</p>
      <a class="btn" href="/api/admin/att/bridge.js" download>⬇ Скачать hik-bridge.js</a>

const AI = { msgs: JSON.parse(sessionStorage.getItem('ai-msgs') || '[]'), busy: false };
function md(t) {
  const e = esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const lines = e.split('\n'), out = []; let list = null, table = [];
  const flushT = () => { if (!table.length) return; const rows = table.filter(r => !/^\|?\s*:?-{2,}/.test(r.replace(/\|/g, '').trim() ? r.split('|')[1] || '' : r));
    const cells = r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
    out.push(`<div class="tw"><table><thead><tr>${cells(rows[0]).map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r => `<tr>${cells(r).map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`); table = []; };
  const flushL = () => { if (list) { out.push(`<${list.t}>${list.i.map(x => `<li>${x}</li>`).join('')}</${list.t}>`); list = null; } };
  for (const l of lines) {
    if (/^\s*\|.*\|\s*$/.test(l)) { flushL(); if (!/^\s*\|?[\s:|-]+\|?\s*$/.test(l)) table.push(l.trim()); continue; } else flushT();
    let m;
    if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (!list || list.t !== 'ul') { flushL(); list = { t: 'ul', i: [] }; } list.i.push(m[1]); continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (!list || list.t !== 'ol') { flushL(); list = { t: 'ol', i: [] }; } list.i.push(m[1]); continue; }
    flushL();
    if ((m = l.match(/^#{1,4}\s+(.*)/))) out.push(`<h4>${m[1]}</h4>`); else if (l.trim()) out.push(`<p>${l}</p>`);
  }
  flushT(); flushL(); return out.join('');
}

  $('#aiIn').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(e.target.value); } };
  $('#aiIn').oninput = e => { e.target.style.height = 'auto'; e.target.style.height = Math.min(140, e.target.scrollHeight) + 'px'; };
  document.querySelectorAll('.sugg button').forEach(b => b.onclick = () => send(b.textContent));
  const cl = $('#aiClear'); if (cl) cl.onclick = () => { AI.msgs = []; sessionStorage.removeItem('ai-msgs'); route(); };
};

/* ===== пользователи (владелец) ===== */
const UE = { edit: null };
pages.users = () => {
  const list = S.accounts || [], secName = id => (S.sectors.find(x => x.id === id) || { name: id }).name;
  const u = UE.edit;
  $('#view').innerHTML = head(`Пользователи <span class="pill">${list.length}</span>`, 'Руководители секторов входят со своим логином и паролем и видят только свои секторы: главная, продажи, выплаты, воронка, звонки и AI-ассистент. Настройки, лидерборд и штрафы доступны только владельцу.',
    '<button class="btn g" id="uAdd">+ Добавить руководителя</button>') + `
    ${u ? `<div class="card"><h3>${u.id ? 'Изменить' : 'Новый'} аккаунт</h3>
      <div class="row2"><label class="f"><span>Имя</span><input class="in" id="uName" value="${esc(u.name || '')}" placeholder="Айгерим — руководитель Gold"></label>
        <label class="f"><span>Логин</span><input class="in" id="uLogin" value="${esc(u.login || '')}" placeholder="gold.head" autocapitalize="none"></label>
        <label class="f"><span>${u.id ? 'Новый пароль (пусто — не менять)' : 'Пароль'}</span><input class="in" id="uPass" type="text" placeholder="минимум 6 символов"></label></div>
      <label class="f"><span>Секторы, которые видит</span></label><div class="chips" style="margin-bottom:14px">${S.sectors.map(x => `<button class="chip ${(u.sectors || []).includes(x.id) ? 'on' : ''}" data-us="${x.id}">${esc(x.name)}</button>`).join('') || '<span class="hint">Секторы появятся после синхронизации с Bitrix24</span>'}</div>
      <label class="ck"><input type="checkbox" id="uAct" ${u.active !== false ? 'checked' : ''}> Активен (может входить)</label>
      <div style="display:flex;gap:10px;margin-top:12px"><button class="btn" id="uSave">Сохранить</button><button class="btn l" id="uCancel">Отмена</button>${u.id ? '<button class="btn d" id="uDel" style="margin-left:auto">Удалить</button>' : ''}</div></div>` : ''}
    <div class="card"><div class="tw"><table><thead><tr><th>Имя</th><th>Логин</th><th>Роль</th><th>Секторы</th><th>Статус</th><th></th></tr></thead><tbody>
      <tr><td><b>Владелец</b></td><td>— (только пароль)</td><td>Владелец</td><td>все</td><td><span class="pill ok">активен</span></td><td></td></tr>
      ${list.map(x => `<tr><td><b>${esc(x.name)}</b></td><td><code>${esc(x.login)}</code></td><td>Руководитель сектора</td><td>${(x.sectors || []).map(id => `<span class="pill">${esc(secName(id))}</span>`).join(' ') || '<span class="bad">не назначены</span>'}</td>
        <td>${x.active ? '<span class="pill ok">активен</span>' : '<span class="pill no">отключён</span>'}</td><td class="r"><button class="btn l s" data-ue="${x.id}">Изменить</button></td></tr>`).join('')}</tbody></table></div>
      <p class="hint" style="margin:12px 0 0">Вход: ${esc(location.origin)}/admin → логин и пароль. Пароль хранится в зашифрованном виде — если забыли, задайте новый.</p></div>`;
  $('#uAdd').onclick = () => { UE.edit = { sectors: [] }; route(); };
  document.querySelectorAll('[data-ue]').forEach(b => b.onclick = () => { UE.edit = JSON.parse(JSON.stringify(list.find(x => x.id === b.dataset.ue))); route(); });
  if (!u) return;
  document.querySelectorAll('[data-us]').forEach(b => b.onclick = () => { const s2 = new Set(u.sectors || []); s2.has(b.dataset.us) ? s2.delete(b.dataset.us) : s2.add(b.dataset.us); u.sectors = [...s2]; b.classList.toggle('on'); });
  $('#uCancel').onclick = () => { UE.edit = null; route(); };
  $('#uSave').onclick = async () => {
    try {
      await api('/api/admin/users', { method: 'POST', body: JSON.stringify({ id: u.id, name: $('#uName').value, login: $('#uLogin').value, password: $('#uPass').value, sectors: u.sectors, active: $('#uAct').checked }) });
      UE.edit = null; await loadState(); route(); toast('Сохранено');
    } catch (e) { toast('Ошибка: ' + e.message); }
  };
  const del = $('#uDel'); if (del) del.onclick = async () => { if (!confirm('Удалить аккаунт «' + u.name + '»?')) return; await api('/api/admin/users/' + u.id, { method: 'DELETE' }); UE.edit = null; await loadState(); route(); toast('Удалено'); };
};

/* ===== роутер ===== */
const SECTIONS = [
  { id: 'home', title: 'Главная' },
  { id: 'sales', title: 'Продажи', tabs: [['list', 'Сделки'], ['funnel', 'Воронка и выкуп']] },
  { id: 'team', title: 'Команда', tabs: [['eff', 'Эффективность'], ['touch', 'Касания'], ['att', 'Посещаемость']] },
  { id: 'calls', title: 'Звонки', tabs: [['stats', 'Аналитика'], ['rec', 'Записи и AI-разбор']] },
  { id: 'money', title: 'Зарплата', tabs: [['payouts', 'Выплаты'], ['penalties', 'Штрафы', 1]] },
  { id: 'ai', title: 'AI-ассистент' },
  { id: 'settings', title: 'Настройки', own: 1, tabs: [['board', 'Табло и планы'], ['managers', 'Менеджеры'], ['users', 'Доступы'], ['terminal', 'Терминал'], ['system', 'Система']] },
];
// старые адреса → новые разделы
const OLD = { funnel: 'sales/funnel', eff: 'team/eff', att: 'team/att', payouts: 'money/payouts', penalties: 'money/penalties', boards: 'settings/board', board: 'settings/board', managers: 'settings/managers', users: 'settings/users' };
let homeTimer = null;
function route() {
  if (!S) return;
  document.body.classList.remove('menu'); clearTimeout(homeTimer);
  const [, r = '', a, b] = location.hash.split('/');
  if (OLD[r]) { location.replace('#/' + (r === 'board' && b ? 'settings/board/' + b : OLD[r])); return; }
  const own = S.me.role === 'owner';
  const sec = SECTIONS.find(x => x.id === (r || 'home')) || SECTIONS[0];
  if (sec.own && !own) { location.hash = '#/'; return; }
  const tabs = (sec.tabs || []).filter(t => !t[2] || own);
  const tab = tabs.some(t => t[0] === a) ? a : (tabs[0] || [])[0];
  document.querySelectorAll('aside a[data-r]').forEach(x => x.classList.toggle('on', x.dataset.r === sec.id));
  const ago = S.syncedAt ? Math.max(0, Math.round((Date.now() - S.syncedAt) / 60000)) : null;
  $('#main').innerHTML = `<header class="pgh"><div class="pgt"><button class="burger" onclick="document.body.classList.toggle('menu')">☰</button><h1>${sec.title}</h1>
    <div class="pga"><span class="sync ${S.error ? 'er' : ''}" title="${esc(S.error || '')}"><i></i>${S.error ? 'Bitrix24: ошибка' : ago == null ? 'Bitrix24' : ago < 1 ? 'Bitrix24 · только что' : 'Bitrix24 · ' + ago + ' мин назад'}</span></div></div>
    ${tabs.length > 1 ? `<nav class="stabs">${tabs.map(t => `<a href="#/${sec.id}/${t[0]}" class="${t[0] === tab ? 'on' : ''}">${t[1]}</a>`).join('')}</nav>` : ''}</header><div id="view"></div>`;
  const go = {
    home: () => pages.home(),
    sales: () => (tab === 'funnel' ? pages.funnel() : pages.sales()),
    team: () => { if (tab === 'att') { if (AT.view === 'setup') AT.view = 'day'; return pages.att(); } EFV.tab = tab === 'touch' ? 'touch' : 'index'; return pages.eff(); },
    calls: () => { CALLV = tab; return pages.calls(); },
    money: () => (tab === 'penalties' ? pages.penalties() : pages.payouts()),
    ai: () => pages.ai(),
    settings: () => ({ board: () => pages.board((cfg.boards[0] || {}).id, b || 'main'), managers: () => pages.managers(), users: () => pages.users(),
      terminal: () => { AT.view = 'setup'; return pages.att(); }, system: () => pages.settings() })[tab](),
  };
  go[sec.id]();
}
addEventListener('hashchange', route);
loadState().then(route).catch(e => { $('#main').innerHTML = `<div class="warn">Ошибка загрузки: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
