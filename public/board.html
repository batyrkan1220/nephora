<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safa Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f1222; --muted:#9aa1b5; --muted2:#6b7286; --line:#edf0f7; --soft:#f5f7fd; --panel:#f7f9fe; --card:#fff; --bg:#eef2fb;
  --blue:#1f6bff; --blue2:#3d86ff; --purple:#d68bf7; --purple2:#cf7cf4; --yellow:#fcd94a; --green:#12b76a; --red:#ef4444;
  --sh:0 12px 30px -20px rgba(15,18,34,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
#app{position:absolute;inset:1.6vh;background:#fff;border-radius:3.2vh;box-shadow:0 30px 80px -50px rgba(31,107,255,.35);display:flex;flex-direction:column;padding:3vh 2.4vw 1.8vh;gap:1.8vh}
html.rot #app{width:calc(100vh - 3.2vw);height:calc(100vw - 3.2vh);inset:auto;left:1.6vh;top:1.6vw;transform-origin:top left;transform:translateX(calc(100vw - 3.2vh)) rotate(90deg);border-radius:3.2vw}

/* ===== шапка ===== */
.hd{display:flex;align-items:stretch;gap:1.2em;flex-wrap:wrap}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.ttl h1{margin:0;font-size:2.5em;font-weight:500;letter-spacing:-.015em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl h1 b{font-weight:500;color:var(--blue)}
.ttl .per{color:var(--muted2);font-size:1em;margin-top:.25em}
.stat{border-radius:1.4em;padding:.75em 1.2em;min-width:8.5em;display:flex;flex-direction:column;justify-content:center}
.stat small{display:block;font-size:.8em;opacity:.9}
.stat b{font-size:1.75em;font-weight:500;line-height:1.15;letter-spacing:-.01em}
.stat.plan{min-width:17em}
.stat.plan .pb{margin-top:.4em}
.stat.kb{background:linear-gradient(160deg,#3d86ff,#1f6bff);color:#fff;box-shadow:0 18px 34px -22px rgba(31,107,255,.95)}
.stat.kp{background:linear-gradient(160deg,#e3a1fb,#cf7cf4);color:#fff;box-shadow:0 18px 34px -22px rgba(200,109,242,.95)}
.stat.kw{background:var(--panel);color:var(--ink)}
.stat.kw small{color:var(--muted2)}
.stat.kb .pb .tr,.stat.kp .pb .tr{background:rgba(255,255,255,.35)}
.stat.kb .pb .tr i,.stat.kp .pb .tr i{background:#fff}
.stat.kb .pb .pc,.stat.kp .pb .pc{color:#fff}
.stat.kb .pb .ck,.stat.kp .pb .ck{background:#fff;color:var(--green)}
.clock{align-self:center;font-weight:500;font-size:1.3em;background:var(--panel);color:var(--blue);border-radius:1em;padding:.6em 1em}
/* сағат пен карталар тұрақты енде — секунд сайын шапка жылжымайды */
.clock{flex:none;width:6.2em;text-align:center;padding:.6em 0;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.clock span{display:inline-block;width:.62em;text-align:center}
.hd .stat{flex:none}
.hd .stat.plan{width:17.5em;min-width:0}
.hd .stat.kw{width:9em;min-width:0}
.hd .stat:not(.plan):not(.kw){width:13em}
.stat b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== прогресс-бар ===== */
.pb{display:flex;align-items:center;gap:.6em}
.pb .tr{flex:1;height:.42em;border-radius:99px;background:#d5e3ff;overflow:hidden;position:relative}
.pb .tr i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--blue);transition:width .8s}
.pb.ok .tr i{background:var(--green)}
.pb .pc{font-weight:500;font-size:.9em;min-width:3.2em;text-align:right;color:var(--muted2)}
.pb.ok .pc{color:var(--green)}
.pb .ck{width:1.1em;height:1.1em;border-radius:50%;background:var(--green);color:#fff;display:none;place-items:center;font-size:.7em;font-weight:700;margin-left:-.3em}
.pb.ok .ck{display:grid}
.sub{font-size:.78em;color:var(--muted);margin-top:.25em;white-space:nowrap}
.sub b{color:var(--ink);font-weight:500}

/* ===== топ-3 ===== */
/* ===== таблица ===== */
.tbl{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel);border-radius:2em;padding:1em 1.2em 1.2em}
.row{display:grid;grid-template-columns:var(--cols);align-items:center;gap:1.2em;padding:0 1.2em 0 .9em}
.thd{color:var(--muted);font-size:.85em;height:2.2em}
.thd .r{text-align:right}
.thd .cnt{font-size:1em;font-weight:400}
.rows{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--gap);overflow:hidden}
.tr{height:var(--rh);flex:none;background:var(--card);border-radius:1.2em;box-shadow:var(--sh);position:relative;border-left:.3em solid transparent}
.tr .r{text-align:right}
.tr.t1{border-left-color:var(--blue)}.tr.t2{border-left-color:var(--purple2)}.tr.t3{border-left-color:var(--yellow)}
.tr.lose{background:#fff5f5;border-left-color:#fca5a5}
.tr.lose .place{background:#fee2e2;color:#dc2626}
.place{width:2em;height:2em;border-radius:.65em;display:grid;place-items:center;font-weight:600;font-size:.85em;background:var(--soft);color:var(--muted2);justify-self:center}
.t1 .place{background:var(--blue);color:#fff}.t2 .place{background:var(--purple2);color:#fff}.t3 .place{background:var(--yellow);color:var(--ink)}
.mg{display:flex;align-items:center;gap:.8em;min-width:0}
.mg .av{width:2.7em;height:2.7em;font-size:.85em}
.mg .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mg .dp{font-size:.78em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mg .w{min-width:0}
.mg .cr{display:none}
.big{font-weight:500;font-size:1.15em}
.cnt{text-align:center;font-weight:500;font-size:1.15em}
.pct small{display:block;color:var(--muted);font-size:.78em;white-space:nowrap}
.pct small em{font-style:normal;color:var(--blue)}
.el{display:inline-block;background:linear-gradient(135deg,#ffe680,#fcd94a);color:#7a5a00;font-weight:600;border-radius:99px;padding:0 .55em;margin-right:.45em;font-size:.95em}
.more{height:var(--rh);flex:none;border:1.5px dashed #d9e0ef;border-radius:1.2em;display:flex;align-items:center;gap:.8em;padding:0 1.2em;color:var(--muted2);font-size:.9em}
.more .avs{display:flex;padding-left:.3em}.more .avs .av{width:3.2em;height:3.2em;font-size:.65em;margin-left:-.7em;box-shadow:0 0 0 2px var(--panel)}
.more .rng{margin-left:auto;font-size:.85em;color:var(--muted)}
.tr.up{animation:flash 1.6s ease 3}
@keyframes flash{50%{box-shadow:0 0 0 3px var(--green),0 0 24px rgba(18,183,106,.5)}}

.av{border-radius:.9em;background:linear-gradient(135deg,#e3ecff,#f6e6ff);display:grid;place-items:center;font-weight:600;color:var(--blue);overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}

.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:.78em}
.foot .err{color:#dc2626;font-weight:500}
.center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:clamp(14px,2.4vh,26px);color:var(--muted2);padding:2em}
.center b{display:block;color:var(--ink);font-size:1.6em;font-weight:500;margin-bottom:.3em}


/* ===== секторы ===== */
.secs{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:1.2em}
.sc{background:var(--panel);border-radius:1.2em;padding:.7em 1.2em .75em;border-left:.3em solid var(--c)}
.sc .l1,.sc .l2{display:flex;align-items:center;gap:1em}
.sc .l2{margin-top:.35em}
.sc .sn{display:flex;align-items:center;gap:.5em;font-weight:500;font-size:1.05em;min-width:0;white-space:nowrap}
.sc .sn i{width:.7em;height:.7em;border-radius:.25em;background:var(--c);flex:none}
.sc .sn small{font-size:.72em;color:var(--muted);font-weight:400}
.sc .sv{margin-left:auto;color:var(--muted2);font-size:.95em;white-space:nowrap}
.sc .sv b{font-size:1.4em;font-weight:500;color:var(--ink);letter-spacing:-.01em}
.sc .l2 .pb{flex:1;min-width:6em}
.sc .l2 .sub{margin:0}
.sc .pb .tr i{background:var(--c)}
.sc .pb.ok .tr i{background:var(--green)}
.thd{position:relative}.thd .tn{position:absolute;right:0;top:-1.6em;font-size:.85em;color:var(--blue);display:none}
.md{font-weight:500;font-size:1.05em}.mu{color:var(--muted)}
.s2{display:block;color:var(--muted);font-size:.75em}
/* компактнее по высоте, чтобы топ-10 помещался целиком */
#app{gap:1.4vh}
.per .err{color:#dc2626}
.tbl{padding:.8em 1.2em 1em}
.tr .s2,.pct small{line-height:1.25}

/* ===== топ-10 + все менеджеры ===== */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:1.4em}
.main.solo{grid-template-columns:1fr}
.t10{background:linear-gradient(160deg,#eaf1ff,#f4ecff);border:1.5px solid #dbe6ff}
.t10h{display:flex;align-items:center;gap:.7em;padding:.1em .9em .45em;color:var(--muted2);font-size:.9em}
.t10b{background:linear-gradient(135deg,#3d86ff,#1f6bff);color:#fff;font-weight:600;border-radius:.6em;padding:.25em .75em;font-size:1.05em;letter-spacing:.03em;box-shadow:0 8px 18px -10px rgba(31,107,255,.9)}
.t10 .place{background:var(--blue);color:#fff}
.t10 .tr{border-left:.3em solid var(--blue)}
.rest{background:var(--panel);border-radius:2em;padding:1em 1.1em;display:flex;flex-direction:column;min-height:0}
.resth{display:flex;align-items:center;gap:.7em;padding:.1em .3em .6em;font-size:.95em}
.resth b{font-weight:500;font-size:1.1em}
.resth span{color:var(--muted)}
.resth .pg{margin-left:auto;display:flex;gap:.35em}
.resth .pg i{width:.55em;height:.55em;border-radius:50%;background:#d9e0ef}
.resth .pg i.on{background:var(--blue)}
.rlist{flex:1;min-height:0;display:grid;grid-template-rows:repeat(var(--rows),var(--rrh));grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:var(--rgap) 1em;align-content:start;overflow:hidden}
.rr{display:flex;align-items:center;gap:.65em;background:#fff;border-radius:.9em;padding:0 .9em 0 .55em;min-width:0;box-shadow:0 6px 16px -14px rgba(15,18,34,.4)}
.rr .place{width:1.8em;height:1.8em;font-size:.78em;flex:none}
.rr .av{width:1.9em;height:1.9em;font-size:.7em;border-radius:.6em}
.rr .w{flex:1;min-width:0}
.rr .nm{font-weight:500;font-size:.95em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr .dp{font-size:.7em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr .rs{text-align:right;white-space:nowrap}
.rr .rs b{font-weight:500;font-size:.98em;display:block}
.rr .rs small{font-size:.68em;color:var(--muted)}
.rr.up{animation:flash 1.6s ease 3}
html.pt .main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
html.pt .t10 .rows{flex:none}

/* ===== три колонки: секторы | топ сегодня | топ периода ===== */
.cols3{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.4em}
.col{background:var(--panel);border-radius:1.8em;padding:1em 1.1em;display:flex;flex-direction:column;min-height:0}
.col.cd{background:linear-gradient(170deg,#f6ecff,#f7f9fe 55%)}
.col.cp{background:linear-gradient(170deg,#e8f0ff,#f7f9fe 55%)}
.ch{display:flex;align-items:baseline;gap:.7em;padding:.1em .3em .7em}
.ch b{font-weight:600;font-size:1.2em;text-transform:uppercase;letter-spacing:.02em}
.cs .ch b{color:var(--ink)}.cd .ch b{color:#a347e0}.cp .ch b{color:var(--blue)}
.ch span{margin-left:auto;color:var(--muted);font-size:.8em}
.lst{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--gap);overflow:hidden}
.li{height:var(--rh);flex:none;display:flex;align-items:center;gap:.7em;background:#fff;border-radius:1em;padding:0 1em 0 .6em;box-shadow:0 8px 20px -16px rgba(15,18,34,.45);border:1.5px solid transparent;min-width:0}
.li .pl{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:.85em;background:var(--soft);color:var(--muted2);flex:none}
.li .av{width:2.6em;height:2.6em;font-size:.8em;border-radius:50%}
.li .w{flex:1;min-width:0}
.li .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .dp{font-size:.75em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.1em}
.li .sp{display:inline-block;background:#e8f0ff;color:var(--blue);border-radius:99px;padding:0 .6em}
.li .v{text-align:right;font-weight:600;font-size:1.15em;white-space:nowrap}
.li .v small{display:block;font-size:.62em;font-weight:400;color:var(--muted)}
.li.m1{background:linear-gradient(90deg,#fff3c4,#fff);border-color:#f5c542}.li.m1 .pl{background:#f5b400;color:#fff}
.li.m2{background:linear-gradient(90deg,#e9eef7,#fff);border-color:#c3cad8}.li.m2 .pl{background:#94a3b8;color:#fff}
.li.m3{background:linear-gradient(90deg,#ffe4d4,#fff);border-color:#f0a46c}.li.m3 .pl{background:#e07b39;color:#fff}
.li.none{justify-content:center;color:var(--muted);font-size:.9em;background:transparent;box-shadow:none;border:1.5px dashed #d9e0ef}
.li.up{animation:flash 1.6s ease 3}
.li.sec .v{font-size:1.3em}
.li .tag{display:inline-block;background:#fff;border:1px solid #f5c542;color:#a16207;border-radius:99px;padding:0 .55em;font-size:.68em;font-weight:500;vertical-align:middle}
.mini{height:.3em;border-radius:99px;background:#d5e3ff;margin-top:.35em;overflow:hidden;max-width:14em}
.mini i{display:block;height:100%;background:var(--blue);border-radius:99px}.mini i.ok{background:var(--green)}
.cfoot{margin-top:.8em;background:#fff;border-radius:1em;padding:.7em 1em}
.cfoot span{color:var(--muted2);font-size:.8em}.cfoot b{display:block;font-weight:500;font-size:1.05em;margin:.1em 0 .35em}

/* ===== улучшенный дизайн колонок ===== */
.per .lv{display:inline-flex;align-items:center;gap:.35em;background:#ffe9ec;color:#e11d48;font-weight:600;font-size:.78em;border-radius:99px;padding:.1em .6em;margin-right:.6em;vertical-align:middle}
.per .lv i{width:.5em;height:.5em;border-radius:50%;background:#e11d48;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.ch{align-items:center}
.ch .ci{width:2.1em;height:2.1em;border-radius:.7em;display:grid;place-items:center;color:#fff;flex:none}
.ch .ci svg{width:1.15em;height:1.15em}
.cs .ci{background:linear-gradient(135deg,#334155,#0f1222)}.cd .ci{background:linear-gradient(135deg,#e3a1fb,#c86df2)}.cp .ci{background:linear-gradient(135deg,#3d86ff,#1f6bff)}
.li{position:relative;overflow:hidden}
.li .lb{position:absolute;left:0;bottom:0;height:.22em;border-radius:0 99px 99px 0;opacity:.85}
.cd .li .lb{background:linear-gradient(90deg,#e3a1fb,#c86df2)}.cp .li .lb{background:linear-gradient(90deg,#7fb0ff,#1f6bff)}
.li.m1 .lb,.li.m2 .lb,.li.m3 .lb{opacity:.6}
.li .medal{width:2.2em;height:2.2em;flex:none;margin-left:-.1em;filter:drop-shadow(0 3px 4px rgba(0,0,0,.15))}
.li.first{box-shadow:0 12px 26px -16px rgba(245,180,0,.9)}
.li.first .nm{font-weight:600}
.li.first .v{font-size:1.3em}
.li.first::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.65) 45%,transparent 60%);transform:translateX(-100%);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.li.slot{background:transparent;box-shadow:none;border:1.5px dashed #dfe5f1;color:var(--muted)}
.li.slot .nm{font-weight:400;color:#b4bccd}.li.slot .dp{color:#c8cfdc}
/* секторы */
.slst{flex:1;min-height:0;display:flex;flex-direction:column;gap:.7em;overflow:hidden}
.scd{flex:1 1 0;max-height:13em;min-height:0;background:#fff;border-radius:1.3em;padding:.9em 1.2em;display:flex;flex-direction:column;box-shadow:0 10px 24px -18px rgba(15,18,34,.45);border-left:.35em solid var(--c);position:relative;overflow:hidden}
.scd.lead{background:linear-gradient(120deg,#fff8dc,#fff 60%)}
.scd .sh1{display:flex;align-items:center;gap:.55em;min-width:0}
.scd .sh1 b{font-weight:600;font-size:1.15em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scd .sh1 small{margin-left:auto;color:var(--muted);font-size:.75em;white-space:nowrap}
.scd .sr{width:1.7em;height:1.7em;border-radius:.55em;background:var(--c);color:#fff;display:grid;place-items:center;font-size:.8em;font-weight:600;flex:none}
.scd .tag{background:#fff3c4;color:#a16207;border-radius:99px;padding:.05em .6em;font-size:.72em;font-weight:500;white-space:nowrap}
.scd .sbody{flex:1;display:flex;align-items:center;gap:1em;min-height:0}
.scd .sdat{flex:1;min-width:0}
.scd .sdat small{color:var(--muted2);font-size:.78em}
.scd .sdat>b{display:block;font-size:2em;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.scd .sline{font-size:.78em;color:var(--muted2);margin-top:.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scd .sline b{color:var(--ink);font-weight:500}
.ring{--p:0;width:5.4em;height:5.4em;border-radius:50%;flex:none;display:grid;place-content:center;text-align:center;
  background:radial-gradient(closest-side,#fff 74%,transparent 75% 100%),conic-gradient(var(--c) calc(var(--p)*1%),#e8edf7 0)}
.ring.ok{background:radial-gradient(closest-side,#fff 74%,transparent 75% 100%),conic-gradient(var(--green) calc(var(--p)*1%),#e8edf7 0)}
.ring span{font-weight:600;font-size:1.15em;line-height:1}.ring small{font-size:.62em;color:var(--muted)}
.cfoot{display:flex;flex-direction:column;gap:.35em;background:linear-gradient(135deg,#0f1222,#2a2f4a);color:#fff;border-radius:1.2em;padding:.8em 1.1em;margin-top:.7em}
.cfoot span{color:#aab2c8;font-size:.78em}.cfoot b{display:block;font-weight:600;font-size:1.25em}.cfoot b em{font-style:normal;font-weight:400;color:#aab2c8;font-size:.75em}
.cfoot .pb .tr{background:rgba(255,255,255,.18)}.cfoot .pb .pc{color:#fff}
/* бегущая строка */
.tickr{display:flex;align-items:center;gap:1em;background:var(--panel);border-radius:1.1em;padding:0 0 0 .4em;height:2.6em;overflow:hidden;flex:none}
.tickr .tl{background:var(--blue);color:#fff;font-weight:600;font-size:.8em;border-radius:.8em;padding:.45em .9em;white-space:nowrap;flex:none}
.tw2{flex:1;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.tm{display:inline-flex;gap:2.5em;white-space:nowrap;animation:marq var(--d) linear infinite;padding-left:1em}
@keyframes marq{to{transform:translateX(-50%)}}
.ti{font-size:.92em}.ti b{font-weight:500}.ti small{color:var(--muted);font-size:.8em}.ti em{font-style:normal;color:var(--green);font-weight:600;margin-left:.3em}
@media (max-width:600px){.slst{flex:none;overflow:visible}.scd{flex:none;min-height:8em}.ring{width:4.6em;height:4.6em}}
html.pt .cols3{grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1fr)}
html.pt .cs{grid-column:1/-1}
html.pt .slst{flex-direction:row;flex:none}
html.pt .scd{flex:1 1 0;max-height:none}
html.pt .li .dp .el{display:none}
/* много секторов (до 6+): компактные строки — горизонтально при >3, вертикально при >2 */
.slst.many{flex-direction:column;gap:.5em}
.slst.many .scd{flex:1 1 0;max-height:7.2em;min-height:4.4em;padding:.55em 1em;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;align-content:center;align-items:center;column-gap:1em;row-gap:.2em}

/* ================= WOW: анимации ================= */
@property --p{syntax:'<number>';inherits:true;initial-value:0}
.aura{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.aura i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;opacity:.55;will-change:transform}
.aura i:nth-child(1){background:radial-gradient(circle,#9cc0ff 0%,transparent 62%);left:-18vmax;top:-22vmax;animation:drift1 26s ease-in-out infinite alternate}
.aura i:nth-child(2){background:radial-gradient(circle,#efc4ff 0%,transparent 62%);right:-20vmax;top:-10vmax;animation:drift2 31s ease-in-out infinite alternate}
.aura i:nth-child(3){background:radial-gradient(circle,#ffe8a3 0%,transparent 62%);left:20vw;bottom:-30vmax;animation:drift3 29s ease-in-out infinite alternate}
.aura i:nth-child(4){background:radial-gradient(circle,#b8f0d8 0%,transparent 62%);right:5vw;bottom:-28vmax;opacity:.35;animation:drift1 35s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(14vmax,10vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-12vmax,14vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(10vmax,-12vmax) scale(1.1)}}
#app{z-index:1;background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.9)}
/* заголовок с переливом */
.ttl h1 b{background:linear-gradient(90deg,#1f6bff,#8b5cf6,#c86df2,#1f6bff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 6s linear infinite}
@keyframes hue{to{background-position:300% 0}}
/* блики на KPI */
.stat.kb,.stat.kp{position:relative;overflow:hidden}
.stat.kb::after,.stat.kp::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);animation:sweep 5s ease-in-out infinite}
.stat.kp::after{animation-delay:2.5s}
@keyframes sweep{55%,100%{transform:translateX(120%)}}
/* бегущие полосы на прогрессе */
.pb .tr i{background-image:linear-gradient(45deg,rgba(255,255,255,.28) 25%,transparent 25% 50%,rgba(255,255,255,.28) 50% 75%,transparent 75%);background-size:1.2em 1.2em;animation:stripes 1.2s linear infinite}
@keyframes stripes{to{background-position:1.2em 0}}
.pb .tr i{background-color:var(--blue)}
.pb.ok .tr i{background-color:var(--green)}
.stat.kb .pb .tr i,.stat.kp .pb .tr i{background-color:#fff;background-image:linear-gradient(45deg,rgba(31,107,255,.15) 25%,transparent 25% 50%,rgba(31,107,255,.15) 50% 75%,transparent 75%)}
.sc .pb .tr i{background-color:var(--c)}
/* кольца плана заполняются */
.ring{transition:--p 1.5s cubic-bezier(.2,.8,.2,1)}
.intro .ring{animation:ringIn 1.8s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringIn{from{--p:0}}
/* вход: строки по очереди */
.intro .li,.intro .scd{animation:rowIn .7s cubic-bezier(.2,.9,.25,1.15) both;animation-delay:calc(var(--i,0)*70ms + .25s)}
.intro .cd .li{animation-delay:calc(var(--i,0)*70ms + .45s)}
.intro .cp .li{animation-delay:calc(var(--i,0)*70ms + .65s)}
@keyframes rowIn{from{opacity:0;transform:translateY(1.2em) scale(.97)}}
.intro .hd>*{animation:fadeDown .7s ease both}
.intro .hd>*:nth-child(2){animation-delay:.08s}.intro .hd>*:nth-child(3){animation-delay:.16s}.intro .hd>*:nth-child(4){animation-delay:.24s}.intro .hd>*:nth-child(5){animation-delay:.32s}
@keyframes fadeDown{from{opacity:0;transform:translateY(-1em)}}
.intro .pb .tr i,.intro .li .lb{animation:grow 1.6s cubic-bezier(.2,.8,.2,1) both,stripes 1.2s linear infinite}
.intro .li .lb{animation:grow 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0}}
/* медали покачиваются, корона лидера подпрыгивает */
.li .medal{transform-origin:50% 0;animation:swing 3s ease-in-out infinite}
.li.m2 .medal{animation-delay:.4s}.li.m3 .medal{animation-delay:.8s}
@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.avw{position:relative;display:inline-flex;flex:none}
.crw{position:absolute;width:1.25em;left:50%;top:-.62em;z-index:2;transform:translateX(-50%) rotate(-12deg);animation:crown 2.2s ease-in-out infinite;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
@keyframes crown{50%{transform:translateX(-50%) translateY(-.2em) rotate(8deg)}}
.li.first .av{box-shadow:0 0 0 .18em #fcd94a;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 .18em #fcd94a,0 0 1.2em .2em rgba(252,217,74,.75)}}
/* движение мест */
.mv{display:inline-block;margin-left:.45em;font-size:.68em;font-weight:700;border-radius:99px;padding:.05em .5em;vertical-align:middle;animation:pop2 .6s cubic-bezier(.2,1.6,.4,1) both,fadeMv 1s ease 9s forwards}
.mv.upm{background:#dcfce7;color:#15803d}.mv.nw{background:#ede9fe;color:#7c3aed}
@keyframes pop2{from{transform:scale(0)}}
@keyframes fadeMv{to{opacity:0}}
.li.moved{animation:moved 1.2s ease both}
@keyframes moved{0%{transform:translateY(1.4em);box-shadow:0 0 0 3px #22c55e}100%{transform:none}}
/* огонёк сектора-лидера */
.fl{display:inline-block;font-style:normal;animation:flame 1.1s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flame{50%{transform:scale(1.25) rotate(-6deg)}}
.scd.lead{animation:leadGlow 3s ease-in-out infinite}
@keyframes leadGlow{50%{box-shadow:0 10px 30px -12px rgba(245,180,0,.7)}}
.intro .scd.lead{animation:rowIn .7s cubic-bezier(.2,.9,.25,1.15) both .25s,leadGlow 3s ease-in-out infinite 1s}
/* LIVE пульс */
.per .lv{position:relative}
.per .lv::before{content:"";position:absolute;inset:0;border-radius:99px;box-shadow:0 0 0 0 rgba(225,29,72,.5);animation:ping 2s ease-out infinite}
@keyframes ping{to{box-shadow:0 0 0 .7em rgba(225,29,72,0)}}
/* попап: лучи и пульс аватара */
.pop .rays{position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.16) 0 7deg,transparent 7deg 18deg);animation:spin 18s linear infinite;pointer-events:none;
  mask-image:radial-gradient(circle,#000 0,transparent 55%)}
@keyframes spin{to{transform:rotate(360deg)}}
.pop .pav{position:relative;display:block;width:150px;height:150px;margin:22px auto 14px}
.pop .pav .av{margin:0;position:relative;z-index:1}
.pop .pav::before,.pop .pav::after{content:"";position:absolute;inset:0;border-radius:40px;border:3px solid rgba(255,255,255,.7);animation:ring2 1.8s ease-out infinite}
.pop .pav::after{animation-delay:.9s}
@keyframes ring2{to{transform:scale(1.5);opacity:0}}
.pop .sm{animation:pulseSum 1.2s ease-in-out infinite 1.6s}
@keyframes pulseSum{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* сектор вместо «Новая продажа» — крупно вверху карточки */
.pop .psec{display:inline-block;max-width:100%;background:#fff;color:var(--blue);border-radius:22px;padding:10px 30px 12px;font-weight:800;
  font-size:clamp(40px,7vmin,76px);line-height:1.05;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 14px 34px -14px rgba(15,18,34,.55);overflow-wrap:anywhere;animation:secIn .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes secIn{from{opacity:0;transform:translateY(-30px) scale(.6)}}
.pop .card{width:min(640px,90vw)}
@media (max-height:720px){
  .pop .card{padding:24px 26px 22px;border-radius:28px}
  .pop .psec{font-size:34px;padding:6px 20px 8px;border-radius:16px}
  .pop .pav{width:96px;height:96px;margin:12px auto 8px}.pop .pav .av{width:96px;height:96px;font-size:30px;border-radius:26px}
  .pop .pav::before,.pop .pav::after{border-radius:26px}
  .pop .nm{font-size:22px}.pop .sm{font-size:40px}.pop .tt{margin-top:2px;font-size:14px}.pop .pl{margin-top:8px;font-size:14px}
}
/* кнопка тестовой продажи */
.tbtn{flex:none;align-self:center;display:flex;align-items:center;gap:.45em;border:0;cursor:pointer;font:inherit;font-size:.85em;font-weight:600;line-height:1.1;text-align:left;
  color:#fff;background:linear-gradient(135deg,#ff8a00,#ff3d8b 55%,#c86df2);border-radius:1em;padding:.7em .95em;box-shadow:0 12px 26px -14px rgba(255,61,139,.95);transition:transform .15s}
.tbtn:hover{transform:translateY(-2px) scale(1.03)}.tbtn:active{transform:scale(.96)}
.tbtn{animation:tbPulse 2.6s ease-in-out infinite}
@keyframes tbPulse{50%{box-shadow:0 12px 26px -14px rgba(255,61,139,.95),0 0 0 .35em rgba(255,61,139,.15)}}
html.pt .tbtn{order:-1;margin-left:auto}
@media (max-width:600px){.tbtn{font-size:12px}}
/* ===== вертикальный экран (ТВ стоит вертикально или повёрнут) ===== */
html.pt .hd{flex-wrap:wrap;gap:1em}
html.pt .ttl{flex-basis:100%}
html.pt .ttl h1{font-size:2.8em;white-space:normal}
html.pt .stat{flex:1;min-width:0}
html.pt .stat.plan{min-width:0}

  .cols3{grid-template-columns:1fr;gap:12px}.lst{overflow:visible;flex:none}.col{padding:12px}

  .hd{gap:8px}.ttl{flex-basis:100%}.ttl h1{font-size:1.9em;white-space:normal}
  .stat{flex:1;min-width:0}.stat.plan{min-width:100%}.clock{display:none}

<body>
<div class="aura"><i></i><i></i><i></i><i></i></div>
<div id="app"><div class="center">Загрузка…</div></div>

<script>
const KEY = location.pathname.split('/')[2];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => Math.round(n || 0).toLocaleString('ru-RU').replace(/\s/g, ' ') + ' ₸';
const short = n => { n = Math.round(n || 0); return n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 1 : 2).replace(/\.?0+$/, '') + ' млн' : n.toLocaleString('ru-RU').replace(/\s/g, ' '); };
const fd = k => k ? k.slice(8, 10) + '.' + k.slice(5, 7) + '.' + k.slice(0, 4) : '';
const ini = n => esc(String(n || '?').split(/\s+/).map(x => x[0]).slice(0, 2).join('').toUpperCase());
const av = (r, cls = '') => `<div class="av ${cls}">${r.photo ? `<img src="${esc(r.photo)}" alt="" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createTextNode('${ini(r.name)}'))">` : ini(r.name)}</div>`;
const CROWN = (c, cls = 'crown') => `<svg class="${cls}" viewBox="0 0 64 44"><path d="M6 14l13 12 13-20 13 20 13-12-5 26H11z" fill="${c}" stroke="rgba(0,0,0,.2)" stroke-width="1.5"/><rect x="11" y="38" width="42" height="6" rx="2" fill="${c}"/><circle cx="6" cy="13" r="3.5" fill="#fff"/><circle cx="32" cy="5" r="4" fill="#fff"/><circle cx="58" cy="13" r="3.5" fill="#fff"/></svg>`;
const CC = ['#fcd94a', '#ffffff', '#ffffff'];

function bar(v, plan, extra = '') {
  if (!plan) return `<div class="pb"><div class="tr"><i style="width:0"></i></div><span class="pc">—</span></div>${extra}`;
  const p = v / plan * 100;
  return `<div class="pb ${p >= 100 ? 'ok' : ''}"><div class="tr"><i style="width:${Math.min(100, p).toFixed(1)}%"></i></div><span class="ck">✓</span><span class="pc">${Math.floor(p)}%</span></div>${extra}`;
}

let D = null, seq = 0, prev = {};
// кнопки «Тест продажа» и «Тест битва»: показ только на этом экране, данные не меняются
document.addEventListener('click', e => {
  const sale = e.target.closest('#testSale'), war = e.target.closest('#testWar');
  if ((!sale && !war) || !D) return;
  if (D.board.screen.sound && !soundOk) { soundOk = true; try { audio = new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); loadSale(); loadOvt(); } catch {} }
  const pool = D.rows.slice(0, 10), r = pool[Math.floor(Math.random() * pool.length)] || { name: 'Тестовый менеджер', photo: '' };
  const sum = (10 + Math.floor(Math.random() * 90)) * 5000;
  if (sale) return popup({ name: r.name, photo: r.photo, place: r.place, total: (r.sum || 0) + sum, sum, sector: r.sectorName || '', title: 'Тестовая продажа' });
  // «ОБГОН!»: сектор менеджера поднимается на одно место выше (если он первый — показываем второй сектор)
  const so = secOrder(D.sectors);
  if (so.length < 2) return;
  const i = so.findIndex(x => x.name === r.sectorName), k = i > 0 ? i : 1, me = so[k], lost = so[k - 1];
  const by = me.name === r.sectorName ? { name: r.name, photo: r.photo, sum } : (() => { const m = D.rows.find(x => x.sectorName === me.name) || { name: 'Менеджер', photo: '' }; return { name: m.name, photo: m.photo, sum }; })();
  queue.push({ kind: 'overtake', sec: me.name, place: k, lost: lost.name, lostPlace: k + 1, by, c1: secColor(me.id), c2: secColor(lost.id) }); if (!showing) next();
});
let audio = null, soundOk = false; // браузер разрешает звук только после клика на этой странице

function setRotation() {
  const v = D && D.board.screen.orientation === 'vertical' && innerWidth > innerHeight;
  document.documentElement.classList.toggle('rot', !!v);
}
function tick() { const c = $('#clock'); if (c) c.innerHTML = new Date().toLocaleTimeString('ru-RU', { timeZone: 'Asia/Almaty', hour: '2-digit', minute: '2-digit', second: '2-digit' }).split('').map(ch => /\d/.test(ch) ? `<span>${ch}</span>` : ch).join(''); }
setInterval(tick, 1000);

function render() {
  if (!D) return;
  setRotation();
  const sc = D.board.screen, cols = sc.cols, T = D.team, P = D.period;
  document.title = D.board.name + ' · Leaderboard';

  // колонки таблицы
  const ROT = document.documentElement.classList.contains('rot');
  const PH = innerWidth <= 600 && !ROT;
  // эффективный размер экрана (в повёрнутом режиме стороны меняются местами)
  const W = ROT ? innerHeight : innerWidth, HH = ROT ? innerWidth : innerHeight;
  const PT = !PH && HH > W;
  document.documentElement.classList.toggle('pt', PT);
  // масштаб от эталона 1920×1080 (вертикально 1080×1920): на любом ТВ выглядит одинаково
  $('#app').style.fontSize = PH ? '' : (PT ? Math.min(W * 0.015, HH * 0.00844) : Math.min(HH * 0.015, W * 0.00844)).toFixed(2) + 'px';

  const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const ALL = D.rows, SEC = (D.sectors || []).slice(), N = Math.max(3, D.topN || 10);
  const MON = D.month || { from: P.from, to: P.to }, TOPP = (MON.rows || ALL).slice(0, N); // топ месяца
  const TOPD = ALL.filter(r => r.daySum > 0).sort((a, b) => b.daySum - a.daySum || b.dayCnt - a.dayCnt).slice(0, N); // топ сегодня
  SEC.sort((a, b) => b.daySum - a.daySum || b.sum - a.sum);
  const MED = ['m1', 'm2', 'm3'];
  const SCOL = SECCOL;
  const MEDAL = i => `<svg class="medal" viewBox="0 0 32 32"><path d="M9 2h5l2 7-4 2zM23 2h-5l-2 7 4 2z" fill="${['#1f6bff', '#c86df2', '#12b76a'][i]}"/><circle cx="16" cy="19" r="10" fill="${['#f5b400', '#a8b3c7', '#e07b39'][i]}"/><circle cx="16" cy="19" r="7.2" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.4"/><text x="16" y="23.2" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Poppins,sans-serif">${i + 1}</text></svg>`;
  const place = i => i < 3 ? MEDAL(i) : `<span class="pl num">${i + 1}</span>`;

  // сектор: карточка растягивается на свободную высоту; кольцо — выполнение плана периода
  const secCard = (x, i) => {
    const pct = x.plan ? x.sum / x.plan * 100 : 0, c = secColor(x.id);
    return `<div class="scd ${i === 0 && x.daySum ? 'lead' : ''}" style="--c:${c};--t:${tint(c, .1)};--t2:${tint(c, .2)};--i:${i}">
      <div class="sh1"><span class="sr num">${i + 1}</span><b>${esc(x.name)}</b>${i === 0 && x.daySum ? '<span class="tag"><i class="fl">🔥</i> 1 место дня</span>' : ''}<small>${x.managers} ${plural(x.managers, 'менеджер', 'менеджера', 'менеджеров')}</small></div>
      <div class="sbody">
        <div class="sdat"><small>Касса сегодня</small><b class="num">${CU('s-' + x.id, x.daySum)}</b>
          <div class="sline num">период <b>${short(x.sum)}</b>${x.plan ? ` из ${short(x.plan)} ₸ · осталось <b>${short(Math.max(0, x.plan - x.sum))}</b>` : ' ₸ · план не задан'}</div>
          ${x.dayPlan ? `<div class="sline num">план дня ${short(x.dayPlan)} ₸ · ${Math.floor(x.daySum / x.dayPlan * 100)}%</div>` : ''}</div>
        ${x.plan ? `<div class="ring ${pct >= 100 ? 'ok' : ''}" style="--p:${Math.min(100, pct).toFixed(1)}"><span class="num">${Math.floor(pct)}%</span><small>плана</small></div>` : ''}
      </div></div>`;
  };
  const mgrRow = (r, i, today, lead) => {
    const up = prev[r.uid] !== undefined && prev[r.uid] < r.sum ? 'up' : '';
    const v = today ? r.daySum : r.sum, w = lead ? Math.max(4, v / lead * 100) : 0;
    const pp = placesPrev[today ? 'd' : 'p'];
    const was = pp ? pp[r.uid] : undefined;
    const mv = !pp ? '' : was === undefined ? '<span class="mv nw">NEW</span>' : was > i + 1 ? `<span class="mv upm">▲${was - i - 1}</span>` : '';
    const crown = i === 0 ? '<svg class="crw" viewBox="0 0 24 16"><path d="M2 14L1 3l6 5 5-7 5 7 6-5-1 11z" fill="#fcd94a" stroke="#d99a00" stroke-width="1.2" stroke-linejoin="round"/></svg>' : '';
    return `<div class="li ${MED[i] || ''} ${i === 0 ? 'first' : ''} ${up} ${mv ? 'moved' : ''}" style="--i:${i}">${place(i)}<span class="avw">${av(r)}${crown}</span>
      <div class="w"><div class="nm">${esc(r.name)}${mv}</div><div class="dp">${r.elite ? '<span class="el">★ Элит</span>' : ''}${r.dep ? `<span class="sp">${esc(r.dep)}</span>` : ''}</div></div>
      <span class="v num">${CU((today ? 'd-' : 'p-') + r.uid, v)}</span>
      <i class="lb" style="width:${w.toFixed(1)}%"></i></div>`;
  };
  const slot = i => `<div class="li slot" style="--i:${i}">${`<span class="pl num">${i + 1}</span>`}<div class="w"><div class="nm">Свободное место</div><div class="dp">ждём первую продажу</div></div></div>`;
  const ICO = {
    sec: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
    day: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
    per: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0zM17 6h3v2a3 3 0 01-3 3M7 6H4v2a3 3 0 003 3"/></svg>',
  };
  const REC = D.recent || [];

  const oldTick = $('.tickr'); if (oldTick) oldTick.remove();
  $('#app').innerHTML = `
    <div class="hd">
      <div class="ttl"><h1>${esc(D.board.name.split(' ').slice(0, -1).join(' '))} <b>${esc(D.board.name.split(' ').slice(-1)[0])}</b></h1>
        <div class="per num"><span class="lv"><i></i>LIVE</span>${esc(D.company || '')} · ${fd(P.from)} — ${fd(P.to)} · осталось раб. дней: ${P.daysLeft} · ${D.error ? `<span class="err">Bitrix24: ${esc(D.error)}</span>` : `<span id="upd">${updText()}</span>`}</div></div>
      ${T.dayPlan ? `<div class="stat plan kp"><small>Касса сегодня · план ${short(T.dayPlan)} ₸</small><b class="num">${CU('h-day', T.daySum)}</b>${bar(T.daySum, T.dayPlan)}</div>`
        : `<div class="stat kp"><small>Касса сегодня · вся компания</small><b class="num">${CU('h-day', T.daySum)}</b></div>`}
      ${T.plan ? `<div class="stat plan kb"><small>Касса периода · план ${short(T.plan)} ₸</small><b class="num">${CU('h-sum', T.sum)}</b>${bar(T.sum, T.plan)}</div>`
        : `<div class="stat kb"><small>Касса периода · вся компания</small><b class="num">${CU('h-sum', T.sum)}</b></div>`}
      <span class="clock num" id="clock"></span>
      <button class="tbtn" id="testSale" title="Показать тестовую продажу на этом экране">🎉<span>Тест<br>продажа</span></button>
      ${(D.sectors || []).length > 1 ? `<button class="tbtn war" id="testWar" title="Показать «ОБГОН!» битвы секторов на этом экране">🔥<span>Тест<br>битва</span></button>` : ''}
    </div>
    <div class="cols3">
      <div class="col cs"><div class="ch"><span class="ci">${ICO.sec}</span><b>Битва секторов</b><span>по кассе дня</span></div>
        <div class="slst ${SEC.length > (PT ? 2 : 3) ? 'many' : ''}" id="l1">${SEC.length ? SEC.map(secCard).join('') : '<div class="li none">Секторы появятся после синхронизации с Bitrix24</div>'}</div>
        ${T.plan ? `<div class="cfoot num"><div><span>План компании</span><b>${money(T.sum)} <em>/ ${short(T.plan)} ₸</em></b></div>${bar(T.sum, T.plan)}</div>` : ''}</div>
      <div class="col cd"><div class="ch"><span class="ci">${ICO.day}</span><b>Топ-${N} сегодня</b><span>касса за день</span></div>
        <div class="lst" id="l2">${TOPD.map((r, i) => mgrRow(r, i, true, TOPD[0].daySum)).join('')}${Array.from({ length: Math.max(0, N - TOPD.length) }, (_, k) => slot(TOPD.length + k)).join('')}</div></div>
      <div class="col cp"><div class="ch"><span class="ci">${ICO.per}</span><b>Топ-${N} месяца</b><span>${MONTHS[+MON.from.slice(5, 7) - 1]}</span></div>
        <div class="lst" id="l3">${TOPP.length ? TOPP.map((r, i) => mgrRow(r, i, false, TOPP[0].sum)).join('') : '<div class="li none">Пока нет продаж за месяц</div>'}</div></div>
    </div>
    ${REC.length && !PH ? `<div class="tickr" data-k="${esc(REC.map(x => x.name + x.sum).join('|'))}"><span class="tl">Последние продажи</span><div class="tw2"><div class="tm" style="--d:${Math.max(25, REC.length * 6)}s">${[...REC, ...REC].map(x => `<span class="ti"><b>${esc(x.name)}</b>${x.dep ? ` <small>${esc(x.dep)}</small>` : ''} <em class="num">+${money(x.sum)}</em></span>`).join('')}</div></div></div>` : ''}`;
  tick();
  if (!introDone) { $('#app').classList.add('intro'); introDone = true; setTimeout(() => $('#app') && $('#app').classList.remove('intro'), 4000); }
  runCounters();
  placesPrev.d = Object.fromEntries(TOPD.map((r, i) => [r.uid, i + 1]));
  placesPrev.p = Object.fromEntries(TOPP.map((r, i) => [r.uid, i + 1]));
  const newTick = $('.tickr');
  if (oldTick && newTick && oldTick.dataset.k === newTick.dataset.k) newTick.replaceWith(oldTick);

  // топ-листы: 10 строк всегда влезают — высота подстраивается под экран
  const fs = parseFloat(getComputedStyle($('#app')).fontSize);
  ['#l2', '#l3'].forEach(id => {
    const box = $(id); if (!box) return;
    const gap = Math.round(fs * .42);
    const rh = PH ? Math.round(fs * 3.4) : Math.max(Math.round(fs * 2.6), Math.min(Math.round(fs * 4.4), Math.floor((box.clientHeight - gap * (N - 1)) / N)));
    box.style.setProperty('--rh', rh + 'px'); box.style.setProperty('--gap', gap + 'px');
  });
  prev = Object.fromEntries(ALL.map(r => [r.uid, r.sum]));
}
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };

/* ===== звук и попап ===== */
/* звук продажи: public/sale.mp3 («Cha-Ching»), через Web Audio — после одного клика на экране */
let saleBuf = null, saleLoading = null;
function loadSale() {
  if (saleBuf || saleLoading || !audio) return saleLoading;
  saleLoading = fetch('/sale.mp3').then(r => r.arrayBuffer()).then(ab => new Promise((ok, no) => audio.decodeAudioData(ab, ok, no)))
    .then(b => { saleBuf = b; return b; }).catch(e => { console.warn('sale.mp3', e); saleLoading = null; });
  return saleLoading;
}
// звук «ОБГОН!»: барабанная дробь (public/overtake.mp3)
let ovtBuf = null, ovtLoading = null;
function loadOvt() {
  if (ovtBuf || ovtLoading || !audio) return ovtLoading;
  ovtLoading = fetch('/overtake.mp3').then(r => r.arrayBuffer()).then(ab => new Promise((ok, no) => audio.decodeAudioData(ab, ok, no)))
    .then(b => { ovtBuf = b; return b; }).catch(e => { console.warn('overtake.mp3', e); ovtLoading = null; });
  return ovtLoading;
}
async function drumRoll() {
  if (!soundOk || !D.board.screen.sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') await audio.resume();
    const buf = ovtBuf || await loadOvt();
    if (!buf) return chime();
    const src = audio.createBufferSource(); src.buffer = buf; src.connect(audio.destination); src.start();
  } catch (e) { console.warn(e); }
}
function synthChime() {
  const t0 = audio.currentTime;
  [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t0 + i * .11); g.gain.linearRampToValueAtTime(.25, t0 + i * .11 + .02); g.gain.exponentialRampToValueAtTime(.001, t0 + i * .11 + .6);
    o.connect(g).connect(audio.destination); o.start(t0 + i * .11); o.stop(t0 + i * .11 + .7);
  });
}
async function chime() {
  if (!soundOk || !D.board.screen.sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') await audio.resume();
    const buf = saleBuf || await loadSale();
    if (!buf) return synthChime();
    const src = audio.createBufferSource(), g = audio.createGain();
    src.buffer = buf; g.gain.value = 1; src.connect(g).connect(audio.destination); src.start();
  } catch (e) { console.warn(e); }
}
// без окна «Включить звук?»: звук включён сразу; если браузер блокирует автозвук — разблокируется первым касанием/клавишей (пульт ТВ)
function askSound() {
  if (!D.board.screen.sound) return;
  soundOk = true;
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume().catch(() => {}); loadSale(); loadOvt(); } catch {}
}
['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { try { if (audio && audio.state === 'suspended') audio.resume(); } catch {} }, { passive: true }));
const queue = []; let showing = false;
function popup(e) { queue.push(e); if (!showing) next(); }
function next() {
  const e = queue.shift(); if (!e) { showing = false; return; }
  showing = true;
  if (e.kind === 'overtake') return overtakeShow(e);
  const el = document.createElement('div'); el.className = 'pop';
  el.innerHTML = `<div class="rays"></div><div class="card">${e.sector ? `<div class="psec">${/^сектор/i.test(e.sector) ? esc(e.sector) : 'Сектор ' + esc(e.sector)}</div>` : '<span class="tag">🎉 Новая продажа</span>'}<div class="pav">${av(e)}</div><div class="nm">${esc(e.name)}</div>
    <div class="sm num">+<span id="psum">0 ₸</span></div>${e.title ? `<div class="tt">${esc(e.title)}</div>` : ''}
    ${e.place ? `<div class="pl">${e.place} место · ${money(e.total)} за период</div>` : ''}</div>`;
  document.body.appendChild(el);
  { const q = el.querySelector('.psec'); // длинное название сектора уменьшаем, пока не влезет
    if (q) { let f = parseFloat(getComputedStyle(q).fontSize); const fits = () => q.scrollWidth <= q.clientWidth + 1 && q.offsetHeight <= f * 1.05 * 2 + 26; if (q.scrollWidth > q.clientWidth + 1) q.style.whiteSpace = 'normal'; while (!fits() && f > 22) { f -= 2; q.style.fontSize = f + 'px'; } } }
  { const t0 = performance.now(), to = Math.round(e.sum || 0), ps = el.querySelector('#psum');
    const st = n => { const p = Math.min(1, (n - t0) / 1600), v = Math.round(to * (1 - Math.pow(1 - p, 4))); ps.textContent = money(v); if (p < 1) requestAnimationFrame(st); };
    requestAnimationFrame(st); }
  const colors = ['#4B4FE8', '#8B8EF6', '#ffffff', '#7CEB9B', '#FBBF24', '#C7C9FA'];
  for (let i = 0; i < 90; i++) {
    const c = document.createElement('i'); c.className = 'cf';
    c.style.cssText = `left:${Math.random() * 100}vw;background:${colors[i % colors.length]};animation-duration:${2.5 + Math.random() * 2.5}s;animation-delay:${Math.random() * .8}s;border-radius:${Math.random() > .5 ? '50%' : '2px'}`;
    document.body.appendChild(c); setTimeout(() => c.remove(), 6000);
  }
  chime();
  setTimeout(() => { el.remove(); next(); }, Math.min(60, Math.max(3, +D.board.screen.popupSec || 8)) * 1000);
}

/* ===== цвет сектора: свой у каждого и не меняется при смене мест ===== */
const SECCOL = ['#4B4FE8', '#F59E0B', '#16A34A', '#EF4444', '#06B6D4', '#EC4899', '#8B5CF6', '#84CC16'];
function secColor(id) {
  const ids = ((D && D.sectors) || []).map(x => String(x.id)).sort((a, b) => a.localeCompare(b, 'en', { numeric: true }));
  const i = ids.indexOf(String(id)); return SECCOL[(i < 0 ? 0 : i) % SECCOL.length];
}
// светлый оттенок цвета (без color-mix — работает на старых браузерах ТВ)
function tint(hex, a) { const n = parseInt(hex.slice(1), 16), m = c => Math.round(c * a + 255 * (1 - a)); return `rgb(${m(n >> 16)},${m((n >> 8) & 255)},${m(n & 255)})`; }
function shade(hex, a) { const n = parseInt(hex.slice(1), 16), m = c => Math.round(c * (1 - a)); return `rgb(${m(n >> 16)},${m((n >> 8) & 255)},${m(n & 255)})`; }

/* ===== жарыс секторов: «ОБГОН!», когда сектор обходит другой по кассе дня ===== */
let secPrev = null;
const secOrder = list => (list || []).slice().sort((a, b) => b.daySum - a.daySum || b.sum - a.sum);
function overtakeCheck(sectors, evs) {
  const now = secOrder(sectors), old = secPrev; secPrev = now.map(x => ({ id: x.id, daySum: x.daySum }));
  if (!old || now.length < 2 || D.board.screen.overtake === false) return;
  const oldIdx = Object.fromEntries(old.map((x, i) => [x.id, i])), oldSum = Object.fromEntries(old.map(x => [x.id, x.daySum]));
  now.forEach((x, i) => {
    if (oldIdx[x.id] === undefined || i >= oldIdx[x.id] || !(x.daySum > (oldSum[x.id] || 0))) return;
    // кого обогнал: были выше, теперь ниже
    const passed = now.filter((y, j) => j > i && oldIdx[y.id] !== undefined && oldIdx[y.id] < oldIdx[x.id]);
    if (!passed.length) return;
    const by = (evs || []).filter(e => e.sector === x.name).slice(-1)[0];
    const lost = passed[0];
    queue.push({ kind: 'overtake', sec: x.name, place: i + 1, lost: lost.name, lostPlace: now.indexOf(lost) + 1, by, c1: secColor(x.id), c2: secColor(lost.id) });
    if (!showing) next();
  });
}
const SICON = { fire: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3.2-.6 5-2 6.6C8.6 10.2 7 12 7 14.6A5 5 0 0012 20a5 5 0 005-5.2c0-2-1-3.4-2-4.6.1 1.6-.5 2.8-1.6 3.3.4-2.4-.3-4.5-1.4-6.3C11.4 5.6 12.4 4 12 2z"/></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.6-3.4 8-8 9-4.6-1-8-4.4-8-9V6z"/><path d="M8.5 12.2l2.4 2.4 4.6-4.8"/></svg>' };
function overtakeShow(e) {
  const el = document.createElement('div'); el.className = 'ovt';
  if (e.c1) el.style.cssText = `--o1:${e.c1};--o1d:${shade(e.c1, .25)};--o2:${shade(e.c2 || '#0F3B3A', .55)};--o2d:${shade(e.c2 || '#0F3B3A', .7)}`;
  el.innerHTML = `<div class="ovt-l"></div><div class="ovt-r"></div><div class="ovt-c">
    <span class="ovt-tag">СЕКТОРА</span><div class="ovt-h">ОБГОН!</div>
    <div class="ovt-ic"><span class="a">${SICON.fire}</span><i>›</i><span class="b">${SICON.shield}</span></div>
    <div class="ovt-s">${esc(e.sec)}</div><div class="ovt-p">Выходит на ${e.place}-е место дня</div>
    <div class="ovt-q">${esc(e.lost)} → ${e.lostPlace}-е место</div>
    ${e.by ? `<div class="ovt-by">${av(e.by)}<span>${esc(e.by.name)} · <b class="num">+${money(e.by.sum)}</b></span></div>` : ''}</div>`;
  document.body.appendChild(el);
  drumRoll();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => { el.remove(); next(); }, 450); }, Math.min(60, Math.max(5, +D.board.screen.popupSec || 8)) * 1000);
}

/* ===== загрузка ===== */
let lastKey = '';
/* ===== анимированные числа: от прошлого значения к новому (первый показ — от нуля) ===== */
const shown = {};
const CU = (k, v, fmt = 'm') => `<span class="cu" data-k="${k}" data-v="${Math.round(v || 0)}" data-f="${fmt}">${fmt === 'm' ? money(shown[k] ?? 0) : (shown[k] ?? 0)}</span>`;
function runCounters() {
  const els = [...document.querySelectorAll('.cu')]; if (!els.length) return;
  const items = els.map(el => { const k = el.dataset.k, to = +el.dataset.v, from = shown[k] ?? 0; shown[k] = to; return { el, from, to, f: el.dataset.f }; });
  const t0 = performance.now(), dur = 1400, ease = t => 1 - Math.pow(1 - t, 3);
  const step = now => {
    const p = Math.min(1, (now - t0) / dur), e = ease(p);
    for (const it of items) { const v = Math.round(it.from + (it.to - it.from) * e); it.el.textContent = it.f === 'm' ? money(v) : v; }
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
/* ===== движение мест в топах ===== */
const placesPrev = { d: null, p: null };
let introDone = false;
const updText = () => D.error ? '' : 'обновлено ' + new Date(D.syncedAt).toLocaleTimeString('ru-RU', { timeZone: 'Asia/Almaty', hour: '2-digit', minute: '2-digit' });
async function load() {
  try {
    const r = await fetch(`/api/board/${KEY}` + (D ? `?since=${seq}` : ''), { cache: 'no-store' });
    const j = await r.json();
    if (!r.ok) { $('#app').innerHTML = `<div class="center"><div><b>Лидерборд не найден</b>Проверьте ссылку в кабинете</div></div>`; return setTimeout(load, 30000); }
    if (j.paused) { $('#app').innerHTML = `<div class="center"><div><b>${esc(j.name)}</b>Лидерборд на паузе</div></div>`; D = null; return setTimeout(load, 15000); }
    const first = !D; D = j;
    // перерисовываем только при реальных изменениях — иначе анимации и бегущая строка «прыгают»
    const key = JSON.stringify({ ...j, syncedAt: 0, events: 0, seq: 0 });
    if (key !== lastKey) { lastKey = key; render(); }
    else { const u = $('#upd'); if (u) u.textContent = updText(); }
    if (!first && D.board.screen.popup) j.events.forEach(popup);
    overtakeCheck(j.sectors, j.events);
    seq = j.seq;
    if (first) askSound();
  } catch (e) { console.warn(e); }
  setTimeout(load, 5000);
}
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 200); });
load();
</script>
