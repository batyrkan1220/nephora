<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nephora Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== темы ===== */
:root,[data-theme=arena]{
  --bg:radial-gradient(1200px 700px at 0% 0%,#ffe1ef 0%,transparent 60%),radial-gradient(1100px 700px at 100% 10%,#dff3ff 0%,transparent 60%),radial-gradient(900px 600px at 50% 100%,#fff1c7 0%,transparent 60%),#fff8f0;
  --ink:#1f1640; --muted:#7a7196; --card:#fff; --line:#ece4ff; --soft:#f5f0ff;
  --accent:linear-gradient(90deg,#ff3d8b,#a24bff 50%,#22b8f0); --accent1:#a24bff; --hot:#e11d74;
  --bar:#ede7ff; --barfill:linear-gradient(90deg,#ff8a00,#ff3d8b); --barok:linear-gradient(90deg,#10b981,#22c55e);
  --g1:linear-gradient(160deg,#fff08a 0%,#ffc21a 45%,#ff8a00 100%); --g1ink:#3d1f00;
  --g2:linear-gradient(160deg,#7ee0ff 0%,#22b8f0 50%,#3b6cf5 100%); --g2ink:#fff;
  --g3:linear-gradient(160deg,#ffb3d0 0%,#ff5c9d 50%,#e8237a 100%); --g3ink:#fff;
  --r1:linear-gradient(90deg,#fff3c4,#fff); --r2:linear-gradient(90deg,#dff4ff,#fff); --r3:linear-gradient(90deg,#ffe0ee,#fff);
  --r1b:#ffc21a; --r2b:#22b8f0; --r3b:#ff5c9d;
  --lose:linear-gradient(90deg,#ffe4e6,#fff5f5); --loseb:#fda4af; --losek:#e11d48;
  --shadow:0 14px 34px -22px rgba(123,92,255,.75);
}
[data-theme=day]{
  --bg:#f4f5fa; --ink:#111827; --muted:#6b7280; --card:#fff; --line:#e5e7eb; --soft:#f3f4f6;
  --accent:linear-gradient(90deg,#111827,#374151); --accent1:#111827; --hot:#16a34a;
  --bar:#dbe4ff; --barfill:linear-gradient(90deg,#60a5fa,#3b82f6); --barok:linear-gradient(90deg,#22c55e,#16a34a);
  --g1:linear-gradient(180deg,#fff6d6,#ffe08a); --g1ink:#111827;
  --g2:linear-gradient(180deg,#f3f5fa,#d9dfeb); --g2ink:#111827;
  --g3:linear-gradient(180deg,#fff0e2,#f6c49b); --g3ink:#111827;
  --r1:linear-gradient(90deg,#fff1c2,#fffaf0); --r2:linear-gradient(90deg,#e7ebf3,#f8f9fc); --r3:linear-gradient(90deg,#fde3cf,#fff7f0);
  --r1b:#f2c94c; --r2b:#c3cad8; --r3b:#eaa86f;
  --lose:linear-gradient(90deg,#fde2e2,#fff5f5); --loseb:#f5b5b5; --losek:#dc2626;
  --shadow:0 8px 24px -18px rgba(17,24,39,.5);
}
[data-theme=night]{
  --bg:radial-gradient(1000px 600px at 10% 0%,#1d1b4b 0%,transparent 60%),radial-gradient(900px 600px at 100% 100%,#3b0d3a 0%,transparent 60%),#0b0a1a;
  --ink:#f5f3ff; --muted:#a39fc4; --card:#15132c; --line:#2a2650; --soft:#1d1a3c;
  --accent:linear-gradient(90deg,#ff3d8b,#a24bff 50%,#22b8f0); --accent1:#a78bfa; --hot:#f472b6;
  --bar:#2a2650; --barfill:linear-gradient(90deg,#ff8a00,#ff3d8b); --barok:linear-gradient(90deg,#10b981,#4ade80);
  --g1:linear-gradient(160deg,#ffe066 0%,#ffb703 45%,#fb8500 100%); --g1ink:#2b1500;
  --g2:linear-gradient(160deg,#4cc9f0 0%,#4361ee 100%); --g2ink:#fff;
  --g3:linear-gradient(160deg,#ff8fab 0%,#f72585 100%); --g3ink:#fff;
  --r1:linear-gradient(90deg,#4a3a0c,#15132c); --r2:linear-gradient(90deg,#123a52,#15132c); --r3:linear-gradient(90deg,#4d1233,#15132c);
  --r1b:#ffb703; --r2b:#4cc9f0; --r3b:#f72585;
  --lose:linear-gradient(90deg,#4c0f1c,#15132c); --loseb:#9f1239; --losek:#fb7185;
  --shadow:0 14px 34px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);background-attachment:fixed;color:var(--ink);font-family:Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
#app{position:absolute;inset:0;display:flex;flex-direction:column;padding:2.2vh 2vw 1.6vh;gap:1.6vh;font-size:clamp(11px,1.5vh,20px)}
html.rot #app{width:100vh;height:100vw;inset:auto;left:0;top:0;transform-origin:top left;transform:translateX(100vw) rotate(90deg);font-size:clamp(11px,1.5vw,20px)}

/* ===== шапка ===== */
.hd{display:flex;align-items:center;gap:1.2em;flex-wrap:wrap}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-size:2.3em;font-weight:800;letter-spacing:-.01em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-theme=arena] .ttl h1 b,[data-theme=night] .ttl h1 b{background:var(--accent);-webkit-background-clip:text;background-clip:text;color:transparent}
.ttl .per{color:var(--muted);font-weight:600;font-size:1em;margin-top:.15em}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:1em;padding:.5em 1em;box-shadow:var(--shadow);text-align:right;min-width:7em}
.stat small{display:block;color:var(--muted);font-size:.78em;font-weight:600}
.stat b{font-size:1.5em;font-weight:800;line-height:1.15}
.stat.plan{min-width:17em;text-align:left}
.stat.plan .pb{margin-top:.35em}
.tg{display:flex;background:var(--card);border:1.5px solid var(--line);border-radius:.9em;padding:.25em;gap:.2em;box-shadow:var(--shadow)}
.tg button{border:0;background:none;color:var(--muted);width:2.3em;height:2.3em;border-radius:.65em;display:grid;place-items:center;cursor:pointer;padding:0}
.tg button svg{width:1.2em;height:1.2em}
.tg button.on{background:var(--ink);color:var(--card)}
.clock{font-weight:800;font-size:1.25em;background:var(--accent);color:#fff;border-radius:99px;padding:.45em 1em}
[data-theme=day] .clock{background:#111827}

/* ===== прогресс-бар ===== */
.pb{display:flex;align-items:center;gap:.6em}
.pb .tr{flex:1;height:.62em;border-radius:99px;background:var(--bar);overflow:hidden;position:relative}
.pb .tr i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--barfill);transition:width .8s}
.pb.ok .tr i{background:var(--barok)}
.pb .pc{font-weight:700;font-size:.9em;min-width:3.2em;text-align:right}
.pb.ok .pc{color:#16a34a}
.pb .ck{width:1.1em;height:1.1em;border-radius:50%;background:#22c55e;color:#fff;display:none;place-items:center;font-size:.7em;font-weight:900;margin-left:-.3em}
.pb.ok .ck{display:grid}
.sub{font-size:.78em;color:var(--muted);margin-top:.2em;white-space:nowrap}
.sub b{color:var(--ink)}

/* ===== топ-3 ===== */
.top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.4em}
.tc{position:relative;border-radius:1.3em;padding:1em 1.3em;display:flex;align-items:center;gap:1em;min-height:7.5em;overflow:hidden;box-shadow:var(--shadow)}
.tc.p1{background:var(--g1);color:var(--g1ink);box-shadow:0 0 0 3px #fff,0 18px 40px -18px rgba(255,138,0,.9)}
.tc.p2{background:var(--g2);color:var(--g2ink)}
.tc.p3{background:var(--g3);color:var(--g3ink)}
[data-theme=day] .tc.p1{box-shadow:0 0 0 1.5px #f2c94c,var(--shadow)}
[data-theme=day] .tc.p2{box-shadow:0 0 0 1.5px #c3cad8,var(--shadow)}
[data-theme=day] .tc.p3{box-shadow:0 0 0 1.5px #eaa86f,var(--shadow)}
.tc .av{width:4.6em;height:4.6em;font-size:1em;box-shadow:0 0 0 .22em rgba(255,255,255,.9)}
.tc .crown{position:absolute;left:2.25em;top:.2em;width:2.1em;transform:translateX(-50%) rotate(-14deg);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.tc .info{min-width:0;flex:1}
.tc .pl{font-weight:800;font-size:.95em;letter-spacing:.06em;text-transform:uppercase;opacity:.85;display:flex;gap:.6em;align-items:center}
.tc .badge{font-size:.72em;letter-spacing:0;text-transform:none;background:#16a34a;color:#fff;border-radius:99px;padding:.1em .6em;font-weight:700}
.tc .nm{font-weight:800;font-size:1.35em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:.1em 0}
.tc .v{font-weight:800;font-size:2em;line-height:1.05;letter-spacing:-.01em}
.tc .td{font-weight:600;font-size:.85em;opacity:.85;margin-top:.15em}
.tc.empty{opacity:.45}

/* ===== таблица ===== */
.tbl{flex:1;min-height:0;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:var(--cols);align-items:center;gap:1.2em;padding:0 1.2em 0 .8em}
.thd{color:var(--muted);font-size:.82em;font-weight:600;height:2.2em}
.thd .r{text-align:right}
.rows{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--gap);overflow:hidden}
.tr{height:var(--rh);flex:none;background:var(--card);border:1.5px solid var(--line);border-radius:1em;box-shadow:var(--shadow);position:relative}
.tr .r{text-align:right}
.tr.t1{background:var(--r1);border-color:var(--r1b)}.tr.t2{background:var(--r2);border-color:var(--r2b)}.tr.t3{background:var(--r3);border-color:var(--r3b)}
.tr.lose{background:var(--lose);border-color:var(--loseb)}
.tr.lose .place{background:var(--losek);color:#fff}
.place{width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85em;background:var(--soft);color:var(--muted);justify-self:center}
.t1 .place{background:#f2b705;color:#fff}.t2 .place{background:#94a3b8;color:#fff}.t3 .place{background:#e07b39;color:#fff}
.mg{display:flex;align-items:center;gap:.8em;min-width:0}
.mg .av{width:2.6em;height:2.6em;font-size:.85em}
.mg .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mg .dp{font-size:.75em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mg .w{min-width:0}
.mg .cr{position:absolute;width:1.3em;left:2.9em;top:.05em;transform:rotate(-14deg)}
.big{font-weight:800;font-size:1.15em}
.cnt{text-align:center;font-weight:700;font-size:1.15em}
.pct small{display:block;color:var(--muted);font-size:.75em}
.more{height:var(--rh);flex:none;border:1.5px dashed var(--line);border-radius:1em;display:flex;align-items:center;gap:.8em;padding:0 1.2em;color:var(--muted);font-weight:600;font-size:.9em}
.more .avs{display:flex;padding-left:.3em}.more .avs .av{width:3.2em;height:3.2em;font-size:.65em;margin-left:-.7em;box-shadow:0 0 0 2px var(--card)}
.more .rng{margin-left:auto;font-size:.85em}
.tr.up{animation:flash 1.6s ease 3}
@keyframes flash{50%{box-shadow:0 0 0 3px #22c55e,0 0 24px rgba(34,197,94,.6)}}

.av{border-radius:50%;background:linear-gradient(135deg,#efe7ff,#ffe3f0);display:grid;place-items:center;font-weight:800;color:#6a3df5;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}

.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:.75em;font-weight:500}
.foot .err{color:#dc2626;font-weight:700}
.center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:clamp(14px,2.4vh,26px);color:var(--muted);padding:2em}
.center b{display:block;color:var(--ink);font-size:1.6em;margin-bottom:.3em}

/* ===== телефон ===== */
@media (max-width:760px){
  html,body{overflow:auto;height:auto}
  #app{position:static;padding:14px 12px 20px;gap:12px;font-size:13px}
  .hd{gap:8px}.ttl{flex-basis:100%}.ttl h1{font-size:1.9em;white-space:normal}
  .stat{flex:1;min-width:0}.stat.plan{min-width:100%}
  .top{grid-template-columns:1fr;gap:10px}
  .tc{min-height:0;padding:.8em 1em}.tc .av{width:3.6em;height:3.6em}.tc .v{font-size:1.6em}.tc .crown{left:1.9em}
  .row{gap:.6em;padding:0 .8em 0 .4em}
  .rows{overflow:visible}
  .tr{height:auto;min-height:var(--rh);padding-block:.5em}
  .c-today,.c-pct,.c-salary{display:none!important}
}
/* ===== попап продажи ===== */
.pop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(20,10,40,.45);backdrop-filter:blur(6px);animation:fade .35s}
.pop .card{position:relative;width:min(560px,86vw);border-radius:32px;padding:44px 36px 36px;text-align:center;color:#fff;
  background:linear-gradient(160deg,#ff8a00,#ff3d8b 45%,#a24bff);box-shadow:0 40px 90px -30px rgba(162,75,255,.9);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.pop .tag{display:inline-block;background:#fff;color:#e11d74;font-weight:800;border-radius:99px;padding:8px 22px;letter-spacing:.12em;font-size:15px;text-transform:uppercase}
.pop .av{width:150px;height:150px;margin:22px auto 14px;font-size:44px;box-shadow:0 0 0 6px #fff,0 18px 40px rgba(0,0,0,.25)}
.pop .nm{font-size:30px;font-weight:800}
.pop .sm{font-size:56px;font-weight:900;letter-spacing:-.02em;line-height:1.1;margin-top:6px;text-shadow:0 6px 20px rgba(0,0,0,.2)}
.pop .tt{opacity:.9;font-weight:600;margin-top:6px}
.pop .pl{margin-top:14px;font-weight:700;background:rgba(255,255,255,.2);display:inline-block;padding:6px 16px;border-radius:99px}
.cf{position:fixed;top:-20px;width:10px;height:16px;z-index:21;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes fade{from{opacity:0}}
.snd{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:22px;padding:20px 24px;width:min(520px,92vw);box-shadow:0 30px 60px -20px rgba(0,0,0,.35);font-size:15px}
.snd b{font-size:18px}.snd p{margin:6px 0 14px;color:var(--muted)}
.snd button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 20px;cursor:pointer;background:#111827;color:#fff;margin-right:8px}
.snd button.no{background:var(--soft);color:var(--ink)}
</style>
</head>
<body>
<div id="app"><div class="center">Загрузка…</div></div>

<script>
const KEY = location.pathname.split('/')[2];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => Math.round(n || 0).toLocaleString('ru-RU').replace(/\s/g, ' ') + ' ₸';
const short = n => { n = Math.round(n || 0); return n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 1 : 2).replace(/\.?0+$/, '') + ' млн' : n.toLocaleString('ru-RU').replace(/\s/g, ' '); };
const fd = k => k ? k.slice(8, 10) + '.' + k.slice(5, 7) + '.' + k.slice(0, 4) : '';
const ini = n => esc(String(n || '?').split(/\s+/).map(x => x[0]).slice(0, 2).join('').toUpperCase());
const av = (r, cls = '') => `<div class="av ${cls}">${r.photo ? `<img src="${esc(r.photo)}" alt="" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createTextNode('${ini(r.name)}'))">` : ini(r.name)}</div>`;
const CROWN = (c, cls = 'crown') => `<svg class="${cls}" viewBox="0 0 64 44"><path d="M6 14l13 12 13-20 13 20 13-12-5 26H11z" fill="${c}" stroke="rgba(0,0,0,.2)" stroke-width="1.5"/><rect x="11" y="38" width="42" height="6" rx="2" fill="${c}"/><circle cx="6" cy="13" r="3.5" fill="#fff"/><circle cx="32" cy="5" r="4" fill="#fff"/><circle cx="58" cy="13" r="3.5" fill="#fff"/></svg>`;
const CC = ['#ffb703', '#94a3b8', '#e07b39'];
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
const STAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21l1.5-7L2 9.3l7-.8z"/></svg>';

function bar(v, plan, extra = '') {
  if (!plan) return `<div class="pb"><div class="tr"><i style="width:0"></i></div><span class="pc">—</span></div>${extra}`;
  const p = v / plan * 100;
  return `<div class="pb ${p >= 100 ? 'ok' : ''}"><div class="tr"><i style="width:${Math.min(100, p).toFixed(1)}%"></i></div><span class="ck">✓</span><span class="pc">${Math.floor(p)}%</span></div>${extra}`;
}

let D = null, seq = 0, prev = {}, themeOverride = localStorage.getItem('lb-theme-' + KEY) || '';
let audio = null, soundOk = sessionStorage.getItem('lb-sound') === '1';

function setTheme() {
  const t = themeOverride || (D && D.board.screen.theme) || 'arena';
  document.documentElement.dataset.theme = t;
}
function setRotation() {
  const v = D && D.board.screen.orientation === 'vertical' && innerWidth > innerHeight;
  document.documentElement.classList.toggle('rot', !!v);
}
function tick() { const c = $('#clock'); if (c) c.textContent = new Date().toLocaleTimeString('ru-RU', { timeZone: 'Asia/Almaty', hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
setInterval(tick, 1000);

function render() {
  if (!D) return;
  setTheme(); setRotation();
  const sc = D.board.screen, cols = sc.cols, T = D.team, P = D.period;
  document.title = D.board.name + ' · Leaderboard';
  const theme = document.documentElement.dataset.theme;

  // колонки таблицы
  const PH = innerWidth <= 760 && !document.documentElement.classList.contains('rot');
  const C = [['2.2em', '#', ''], ['minmax(0,2.4fr)', 'Менеджер', '']];
  if (cols.today && !PH) C.push(['minmax(0,1.6fr)', 'Сегодня', '']);
  if (cols.sales) C.push(['minmax(0,1.9fr)', 'Продажи', '']);
  if (cols.count) C.push(['5em', 'Кол-во', 'cnt']);
  if (cols.pct && !PH) C.push(['minmax(0,1fr)', '% от продаж', 'r']);
  if (cols.salary && !PH) C.push(['minmax(0,1.1fr)', 'Зарплата', 'r']);
  const tmpl = C.map(c => c[0]).join(' ');

  const R = D.rows;
  const top = [R[0], R[1], R[2]];
  const tcard = (r, i) => !r ? `<div class="tc p${i + 1} empty">${av({ name: '?' })}<div class="info"><div class="pl">${i + 1} место</div><div class="nm">—</div></div></div>`
    : `<div class="tc p${i + 1}">${CROWN(CC[i])}${av(r)}<div class="info">
        <div class="pl">${i + 1} место ${r.planPct >= 100 ? '<span class="badge">✓ План</span>' : ''}</div>
        <div class="nm">${esc(r.name)}</div>
        <div class="v num">${D.board.rankBy === 'count' ? r.cnt + ' прод.' : money(r.sum)}</div>
        <div class="td num">сегодня ${r.daySum ? money(r.daySum) : '—'}${r.plan ? ' · план ' + Math.floor(r.planPct) + '%' : ''}</div></div></div>`;

  const rowHtml = r => {
    const t = r.place <= 3 && r.sum > 0 ? 't' + r.place : '';
    const lose = sc.losers && R.length > 6 && r.place > R.length - 3 ? 'lose' : '';
    const up = prev[r.uid] !== undefined && prev[r.uid] < r.sum ? 'up' : '';
    let h = `<div class="tr row ${t} ${lose} ${up}"><span class="place num">${r.place}</span>
      <div class="mg">${t ? CROWN(CC[r.place - 1], 'cr') : ''}${av(r)}<div class="w"><div class="nm">${esc(r.name)}</div><div class="dp">${esc(r.dep)}</div></div></div>`;
    if (cols.today && !PH) h += `<div>${bar(r.daySum, r.dayPlan, `<div class="sub num"><b>${short(r.daySum)}</b>${r.dayPlan ? ' / ' + short(r.dayPlan) + ' ₸' : ' ₸'}</div>`)}</div>`;
    if (cols.sales) h += `<div>${bar(r.sum, r.plan, `<div class="sub num"><b>${short(r.sum)}</b>${r.plan ? ' / ' + short(r.plan) + ' ₸' : ' ₸'}</div>`)}</div>`;
    if (cols.count) h += `<span class="cnt num">${r.cnt}</span>`;
    if (cols.pct && !PH) h += `<span class="r pct num">${r.comm ? money(r.comm) : '—'}<small>${r.comm ? (Math.round(r.commPct * 10) / 10) + '%' : ''}</small></span>`;
    if (cols.salary && !PH) h += `<span class="r big num">${money(r.salary)}</span>`;
    return h + '</div>';
  };

  $('#app').innerHTML = `
    <div class="hd">
      <div class="ttl"><h1>${esc(D.board.name.split(' ').slice(0, -1).join(' '))} <b>${esc(D.board.name.split(' ').slice(-1)[0])}</b></h1>
        <div class="per num">${esc(D.company || '')} · ${fd(P.from)} — ${fd(P.to)} · осталось раб. дней: ${P.daysLeft}</div></div>
      ${T.plan ? `<div class="stat plan"><small>План отдела · осталось ${money(T.left)}</small><b class="num">${money(T.sum)}</b>${bar(T.sum, T.plan)}</div>` : ''}
      ${T.dayPlan ? `<div class="stat plan"><small>План на сегодня · осталось ${money(T.dayLeft)}</small><b class="num">${money(T.daySum)}</b>${bar(T.daySum, T.dayPlan)}</div>`
        : `<div class="stat"><small>Сегодня</small><b class="num">${money(T.daySum)}</b></div>`}
      <div class="stat"><small>Всего продаж</small><b class="num">${T.cnt}</b></div>
      <div class="tg">${[['arena', STAR], ['day', SUN], ['night', MOON]].map(([k, i]) => `<button data-t="${k}" class="${theme === k ? 'on' : ''}" title="${k}">${i}</button>`).join('')}</div>
      <span class="clock num" id="clock"></span>
    </div>
    <div class="top">${tcard(top[0], 0)}${tcard(top[1], 1)}${tcard(top[2], 2)}</div>
    <div class="tbl" style="--cols:${tmpl}">
      <div class="row thd">${C.map(c => `<span class="${c[2]}">${c[1]}</span>`).join('')}</div>
      <div class="rows" id="rows"></div>
    </div>
    <div class="foot"><span>${D.error ? `<span class="err">Bitrix24: ${esc(D.error)}</span>` : 'Обновлено ' + new Date(D.syncedAt).toLocaleTimeString('ru-RU', { timeZone: 'Asia/Almaty', hour: '2-digit', minute: '2-digit' })}</span><span>Nephora Leaderboard</span></div>`;
  tick();
  document.querySelectorAll('.tg button').forEach(b => b.onclick = () => {
    themeOverride = b.dataset.t === (D.board.screen.theme || 'arena') ? '' : b.dataset.t;
    localStorage.setItem('lb-theme-' + KEY, themeOverride); render();
  });

  // строки: сколько помещается
  const box = $('#rows'), app = $('#app');
  const fs = parseFloat(getComputedStyle(app).fontSize);
  const gap = Math.round(fs * .55), rh = Math.round(fs * 3.6);
  box.style.setProperty('--gap', gap + 'px'); box.style.setProperty('--rh', rh + 'px');
  const cap = Math.max(4, Math.floor((box.clientHeight + gap) / (rh + gap)));
  let html;
  if (!R.length) html = `<div class="more" style="justify-content:center">Пока нет участников и продаж за период</div>`;
  else if (PH || R.length <= cap) html = R.map(rowHtml).join('');
  else {
    const head = R.slice(0, cap - 4), tail = R.slice(-3), mid = R.slice(cap - 4, R.length - 3);
    html = head.map(rowHtml).join('') +
      `<div class="more"><div class="avs">${mid.slice(0, 4).map(r => av(r)).join('')}</div>Ещё ${mid.length} ${plural(mid.length, 'менеджер', 'менеджера', 'менеджеров')}<span class="rng">места ${mid[0].place}–${mid[mid.length - 1].place}</span></div>` +
      tail.map(rowHtml).join('');
  }
  box.innerHTML = html;
  prev = Object.fromEntries(R.map(r => [r.uid, r.sum]));
}
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };

/* ===== звук и попап ===== */
function chime() {
  if (!soundOk || !D.board.screen.sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audio.currentTime;
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0 + i * .11); g.gain.linearRampToValueAtTime(.25, t0 + i * .11 + .02); g.gain.exponentialRampToValueAtTime(.001, t0 + i * .11 + .6);
      o.connect(g).connect(audio.destination); o.start(t0 + i * .11); o.stop(t0 + i * .11 + .7);
    });
  } catch {}
}
function askSound() {
  if (soundOk || !D.board.screen.sound || !D.board.screen.popup || $('.snd')) return;
  const el = document.createElement('div'); el.className = 'snd';
  el.innerHTML = `<b>Включить звук?</b><p>Браузер не играет звук сам. Нажмите «Разрешить», чтобы слышать звук новой продажи.</p><button class="yes">Разрешить</button><button class="no">Без звука</button>`;
  document.body.appendChild(el);
  el.querySelector('.yes').onclick = () => { soundOk = true; sessionStorage.setItem('lb-sound', '1'); audio = new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); el.remove(); };
  el.querySelector('.no').onclick = () => el.remove();
}
const queue = []; let showing = false;
function popup(e) { queue.push(e); if (!showing) next(); }
function next() {
  const e = queue.shift(); if (!e) { showing = false; return; }
  showing = true;
  const el = document.createElement('div'); el.className = 'pop';
  el.innerHTML = `<div class="card"><span class="tag">🎉 Новая продажа</span>${av(e)}<div class="nm">${esc(e.name)}</div>
    <div class="sm num">+${money(e.sum)}</div>${e.title ? `<div class="tt">${esc(e.title)}</div>` : ''}
    ${e.place ? `<div class="pl">${e.place} место · ${money(e.total)} за период</div>` : ''}</div>`;
  document.body.appendChild(el);
  const colors = ['#ff3d8b', '#ffc21a', '#22b8f0', '#a24bff', '#10b981', '#ff8a00'];
  for (let i = 0; i < 90; i++) {
    const c = document.createElement('i'); c.className = 'cf';
    c.style.cssText = `left:${Math.random() * 100}vw;background:${colors[i % colors.length]};animation-duration:${2.5 + Math.random() * 2.5}s;animation-delay:${Math.random() * .8}s;border-radius:${Math.random() > .5 ? '50%' : '2px'}`;
    document.body.appendChild(c); setTimeout(() => c.remove(), 6000);
  }
  chime();
  setTimeout(() => { el.remove(); next(); }, Math.min(60, Math.max(3, +D.board.screen.popupSec || 8)) * 1000);
}

/* ===== загрузка ===== */
async function load() {
  try {
    const r = await fetch(`/api/board/${KEY}` + (D ? `?since=${seq}` : ''), { cache: 'no-store' });
    const j = await r.json();
    if (!r.ok) { $('#app').innerHTML = `<div class="center"><div><b>Лидерборд не найден</b>Проверьте ссылку в кабинете</div></div>`; return setTimeout(load, 30000); }
    if (j.paused) { $('#app').innerHTML = `<div class="center"><div><b>${esc(j.name)}</b>Лидерборд на паузе</div></div>`; D = null; return setTimeout(load, 15000); }
    const first = !D; D = j;
    render();
    if (!first && D.board.screen.popup) j.events.forEach(popup);
    seq = j.seq;
    if (first) askSound();
  } catch (e) { console.warn(e); }
  setTimeout(load, 5000);
}
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 200); });
load();
</script>
