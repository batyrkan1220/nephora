<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nephora Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f1222; --muted:#9aa1b5; --muted2:#6b7286; --line:#edf0f7; --soft:#f5f7fd; --panel:#f7f9fe; --card:#fff; --bg:#eef2fb;
  --blue:#1f6bff; --blue2:#3d86ff; --purple:#d68bf7; --purple2:#cf7cf4; --yellow:#fcd94a; --green:#12b76a; --red:#ef4444;
  --sh:0 12px 30px -20px rgba(15,18,34,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
#app{position:absolute;inset:1.6vh;background:#fff;border-radius:3.2vh;box-shadow:0 30px 80px -50px rgba(31,107,255,.35);display:flex;flex-direction:column;padding:3vh 2.4vw 1.8vh;gap:1.8vh}
html.rot #app{width:calc(100vh - 3.2vw);height:calc(100vw - 3.2vh);inset:auto;left:1.6vh;top:1.6vw;transform-origin:top left;transform:translateX(calc(100vw - 3.2vh)) rotate(90deg);border-radius:3.2vw}

/* ===== шапка ===== */
.hd{display:flex;align-items:stretch;gap:1.2em;flex-wrap:wrap}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.ttl h1{margin:0;font-size:2.5em;font-weight:500;letter-spacing:-.015em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl h1 b{font-weight:500;color:var(--blue)}
.ttl .per{color:var(--muted2);font-size:1em;margin-top:.25em}
.stat{border-radius:1.4em;padding:.75em 1.2em;min-width:8.5em;display:flex;flex-direction:column;justify-content:center}
.stat small{display:block;font-size:.8em;opacity:.9}
.stat b{font-size:1.75em;font-weight:500;line-height:1.15;letter-spacing:-.01em}
.stat.plan{min-width:17em}
.stat.plan .pb{margin-top:.4em}
.stat.kb{background:linear-gradient(160deg,#3d86ff,#1f6bff);color:#fff;box-shadow:0 18px 34px -22px rgba(31,107,255,.95)}
.stat.kp{background:linear-gradient(160deg,#e3a1fb,#cf7cf4);color:#fff;box-shadow:0 18px 34px -22px rgba(200,109,242,.95)}
.stat.kw{background:var(--panel);color:var(--ink)}
.stat.kw small{color:var(--muted2)}
.stat.kb .pb .tr,.stat.kp .pb .tr{background:rgba(255,255,255,.35)}
.stat.kb .pb .tr i,.stat.kp .pb .tr i{background:#fff}
.stat.kb .pb .pc,.stat.kp .pb .pc{color:#fff}
.stat.kb .pb .ck,.stat.kp .pb .ck{background:#fff;color:var(--green)}
.clock{align-self:center;font-weight:500;font-size:1.3em;background:var(--panel);color:var(--blue);border-radius:1em;padding:.6em 1em}

/* ===== прогресс-бар ===== */
.pb{display:flex;align-items:center;gap:.6em}
.pb .tr{flex:1;height:.42em;border-radius:99px;background:#d5e3ff;overflow:hidden;position:relative}
.pb .tr i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--blue);transition:width .8s}
.pb.ok .tr i{background:var(--green)}
.pb .pc{font-weight:500;font-size:.9em;min-width:3.2em;text-align:right;color:var(--muted2)}
.pb.ok .pc{color:var(--green)}
.pb .ck{width:1.1em;height:1.1em;border-radius:50%;background:var(--green);color:#fff;display:none;place-items:center;font-size:.7em;font-weight:700;margin-left:-.3em}
.pb.ok .ck{display:grid}
.sub{font-size:.78em;color:var(--muted);margin-top:.25em;white-space:nowrap}
.sub b{color:var(--ink);font-weight:500}

/* ===== топ-3 ===== */
/* ===== таблица ===== */
.tbl{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel);border-radius:2em;padding:1em 1.2em 1.2em}
.row{display:grid;grid-template-columns:var(--cols);align-items:center;gap:1.2em;padding:0 1.2em 0 .9em}
.thd{color:var(--muted);font-size:.85em;height:2.2em}
.thd .r{text-align:right}
.thd .cnt{font-size:1em;font-weight:400}
.rows{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--gap);overflow:hidden}
.tr{height:var(--rh);flex:none;background:var(--card);border-radius:1.2em;box-shadow:var(--sh);position:relative;border-left:.3em solid transparent}
.tr .r{text-align:right}
.tr.t1{border-left-color:var(--blue)}.tr.t2{border-left-color:var(--purple2)}.tr.t3{border-left-color:var(--yellow)}
.tr.lose{background:#fff5f5;border-left-color:#fca5a5}
.tr.lose .place{background:#fee2e2;color:#dc2626}
.place{width:2em;height:2em;border-radius:.65em;display:grid;place-items:center;font-weight:600;font-size:.85em;background:var(--soft);color:var(--muted2);justify-self:center}
.t1 .place{background:var(--blue);color:#fff}.t2 .place{background:var(--purple2);color:#fff}.t3 .place{background:var(--yellow);color:var(--ink)}
.mg{display:flex;align-items:center;gap:.8em;min-width:0}
.mg .av{width:2.7em;height:2.7em;font-size:.85em}
.mg .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mg .dp{font-size:.78em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mg .w{min-width:0}
.mg .cr{display:none}
.big{font-weight:500;font-size:1.15em}
.cnt{text-align:center;font-weight:500;font-size:1.15em}
.pct small{display:block;color:var(--muted);font-size:.78em;white-space:nowrap}
.pct small em{font-style:normal;color:var(--blue)}
.el{display:inline-block;background:linear-gradient(135deg,#ffe680,#fcd94a);color:#7a5a00;font-weight:600;border-radius:99px;padding:0 .55em;margin-right:.45em;font-size:.95em}
.more{height:var(--rh);flex:none;border:1.5px dashed #d9e0ef;border-radius:1.2em;display:flex;align-items:center;gap:.8em;padding:0 1.2em;color:var(--muted2);font-size:.9em}
.more .avs{display:flex;padding-left:.3em}.more .avs .av{width:3.2em;height:3.2em;font-size:.65em;margin-left:-.7em;box-shadow:0 0 0 2px var(--panel)}
.more .rng{margin-left:auto;font-size:.85em;color:var(--muted)}
.tr.up{animation:flash 1.6s ease 3}
@keyframes flash{50%{box-shadow:0 0 0 3px var(--green),0 0 24px rgba(18,183,106,.5)}}

.av{border-radius:.9em;background:linear-gradient(135deg,#e3ecff,#f6e6ff);display:grid;place-items:center;font-weight:600;color:var(--blue);overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}

.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:.78em}
.foot .err{color:#dc2626;font-weight:500}
.center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:clamp(14px,2.4vh,26px);color:var(--muted2);padding:2em}
.center b{display:block;color:var(--ink);font-size:1.6em;font-weight:500;margin-bottom:.3em}


/* ===== секторы ===== */
.secs{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:1.2em}
.sc{background:var(--panel);border-radius:1.2em;padding:.7em 1.2em .75em;border-left:.3em solid var(--c)}
.sc .l1,.sc .l2{display:flex;align-items:center;gap:1em}
.sc .l2{margin-top:.35em}
.sc .sn{display:flex;align-items:center;gap:.5em;font-weight:500;font-size:1.05em;min-width:0;white-space:nowrap}
.sc .sn i{width:.7em;height:.7em;border-radius:.25em;background:var(--c);flex:none}
.sc .sn small{font-size:.72em;color:var(--muted);font-weight:400}
.sc .sv{margin-left:auto;color:var(--muted2);font-size:.95em;white-space:nowrap}
.sc .sv b{font-size:1.4em;font-weight:500;color:var(--ink);letter-spacing:-.01em}
.sc .l2 .pb{flex:1;min-width:6em}
.sc .l2 .sub{margin:0}
.sc .pb .tr i{background:var(--c)}
.sc .pb.ok .tr i{background:var(--green)}
.thd{position:relative}.thd .tn{position:absolute;right:0;top:-1.6em;font-size:.85em;color:var(--blue);display:none}
.md{font-weight:500;font-size:1.05em}.mu{color:var(--muted)}
.s2{display:block;color:var(--muted);font-size:.75em}
/* компактнее по высоте, чтобы топ-10 помещался целиком */
#app{gap:1.4vh}
.per .err{color:#dc2626}
.tbl{padding:.8em 1.2em 1em}
.tr .s2,.pct small{line-height:1.25}

/* ===== топ-10 + все менеджеры ===== */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:1.4em}
.main.solo{grid-template-columns:1fr}
.t10{background:linear-gradient(160deg,#eaf1ff,#f4ecff);border:1.5px solid #dbe6ff}
.t10h{display:flex;align-items:center;gap:.7em;padding:.1em .9em .45em;color:var(--muted2);font-size:.9em}
.t10b{background:linear-gradient(135deg,#3d86ff,#1f6bff);color:#fff;font-weight:600;border-radius:.6em;padding:.25em .75em;font-size:1.05em;letter-spacing:.03em;box-shadow:0 8px 18px -10px rgba(31,107,255,.9)}
.t10 .place{background:var(--blue);color:#fff}
.t10 .tr{border-left:.3em solid var(--blue)}
.rest{background:var(--panel);border-radius:2em;padding:1em 1.1em;display:flex;flex-direction:column;min-height:0}
.resth{display:flex;align-items:center;gap:.7em;padding:.1em .3em .6em;font-size:.95em}
.resth b{font-weight:500;font-size:1.1em}
.resth span{color:var(--muted)}
.resth .pg{margin-left:auto;display:flex;gap:.35em}
.resth .pg i{width:.55em;height:.55em;border-radius:50%;background:#d9e0ef}
.resth .pg i.on{background:var(--blue)}
.rlist{flex:1;min-height:0;display:grid;grid-template-rows:repeat(var(--rows),var(--rrh));grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:var(--rgap) 1em;align-content:start;overflow:hidden}
.rr{display:flex;align-items:center;gap:.65em;background:#fff;border-radius:.9em;padding:0 .9em 0 .55em;min-width:0;box-shadow:0 6px 16px -14px rgba(15,18,34,.4)}
.rr .place{width:1.8em;height:1.8em;font-size:.78em;flex:none}
.rr .av{width:1.9em;height:1.9em;font-size:.7em;border-radius:.6em}
.rr .w{flex:1;min-width:0}
.rr .nm{font-weight:500;font-size:.95em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr .dp{font-size:.7em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr .rs{text-align:right;white-space:nowrap}
.rr .rs b{font-weight:500;font-size:.98em;display:block}
.rr .rs small{font-size:.68em;color:var(--muted)}
.rr.up{animation:flash 1.6s ease 3}
html.pt .main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
html.pt .t10 .rows{flex:none}
/* ===== вертикальный экран (ТВ стоит вертикально или повёрнут) ===== */
html.pt .hd{flex-wrap:wrap;gap:1em}
html.pt .ttl{flex-basis:100%}
html.pt .ttl h1{font-size:2.8em;white-space:normal}
html.pt .stat{flex:1;min-width:0}
html.pt .stat.plan{min-width:0}
html.pt .clock{display:none}
html.pt .tbl{padding:1em}
/* ===== телефон ===== */
@media (max-width:600px){
  html,body{overflow:auto;height:auto}
  #app{position:static;margin:10px;padding:18px 14px 20px;gap:14px;font-size:13px;border-radius:26px}
  .hd{gap:8px}.ttl{flex-basis:100%}.ttl h1{font-size:1.9em;white-space:normal}
  .stat{flex:1;min-width:0}.stat.plan{min-width:100%}.clock{display:none}
  .tbl{padding:.8em .6em}
  .row{gap:.6em;padding:0 .8em 0 .4em}
  .rows{overflow:visible}
  .tr{height:auto;min-height:var(--rh);padding-block:.5em}
}

/* ===== попап продажи ===== */
.pop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(15,18,34,.4);backdrop-filter:blur(6px);animation:fade .35s}
.pop .card{position:relative;width:min(560px,86vw);border-radius:40px;padding:44px 36px 36px;text-align:center;color:#fff;overflow:hidden;
  background:linear-gradient(150deg,#3d86ff,#1f6bff 45%,#cf7cf4);box-shadow:0 40px 90px -30px rgba(31,107,255,.9);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.pop .tag{display:inline-block;background:#fff;color:var(--blue);font-weight:600;border-radius:99px;padding:8px 22px;font-size:15px}
.pop .av{width:150px;height:150px;margin:22px auto 14px;font-size:44px;border-radius:40px;background:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.5),0 18px 40px rgba(0,0,0,.2)}
.pop .nm{font-size:30px;font-weight:500}
.pop .sm{font-size:58px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:6px}
.pop .tt{opacity:.9;margin-top:6px}
.pop .pl{margin-top:16px;background:rgba(255,255,255,.22);display:inline-block;padding:7px 18px;border-radius:99px}
.cf{position:fixed;top:-20px;width:10px;height:16px;z-index:21;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes fade{from{opacity:0}}
.snd{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;background:#fff;color:var(--ink);border-radius:24px;padding:20px 24px;width:min(520px,92vw);box-shadow:0 30px 60px -20px rgba(15,18,34,.35);font-size:15px}
.snd b{font-size:18px;font-weight:500}.snd p{margin:6px 0 14px;color:var(--muted2)}
.snd button{font:inherit;font-weight:500;border:0;border-radius:14px;padding:11px 20px;cursor:pointer;background:var(--blue);color:#fff;margin-right:8px;box-shadow:0 10px 22px -12px rgba(31,107,255,.9)}
.snd button.no{background:var(--soft);color:var(--ink);box-shadow:none}
</style>
</head>
<body>
<div id="app"><div class="center">Загрузка…</div></div>

<script>
const KEY = location.pathname.split('/')[2];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => Math.round(n || 0).toLocaleString('ru-RU').replace(/\s/g, ' ') + ' ₸';
const short = n => { n = Math.round(n || 0); return n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 1 : 2).replace(/\.?0+$/, '') + ' млн' : n.toLocaleString('ru-RU').replace(/\s/g, ' '); };
const fd = k => k ? k.slice(8, 10) + '.' + k.slice(5, 7) + '.' + k.slice(0, 4) : '';
const ini = n => esc(String(n || '?').split(/\s+/).map(x => x[0]).slice(0, 2).join('').toUpperCase());
const av = (r, cls = '') => `<div class="av ${cls}">${r.photo ? `<img src="${esc(r.photo)}" alt="" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createTextNode('${ini(r.name)}'))">` : ini(r.name)}</div>`;
const CROWN = (c, cls = 'crown') => `<svg class="${cls}" viewBox="0 0 64 44"><path d="M6 14l13 12 13-20 13 20 13-12-5 26H11z" fill="${c}" stroke="rgba(0,0,0,.2)" stroke-width="1.5"/><rect x="11" y="38" width="42" height="6" rx="2" fill="${c}"/><circle cx="6" cy="13" r="3.5" fill="#fff"/><circle cx="32" cy="5" r="4" fill="#fff"/><circle cx="58" cy="13" r="3.5" fill="#fff"/></svg>`;
const CC = ['#fcd94a', '#ffffff', '#ffffff'];

function bar(v, plan, extra = '') {
  if (!plan) return `<div class="pb"><div class="tr"><i style="width:0"></i></div><span class="pc">—</span></div>${extra}`;
  const p = v / plan * 100;
  return `<div class="pb ${p >= 100 ? 'ok' : ''}"><div class="tr"><i style="width:${Math.min(100, p).toFixed(1)}%"></i></div><span class="ck">✓</span><span class="pc">${Math.floor(p)}%</span></div>${extra}`;
}

let D = null, seq = 0, prev = {};
const RP = { page: 0, pages: 1, draw: null };
setInterval(() => { if (RP.draw && RP.pages > 1) { RP.page = (RP.page + 1) % RP.pages; RP.draw(); } }, 8000);
let audio = null, soundOk = sessionStorage.getItem('lb-sound') === '1';

function setRotation() {
  const v = D && D.board.screen.orientation === 'vertical' && innerWidth > innerHeight;
  document.documentElement.classList.toggle('rot', !!v);
}
function tick() { const c = $('#clock'); if (c) c.textContent = new Date().toLocaleTimeString('ru-RU', { timeZone: 'Asia/Almaty', hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
setInterval(tick, 1000);

function render() {
  if (!D) return;
  setRotation();
  const sc = D.board.screen, cols = sc.cols, T = D.team, P = D.period;
  document.title = D.board.name + ' · Leaderboard';

  // колонки таблицы
  const ROT = document.documentElement.classList.contains('rot');
  const PH = innerWidth <= 600 && !ROT;
  // эффективный размер экрана (в повёрнутом режиме стороны меняются местами)
  const W = ROT ? innerHeight : innerWidth, HH = ROT ? innerWidth : innerHeight;
  const PT = !PH && HH > W;
  document.documentElement.classList.toggle('pt', PT);
  // масштаб от эталона 1920×1080 (вертикально 1080×1920): на любом ТВ выглядит одинаково
  $('#app').style.fontSize = PH ? '' : (PT ? Math.min(W * 0.015, HH * 0.00844) : Math.min(HH * 0.015, W * 0.00844)).toFixed(2) + 'px';

  const ALL = D.rows, SEC = D.sectors || [], N = Math.max(3, D.topN || 10);
  const R = ALL.slice(0, N), REST = ALL.slice(N);

  const SC = ['#1f6bff', '#cf7cf4', '#f5b400', '#12b76a', '#ff7a45', '#06b6d4'];
  const secCard = (x, i) => `<div class="sc" style="--c:${SC[i % SC.length]}">
      <div class="l1"><span class="sn"><i></i>${esc(x.name)}<small>${x.managers} ${plural(x.managers, 'менеджер', 'менеджера', 'менеджеров')}</small></span>
        <span class="sv num"><b>${money(x.sum)}</b>${x.plan ? ` / ${short(x.plan)} ₸` : ''}</span></div>
      <div class="l2">${x.plan ? bar(x.sum, x.plan) : '<div class="pb"><span class="sub">план не задан</span></div>'}
        <span class="sub num">сегодня <b>${short(x.daySum)}</b>${x.dayPlan ? ' / ' + short(x.dayPlan) : ''} ₸${x.plan ? ' · осталось <b>' + short(Math.max(0, x.plan - x.sum)) + '</b>' : ''}</span></div></div>`;

  const nextHint = r => r.next ? `<em> · ещё ${short(r.next.left)} до ${r.next.pct > r.commPct ? r.next.pct + '%' : 'премии'}</em>` : '';
  const rowHtml = r => {
    const up = prev[r.uid] !== undefined && prev[r.uid] < r.sum ? 'up' : '';
    let h = `<div class="tr row ${up}"><span class="place num">${r.place}</span>
      <div class="mg">${av(r)}<div class="w"><div class="nm">${esc(r.name)}</div><div class="dp">${r.elite ? '<span class="el">★ Элит</span>' : ''}${esc(r.dep)}</div></div></div>`;
    if (cols.today && !PH) h += `<span class="r num">${r.daySum ? `<b class="md">${short(r.daySum)}</b>` : '<span class="mu">—</span>'}<small class="s2">${r.dayCnt ? r.dayCnt + ' прод.' : ''}</small></span>`;
    if (cols.sales) h += `<span class="r big num">${money(r.sum)}</span>`;
    if (cols.count && !PH) h += `<span class="cnt num">${r.cnt}</span>`;
    if (cols.pct && !PH && !PT) h += `<span class="r pct num">${r.comm ? money(r.comm) : '—'}<small>${r.commPct ? (Math.round(r.commPct * 10) / 10) + '%' : ''}${nextHint(r)}</small></span>`;
    if (cols.salary && !PH) h += `<span class="r big num">${money(r.salary)}</span>`;
    return h + '</div>';
  };
  const restRow = r => `<div class="rr ${prev[r.uid] !== undefined && prev[r.uid] < r.sum ? 'up' : ''}"><span class="place num">${r.place}</span>${av(r)}
      <div class="w"><div class="nm">${esc(r.name)}</div><div class="dp">${r.elite ? '<span class="el">★</span>' : ''}${esc(r.dep)}</div></div>
      <span class="rs num"><b>${short(r.sum)}</b><small>${r.cnt} прод.${r.daySum ? ' · сегодня ' + short(r.daySum) : ''}</small></span></div>`;

  // колонки топ-10 (в горизонтальном режиме справа идёт список остальных — таблица уже)
  const C = [['2.2em', '#', ''], ['minmax(0,2.3fr)', 'Менеджер', '']];
  if (cols.today && !PH) C.push(['minmax(0,1fr)', 'Сегодня', 'r']);
  if (cols.sales) C.push(['minmax(0,1.3fr)', 'Продажи', 'r']);
  if (cols.count && !PH) C.push(['3.6em', 'Кол-во', 'cnt']);
  if (cols.pct && !PH && !PT) C.push(['minmax(0,1.7fr)', '% от продаж', 'r']);
  if (cols.salary && !PH) C.push(['minmax(0,1.2fr)', 'Зарплата', 'r']);
  const tmpl = C.map(c => c[0]).join(' ');

  $('#app').innerHTML = `
    <div class="hd">
      <div class="ttl"><h1>${esc(D.board.name.split(' ').slice(0, -1).join(' '))} <b>${esc(D.board.name.split(' ').slice(-1)[0])}</b></h1>
        <div class="per num">${esc(D.company || '')} · ${fd(P.from)} — ${fd(P.to)} · осталось раб. дней: ${P.daysLeft} · ${D.error ? `<span class="err">Bitrix24: ${esc(D.error)}</span>` : 'обновлено ' + new Date(D.syncedAt).toLocaleTimeString('ru-RU', { timeZone: 'Asia/Almaty', hour: '2-digit', minute: '2-digit' })}</div></div>
      ${T.plan ? `<div class="stat plan kb"><small>План компании · осталось ${money(T.left)}</small><b class="num">${money(T.sum)}</b>${bar(T.sum, T.plan)}</div>`
        : `<div class="stat kb"><small>Продажи компании</small><b class="num">${money(T.sum)}</b></div>`}
      ${T.dayPlan ? `<div class="stat plan kp"><small>План на сегодня · осталось ${money(T.dayLeft)}</small><b class="num">${money(T.daySum)}</b>${bar(T.daySum, T.dayPlan)}</div>`
        : `<div class="stat kp"><small>Сегодня</small><b class="num">${money(T.daySum)}</b></div>`}
      <div class="stat kw"><small>Всего продаж</small><b class="num">${T.cnt}</b></div>
      <span class="clock num" id="clock"></span>
    </div>
    ${SEC.length ? `<div class="secs" style="--n:${Math.min(SEC.length, PT ? 2 : 4)}">${SEC.map(secCard).join('')}</div>` : ''}
    <div class="main ${REST.length ? '' : 'solo'}">
      <div class="tbl t10" style="--cols:${tmpl}">
        <div class="t10h"><span class="t10b">ТОП-${N}</span><span>лучшие менеджеры периода</span></div>
        <div class="row thd">${C.map(c => `<span class="${c[2]}">${c[1]}</span>`).join('')}</div>
        <div class="rows" id="rows"></div>
      </div>
      ${REST.length ? `<div class="rest"><div class="resth"><b>Все менеджеры</b><span>места ${REST[0].place}–${REST[REST.length - 1].place}</span><span class="pg" id="pg"></span></div><div class="rlist" id="rlist"></div></div>` : ''}
    </div>`;
  tick();

  // топ-N всегда целиком: высота строки подстраивается под экран
  const box = $('#rows'), app = $('#app');
  const fs = parseFloat(getComputedStyle(app).fontSize);
  const gap = Math.round(fs * .45), n = Math.max(1, R.length);
  const rh = PH ? Math.round(fs * 3.6) : Math.max(Math.round(fs * 2.7), Math.min(Math.round(fs * 3.8), Math.floor((box.clientHeight - gap * (n - 1)) / n)));
  box.style.setProperty('--gap', gap + 'px'); box.style.setProperty('--rh', rh + 'px');
  box.innerHTML = R.length ? R.map(rowHtml).join('') : `<div class="more" style="justify-content:center">Пока нет продаж за период</div>`;

  // остальные: столько, сколько помещается; если больше — листаем страницы
  const rl = $('#rlist');
  if (rl) {
    const rrh = Math.round(fs * (PH ? 3.2 : 2.55)), rgap = Math.round(fs * .3);
    rl.style.setProperty('--rrh', rrh + 'px'); rl.style.setProperty('--rgap', rgap + 'px');
    const colsN = PT ? 2 : 1;
    const perCol = PH ? REST.length : Math.max(1, Math.floor((rl.clientHeight + rgap) / (rrh + rgap)));
    const per = perCol * colsN;
    RP.pages = Math.max(1, Math.ceil(REST.length / per)); if (RP.page >= RP.pages) RP.page = 0;
    RP.draw = () => {
      rl.style.setProperty('--rows', perCol);
      rl.innerHTML = REST.slice(RP.page * per, RP.page * per + per).map(restRow).join('');
      const pg = $('#pg'); if (pg) pg.innerHTML = RP.pages > 1 ? Array.from({ length: RP.pages }, (_, k) => `<i class="${k === RP.page ? 'on' : ''}"></i>`).join('') : '';
    };
    RP.draw();
  } else RP.draw = null;
  prev = Object.fromEntries(ALL.map(r => [r.uid, r.sum]));
}
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };

/* ===== звук и попап ===== */
function chime() {
  if (!soundOk || !D.board.screen.sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audio.currentTime;
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0 + i * .11); g.gain.linearRampToValueAtTime(.25, t0 + i * .11 + .02); g.gain.exponentialRampToValueAtTime(.001, t0 + i * .11 + .6);
      o.connect(g).connect(audio.destination); o.start(t0 + i * .11); o.stop(t0 + i * .11 + .7);
    });
  } catch {}
}
function askSound() {
  if (soundOk || !D.board.screen.sound || !D.board.screen.popup || $('.snd')) return;
  const el = document.createElement('div'); el.className = 'snd';
  el.innerHTML = `<b>Включить звук?</b><p>Браузер не играет звук сам. Нажмите «Разрешить», чтобы слышать звук новой продажи.</p><button class="yes">Разрешить</button><button class="no">Без звука</button>`;
  document.body.appendChild(el);
  el.querySelector('.yes').onclick = () => { soundOk = true; sessionStorage.setItem('lb-sound', '1'); audio = new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); el.remove(); };
  el.querySelector('.no').onclick = () => el.remove();
}
const queue = []; let showing = false;
function popup(e) { queue.push(e); if (!showing) next(); }
function next() {
  const e = queue.shift(); if (!e) { showing = false; return; }
  showing = true;
  const el = document.createElement('div'); el.className = 'pop';
  el.innerHTML = `<div class="card"><span class="tag">🎉 Новая продажа</span>${av(e)}<div class="nm">${esc(e.name)}</div>
    <div class="sm num">+${money(e.sum)}</div>${e.title ? `<div class="tt">${esc(e.title)}</div>` : ''}
    ${e.place ? `<div class="pl">${e.place} место · ${money(e.total)} за период</div>` : ''}</div>`;
  document.body.appendChild(el);
  const colors = ['#1f6bff', '#3d86ff', '#d68bf7', '#cf7cf4', '#fcd94a', '#12b76a'];
  for (let i = 0; i < 90; i++) {
    const c = document.createElement('i'); c.className = 'cf';
    c.style.cssText = `left:${Math.random() * 100}vw;background:${colors[i % colors.length]};animation-duration:${2.5 + Math.random() * 2.5}s;animation-delay:${Math.random() * .8}s;border-radius:${Math.random() > .5 ? '50%' : '2px'}`;
    document.body.appendChild(c); setTimeout(() => c.remove(), 6000);
  }
  chime();
  setTimeout(() => { el.remove(); next(); }, Math.min(60, Math.max(3, +D.board.screen.popupSec || 8)) * 1000);
}

/* ===== загрузка ===== */
async function load() {
  try {
    const r = await fetch(`/api/board/${KEY}` + (D ? `?since=${seq}` : ''), { cache: 'no-store' });
    const j = await r.json();
    if (!r.ok) { $('#app').innerHTML = `<div class="center"><div><b>Лидерборд не найден</b>Проверьте ссылку в кабинете</div></div>`; return setTimeout(load, 30000); }
    if (j.paused) { $('#app').innerHTML = `<div class="center"><div><b>${esc(j.name)}</b>Лидерборд на паузе</div></div>`; D = null; return setTimeout(load, 15000); }
    const first = !D; D = j;
    render();
    if (!first && D.board.screen.popup) j.events.forEach(popup);
    seq = j.seq;
    if (first) askSound();
  } catch (e) { console.warn(e); }
  setTimeout(load, 5000);
}
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 200); });
load();
</script>
