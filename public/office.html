<script>
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const FB = {}; const pages = {};
try { localStorage.setItem('ofDemo', '1'); } catch {}
// 3D-офис ботов: пол, стены, столы — настоящие 3D-плоскости; боты, мониторы и таблички — «билборды», всегда лицом к зрителю
const bot3 = (c, idle) => `<svg class="bot3 ${idle ? 'idle' : ''}" viewBox="0 0 150 170">
  <rect x="28" y="70" width="94" height="88" rx="18" fill="#2B2F45"/><rect x="36" y="78" width="78" height="70" rx="14" fill="#3B4060"/>
  <rect x="47" y="84" width="56" height="54" rx="16" fill="${c}"/><rect x="58" y="96" width="34" height="20" rx="6" fill="#fff" opacity=".92"/>
  <rect x="62" y="104" width="26" height="3" rx="1.5" fill="${c}" class="ant"/>
  <rect x="30" y="90" width="15" height="40" rx="7.5" fill="${c}" class="al"/><rect x="105" y="90" width="15" height="40" rx="7.5" fill="${c}" class="ar"/>
  <g class="hd"><rect x="73" y="4" width="4" height="12" rx="2" fill="#9AA0BC"/><circle cx="75" cy="5" r="5" fill="${c}" class="ant"/>
    <rect x="42" y="14" width="66" height="56" rx="26" fill="#F4F5FA" stroke="#D5D8E6" stroke-width="2.5"/>
    <rect x="50" y="26" width="50" height="30" rx="14" fill="#151833"/>
    <ellipse class="eye" cx="64" cy="41" rx="6" ry="7" fill="${c}"/><ellipse class="eye" cx="86" cy="41" rx="6" ry="7" fill="${c}"/>
    <circle cx="66" cy="38" r="2" fill="#fff"/><circle cx="88" cy="38" r="2" fill="#fff"/>
    <rect x="36" y="34" width="8" height="16" rx="4" fill="${c}"/><rect x="106" y="34" width="8" height="16" rx="4" fill="${c}"/></g></svg>`;
const box3 = (cls, x, y, w, d, h, inner = '') => `<div class="box ${cls}" style="left:${x}px;top:${y}px;width:${w}px;height:${d}px;--h:${h}px"><div class="s"></div><div class="f"></div><div class="t"></div>${inner}</div>`;
const bb = (x, y, z, w, hgt, html, cls = '') => `<div class="bb ${cls}" style="left:${x - w / 2}px;top:${y - hgt}px;width:${w}px;height:${hgt}px;--z:${z}px">${html}</div>`;
let OFC = null;
const OF = { demo: (() => { try { return localStorage.getItem('ofDemo') !== '0'; } catch { return true; } })() };
// демо-данные: правдоподобные, но выдуманные (номера скрыты, имена случайные)
const DM = (() => {
  const R = a => a[Math.floor(Math.random() * a.length)], N = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const who = ['Айгерим', 'Данияр', 'Асель', 'Ерлан', 'Мадина', 'Нурсултан', 'Дана', 'Алихан', 'Жансая', 'Тимур', 'Аружан', 'Бекзат'];
  const sec = ['Gold', 'Hunter', 'Alpha', 'Prime', 'Star', 'Elite'];
  const ph = () => `+7 7${N(0, 7)}• ••• ${N(10, 99)} ${N(10, 99)}`, dl = () => '#' + N(18100, 19400);
  const T = {
    calls: [() => `Пропущенный ${ph()} → перезвонить: ${R(who)}`, () => `Звонок ${N(6, 19)} сек — слабый разговор, ${R(who)}`, () => `Недозвон ×${N(3, 5)} по сделке ${dl()} — сменить время`,
      () => `Клиент ждёт звонка ${N(20, 90)} мин — ${R(who)}`, () => `AI-оценка ${N(38, 55)}/100 — разобрать звонок с ${R(who)}`, () => `✓ Перезвонили ${ph()} за ${N(2, 9)} мин`],
    logi: [() => `Доставка ${dl()} висит ${N(3, 7)} дн. — уточнить у курьера`, () => `Оплата по ${dl()} не подтверждена банком`, () => `Отказ банка ${dl()} — предложить рассрочку`,
      () => `Адрес не заполнен — ${dl()}, ${R(who)}`, () => `✓ ${dl()} доставлено и оплачено`, () => `Курьер не взял заказ ${dl()} — сегодня`],
    wa: [() => `${ph()} написал — не попал в «Новая сделка»`, () => `Ответ через ${N(25, 140)} мин — ${R(who)}`, () => `Повторное обращение ${ph()} → старая сделка ${dl()}`,
      () => `Без ответа ${N(15, 60)} мин — ${ph()}`, () => `✓ Обращение ${ph()} передано на Админа`, () => `Новый клиент ${ph()} — создана сделка ${dl()}`],
    kassa: [() => `Сверка Kaspi: ${dl()} ✓ совпадает`, () => `Оплата без сделки — найти владельца`, () => `Возврат по ${dl()} — проверить`, () => `✓ Касса сектора ${R(sec)} сверена`, () => `Дубль оплаты ${dl()} — отметить`],
    qc: [() => `Разбор звонка ${R(who)}: ${N(70, 96)}/100 ✓`, () => `Скрипт не соблюдён — ${R(who)}, этап «возражения»`, () => `Не названа цена — ${R(who)}`, () => `✓ Лучший звонок дня — ${R(who)}`, () => `Грубость не найдена · ${N(40, 120)} звонков проверено`],
  };
  const REP = [() => `Собираю отчёт по звонкам · сектор ${R(sec)}…`, () => `Сверка заказов с логистикой… ${N(60, 99)}%`, () => `Конверсия WhatsApp → сделка ✓`, () => `Рейтинг менеджеров обновлён ✓`,
    () => `Скорость ответа по секторам ✓`, () => `Выкуп по сектору ${R(sec)} пересчитан ✓`, () => `Посещаемость за смену ✓`, () => `Готовлю утренний отчёт руководителю…`, () => `Отправлено в WhatsApp руководителю ✓`];
  const BOTS = [
    { id: 'calls', name: 'Звонок-бот', role: 'Звонки и перезвоны', color: '#4B4FE8' }, { id: 'logi', name: 'Логистика-бот', role: 'Доставка и оплаты', color: '#F59E0B' },
    { id: 'wa', name: 'WhatsApp-бот', role: 'Потерянные обращения', color: '#25A244' }, { id: 'report', name: 'Есеп-бот', role: 'Отчёты', color: '#0EA5E9' },
    { id: 'kassa', name: 'Касса-бот', role: 'Сверка оплат', color: '#EC4899' }, { id: 'qc', name: 'Контроль-бот', role: 'Качество звонков', color: '#8B5CF6' }];
  return { line: id => (id === 'report' ? R(REP) : R(T[id] || T.calls))(), BOTS, N };
})();
const BI = { calls: '📞', logi: '🚚', wa: '💬', report: '📊', kassa: '💳', qc: '🎧' };
function officeHTML(d) {
  const ago = t => !t ? '—' : Math.round((Date.now() - t) / 60000) < 1 ? 'только что' : Math.round((Date.now() - t) / 60000) + ' мин назад';
  const hr = +new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Almaty', hour: 'numeric', hour12: false }).format(new Date());
  const sky = hr >= 7 && hr < 17 ? 'linear-gradient(#7CC4FF,#CDEBFF)' : hr >= 17 && hr < 20 ? 'linear-gradient(#FF9A6B,#FFD39A)' : hr >= 5 && hr < 7 ? 'linear-gradient(#6C7BD8,#FFC7A1)' : 'linear-gradient(#0B1240,#273070)';
  const night = hr < 6 || hr >= 20, fill = night ? '#141A45' : '#8FA3C7';
  // силуэт Астаны: Байтерек, «Хан Шатыр», башни
  const city = `<svg viewBox="0 0 300 100" preserveAspectRatio="none"><path fill="${fill}" d="M0 100V62h18V44h16v18h12V30h20v70zM70 100V40h22v60zM96 100V58h10V36h18v64zM176 100V52h18V30h22v70zM220 100V60h20V44h22v56h38v0z"/>
    <path fill="${fill}" d="M132 100l6-22h2l-2-34c0-6 4-10 9-10s9 4 9 10l-2 34h2l6 22z"/><circle cx="147" cy="31" r="9" fill="${night ? '#FDE68A' : '#F5C542'}"/>
    <path fill="${fill}" d="M262 100l12-40 12 40z"/>
    ${night ? Array.from({ length: 24 }, (_, i) => `<rect x="${(i * 41) % 290 + 4}" y="${50 + (i * 23) % 44}" width="4" height="5" fill="#FDE68A" opacity=".85"/>`).join('') : ''}</svg>`;
  const bots = OF.demo ? DM.BOTS.map(b => ({ ...b, open: b.id === 'report' ? 0 : DM.N(3, 24), last: Date.now() - DM.N(0, 9) * 6e4 }))
    : d.bots.map(b => ({ ...b }));
  const open = OF.demo ? bots.reduce((a, b) => a + b.open, 0) : d.tasks.filter(t => t.status === 'open').length;
  const done24 = OF.demo ? DM.N(60, 140) : d.tasks.filter(t => t.status !== 'open' && Date.now() - (t.doneAt || t.at) < 864e5).length;
  const POS = bots.length > 4 ? [[90, 400], [520, 400], [950, 400], [90, 760], [520, 760], [950, 760]] : [[180, 420], [760, 420], [180, 760], [760, 760]];

function officeStart(d) {

    p.x = e.clientX; p.y = e.clientY;

  const mons = [...el.querySelectorAll('.lns')].map(n => ({ n, id: n.dataset.id, L: JSON.parse(n.dataset.lines), i: 0, ch: 0 }));
  const paint = m => { const rows = m.n.children, k = m.L.length;
    for (let r = 0; r < rows.length; r++) { const idx = m.i - (rows.length - 1 - r), show = idx >= 0 && m.i - idx < k, txt = show ? m.L[((idx % k) + k) % k] : '';
      rows[r].className = 'ln' + (r === rows.length - 1 ? ' cur' : ''); rows[r].textContent = r === rows.length - 1 ? txt.slice(0, m.ch) : txt; } };
  mons.forEach(m => { m.i = Math.min(3, m.L.length - 1); m.ch = 999; paint(m); m.i++; m.ch = 0; });

  function tick() { const c = $('#ofClock'); if (!c) return; const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Almaty', hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: false }).formatToParts(new Date());
    const v = k => +p.find(x => x.type === k).value, h = v('hour') % 12, mi = v('minute'), se = v('second');
    c.querySelector('.h').style.transform = `rotate(${h * 30 + mi / 2}deg)`; c.querySelector('.m').style.transform = `rotate(${mi * 6}deg)`; c.querySelector('.s').style.transform = `rotate(${se * 6}deg)`; }

function flyTask(el, mon) {
