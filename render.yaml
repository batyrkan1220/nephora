services:
  - type: web
    name: nephora-leaderboard
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: BITRIX_WEBHOOK
        sync: false
      - key: DASH_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nephora-leaderboard-db
          property: connectionString

databases:
  - name: nephora-leaderboard-db
    region: frankfurt
    plan: free
    databaseName: leaderboard
