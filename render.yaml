services:
  - type: web
    name: nephora-leaderboard
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: BITRIX_WEBHOOK
        sync: false
      - key: DASH_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # основная база — Supabase (Settings → Database → Connection string → Session pooler)
      - key: SUPABASE_DB_URL
        sync: false
      - key: WAZZUP_API_KEY
        sync: false
